{t:"Ghép câu bổ ngữ kết quả: 完, 好, 到",g:"Động từ + 完 = làm xong hết. + 好 = làm xong và ổn thỏa. + 到 = đạt được, tới nơi, tìm được. 了 đứng sau bổ ngữ. Phủ định: 没 + động từ + kết quả (没做完), bỏ 了.",gr:[{h:"động từ + 完 (xong, hết)",o:"C=完 (xong, hết)",it:[["S我 V做 C完 M了 O作业","wǒ zuò wán le zuòyè","Tôi làm xong bài tập rồi"],["S你 V吃 C完 M了 M吗？","nǐ chī wán le ma?","Bạn ăn xong chưa?"],["S这本书 S我 V看 C完 M了","zhè běn shū wǒ kàn wán le","Quyển sách này tôi đọc xong rồi"],["S他 V说 C完 D就 V走 M了","tā shuō wán jiù zǒu le","Anh ấy nói xong là đi luôn"],["S钱 V花 C完 M了","qián huā wán le","Tiền tiêu hết rồi"],["S我 Z没 V听 C完","wǒ méi tīng wán","Tôi chưa nghe hết"],["S工作 D还 Z没 V干 C完","gōngzuò hái méi gàn wán","Việc vẫn chưa làm xong"],["S牛奶 V喝 C完 M了","niúnǎi hē wán le","Sữa uống hết rồi"],["S你 V用 C完 D请 D还 O我","nǐ yòng wán qǐng huán wǒ","Bạn dùng xong thì trả tôi"],["S会 V开 C完 M了 M吗？","huì kāi wán le ma?","Họp xong chưa?"]]},

{t:"Ghép câu bổ ngữ khả năng: V得 / Z不 + kết quả",g:"Chèn 得 (được) hoặc 不 (không) giữa động từ và bổ ngữ: 听得懂 = nghe hiểu được, 听不懂 = nghe không hiểu. Khẩu ngữ dùng kiểu này nhiều hơn 能 + động từ khi nói về khả năng thực tế.",gr:[{h:"V得 + kết quả (làm được)",o:"K=得 (được);C=kết quả",it:[["S我 V听 K得 C懂","wǒ tīng de dǒng","Tôi nghe hiểu được"],["S这么多菜 S我 V吃 K得 C完","zhème duō cài wǒ chī de wán","Nhiều món thế này tôi ăn hết được"],["S你 V看 K得 C见 M吗？","nǐ kàn de jiàn ma?","Bạn nhìn thấy được không?"],["T今天 V做 K得 C完 M吗？","jīntiān zuò de wán ma?","Hôm nay làm xong được không?"],["S我 V找 K得 C到","wǒ zhǎo de dào","Tôi tìm được"],["S这个字 S你 V认 K得 C出来 M吗？","zhège zì nǐ rèn de chūlai ma?","Chữ này bạn nhận ra được không?"],["S他 V跑 K得 C动","tā pǎo de dòng","Anh ấy chạy nổi"],["S箱子 S我 V拿 K得 C动","xiāngzi wǒ ná de dòng","Va li tôi xách nổi"],["S你 V听 K得 C清楚 M吗？","nǐ tīng de qīngchu ma?","Bạn nghe rõ không?"],["S我 V学 K得 C会","wǒ xué de huì","Tôi học được"]]},

{t:"Ghép câu với 不了 / 得了 (liǎo)",g:"Động từ + 得了 / 不了 (đọc liǎo) = làm nổi / không làm nổi, xảy ra được / không được. 受不了 = chịu không nổi. 了不起 = giỏi, ghê gớm. Đừng nhầm với 了 (le) chỉ việc đã xong.",gr:[{h:"V + 不了 (không nổi, không được)",o:"K=不了 (không nổi)",it:[["S我 V吃 K不了 L这么多","wǒ chī bu liǎo zhème duō","Tôi ăn không nổi nhiều thế này"],["S我 T明天 V去 K不了","wǒ míngtiān qù bu liǎo","Mai tôi không đi được"],["S我 V受 K不了 M了","wǒ shòu bu liǎo le","Tôi chịu không nổi nữa"],["S他 V来 K不了 M了","tā lái bu liǎo le","Anh ấy không đến được rồi"],["S这件事 S我 V帮 K不了 O你","zhè jiàn shì wǒ bāng bu liǎo nǐ","Việc này tôi không giúp bạn được"],["T今天 V下 K不了 O雨","jīntiān xià bu liǎo yǔ","Hôm nay không mưa được đâu"],["S我 V忘 K不了 O你","wǒ wàng bu liǎo nǐ","Tôi không quên được bạn"],["S这么多工作 S我 V做 K不了","zhème duō gōngzuò wǒ zuò bu liǎo","Nhiều việc thế tôi làm không xuể"],["S他 V喝 K不了 O酒","tā hē bu liǎo jiǔ","Anh ấy không uống được rượu"],["S手机 V用 K不了 M了","shǒujī yòng bu liǎo le","Điện thoại không dùng được nữa"]]},

{t:"Ghép câu kiêm ngữ với 让, 叫, 使, 令",g:"A + 让 / 叫 + B + động từ = A bảo / để B làm gì. B vừa là tân ngữ của 让 vừa là chủ ngữ của động từ sau. 使 / 令 + B + tính từ = khiến B (cảm xúc), văn viết.",gr:[{h:"让 + người + làm gì (bảo, để)",o:"K=让 (bảo, để);O=người làm",it:[["S老板 K让 O我 V明天 V来","lǎobǎn ràng wǒ míngtiān lái","Sếp bảo tôi mai đến"],["S妈妈 K让 O我 D早点儿 V回家","māma ràng wǒ zǎo diǎnr huí jiā","Mẹ bảo tôi về nhà sớm"],["K让 O我 V想想","ràng wǒ xiǎngxiang","Để tôi nghĩ đã"],["K让 O他 V进来","ràng tā jìnlai","Để anh ấy vào"],["S医生 K让 O我 A多 V休息","yīshēng ràng wǒ duō xiūxi","Bác sĩ bảo tôi nghỉ nhiều"],["S他 Z不 K让 O我 V去","tā bú ràng wǒ qù","Anh ấy không cho tôi đi"],["K让 O我 V来 V帮 O你","ràng wǒ lái bāng nǐ","Để tôi giúp bạn"],["S组长 K让 O大家 D先 V休息","zǔzhǎng ràng dàjiā xiān xiūxi","Tổ trưởng bảo mọi người nghỉ trước"],["K让 O你 V久等 M了","ràng nǐ jiǔ děng le","Để bạn đợi lâu rồi"],["S谁 K让 O你 V来 M的？","shéi ràng nǐ lái de?","Ai bảo bạn đến?"]]},
{h:"叫 + người + làm gì (gọi, bảo)",o:"K=叫 (gọi, bảo);O=người làm",it:[["S老师 K叫 O你 V去 P办公室","lǎoshī jiào nǐ qù bàngōngshì","Thầy gọi bạn lên văn phòng"],["S妈妈 K叫 O你 V吃 O饭","māma jiào nǐ chī fàn","Mẹ gọi bạn ăn cơm"],["K叫 O他 V明天 D再 V来","jiào tā míngtiān zài lái","Bảo anh ấy mai lại đến"],["S经理 K叫 O我 V写 O报告","jīnglǐ jiào wǒ xiě bàogào","Quản lý bảo tôi viết báo cáo"],["K叫 O维修工 V来 V看看","jiào wéixiūgōng lái kànkan","Gọi thợ sửa đến xem"],["S谁 K叫 O你 V动 O我的东西？","shéi jiào nǐ dòng wǒ de dōngxi?","Ai bảo bạn động vào đồ của tôi?"],["K叫 O大家 V安静","jiào dàjiā ānjìng","Bảo mọi người im lặng"],["S他 K叫 O我 Z别 V担心","tā jiào wǒ bié dānxīn","Anh ấy bảo tôi đừng lo"],["K叫 O孩子们 V进来","jiào háizimen jìnlai","Gọi bọn trẻ vào"],["S她 K叫 O我 V帮 O她 V买 O药","tā jiào wǒ bāng tā mǎi yào","Cô ấy nhờ tôi mua thuốc"]]},

{t:"Ghép câu kiêm ngữ với 请, 派, 求, 劝, 帮",g:"请 + người + làm gì = mời / nhờ ai làm. 派 = cử. 求 = cầu xin. 劝 = khuyên. 帮 = giúp. Người nhận đứng ngay sau những động từ này.",gr:[{h:"请 + người + làm gì (mời, nhờ)",o:"K=请 (mời, nhờ);O=người",it:[["S我 K请 O你 V吃 O饭","wǒ qǐng nǐ chī fàn","Tôi mời bạn ăn cơm"],["K请 O你 V帮 O我 L一下","qǐng nǐ bāng wǒ yíxià","Nhờ bạn giúp tôi chút"],["S公司 K请 O专家 V来 V培训","gōngsī qǐng zhuānjiā lái péixùn","Công ty mời chuyên gia đến đào tạo"],["K请 O大家 V坐","qǐng dàjiā zuò","Mời mọi người ngồi"],["S他 K请 O我 V参加 O婚礼","tā qǐng wǒ cānjiā hūnlǐ","Anh ấy mời tôi dự đám cưới"],["K请 O您 V签 L一下 O字","qǐng nín qiān yíxià zì","Mời ông ký tên"],["S我们 K请 O老师 V吃 M了 L一顿 O饭","wǒmen qǐng lǎoshī chī le yí dùn fàn","Chúng tôi mời thầy một bữa cơm"],["K请 O你 Z别 V抽烟","qǐng nǐ bié chōu yān","Xin bạn đừng hút thuốc"],["K请 O他 V回 L个 O电话","qǐng tā huí ge diànhuà","Nhờ anh ấy gọi lại"],["S我 V想 K请 O你 V做 L一件 O事","wǒ xiǎng qǐng nǐ zuò yí jiàn shì","Tôi muốn nhờ bạn một việc"]]},
{h:"派 / 求 / 劝 + người + làm gì",o:"K=派 (cử) / 求 (xin) / 劝 (khuyên)",it:[["S公司 K派 O我 V去 P上海","gōngsī pài wǒ qù Shànghǎi","Công ty cử tôi đi Thượng Hải"],["S老板 K派 O他 V去 V接 O客户","lǎobǎn pài tā qù jiē kèhù","Sếp cử anh ấy đi đón khách"],["K派 L两个 O人 V去 V帮忙","pài liǎng ge rén qù bāng máng","Cử hai người đi giúp"],["S我 K求 O你 V帮帮 O我","wǒ qiú nǐ bāngbang wǒ","Tôi xin bạn giúp tôi"],["S他 K求 O我 Z别 V告诉 O别人","tā qiú wǒ bié gàosu biérén","Anh ấy xin tôi đừng nói với ai"],["S大家 K劝 O他 Z别 V喝 M了","dàjiā quàn tā bié hē le","Mọi người khuyên anh ấy đừng uống nữa"],["S医生 K劝 O我 V戒 O烟","yīshēng quàn wǒ jiè yān","Bác sĩ khuyên tôi bỏ thuốc"],["S我 K劝 O你 V好好 V想想","wǒ quàn nǐ hǎohǎo xiǎngxiang","Tôi khuyên bạn nghĩ kỹ đi"],["S妈妈 K劝 O我 V找 L个 O对象","māma quàn wǒ zhǎo ge duìxiàng","Mẹ khuyên tôi tìm người yêu"],["S他 K劝 O我 V去 V看 O医生","tā quàn wǒ qù kàn yīshēng","Anh ấy khuyên tôi đi khám"]]},
{h:"帮 / 陪 / 催 / 教 + người + làm gì",o:"K=帮 (giúp) / 陪 (đi cùng) / 催 (giục) / 教 (dạy)",it:[["S我 K帮 O你 V拿","wǒ bāng nǐ ná","Tôi cầm giúp bạn"],["K帮 O我 V叫 L一辆 O车","bāng wǒ jiào yí liàng chē","Gọi giúp tôi một chiếc xe"],["S她 K帮 O妈妈 V做 O家务","tā bāng māma zuò jiāwù","Cô ấy giúp mẹ làm việc nhà"],["S我 K陪 O你 V去 P医院","wǒ péi nǐ qù yīyuàn","Tôi đi bệnh viện cùng bạn"],["S他 K陪 O我 V聊 M了 L一晚上","tā péi wǒ liáo le yì wǎnshang","Anh ấy trò chuyện với tôi cả tối"],["S老板 K催 O我们 V快点儿 V做","lǎobǎn cuī wǒmen kuài diǎnr zuò","Sếp giục chúng tôi làm nhanh"],["S客户 K催 O我们 V发货","kèhù cuī wǒmen fā huò","Khách giục chúng tôi giao hàng"],["S师傅 K教 O我 V用 O这台机器","shīfu jiāo wǒ yòng zhè tái jīqì","Thợ cả dạy tôi dùng máy này"],["S你 K教 O我 V说 O中文 M吧","nǐ jiāo wǒ shuō Zhōngwén ba","Bạn dạy tôi nói tiếng Trung đi"],["S我 K陪 O孩子 V做 O作业","wǒ péi háizi zuò zuòyè","Tôi ngồi cùng con làm bài tập"]]}],d:[]},
{t:"Ghép câu với 有 + người / vật + động từ",g:"有 + người + động từ = có người làm gì: 有人找你. 有 + danh từ + động từ = có… để làm: 有时间去, 有钱买. 没有 + … = không có… để làm.",gr:[{h:"有人 / 有个人 + động từ",o:"K=有人 (có người)",it:[["K有人 V找 O你","yǒu rén zhǎo nǐ","Có người tìm bạn"],["K有人 V在 V敲 O门","yǒu rén zài qiāo mén","Có người đang gõ cửa"],["K有人 V给 O你 V打 O电话","yǒu rén gěi nǐ dǎ diànhuà","Có người gọi điện cho bạn"],["K有人 V说 S他 V要 V走 M了","yǒu rén shuō tā yào zǒu le","Có người nói anh ấy sắp đi"],["P这儿 K有人 V坐 M吗？","zhèr yǒu rén zuò ma?","Chỗ này có ai ngồi chưa?"],["K有个人 V在 P门口 V等 O你","yǒu ge rén zài ménkǒu děng nǐ","Có một người đợi bạn ở cửa"],["K有人 V喜欢 A热， K有人 V喜欢 A冷","yǒu rén xǐhuan rè, yǒu rén xǐhuan lěng","Có người thích nóng, có người thích lạnh"],["K有人 V知道 S他 V去 Q哪儿 M了 M吗？","yǒu rén zhīdào tā qù nǎr le ma?","Có ai biết anh ấy đi đâu không?"],["K没人 V在 P家","méi rén zài jiā","Không ai ở nhà"],["K没人 V知道 O这件事","méi rén zhīdào zhè jiàn shì","Không ai biết việc này"]]},
{h:"有 / 没有 + danh từ + động từ (có… để làm)",o:"K=有 / 没有 (có / không có);O=thứ có",it:[["S我 K有 O时间 V陪 O你","wǒ yǒu shíjiān péi nǐ","Tôi có thời gian đi cùng bạn"],["S他 K没有 O钱 V买 O车","tā méiyǒu qián mǎi chē","Anh ấy không có tiền mua xe"],["S我 K有 L一件 O事 V要 V告诉 O你","wǒ yǒu yí jiàn shì yào gàosu nǐ","Tôi có một việc muốn nói với bạn"],["S你 K有 O办法 V解决 M吗？","nǐ yǒu bànfǎ jiějué ma?","Bạn có cách giải quyết không?"],["S我 K没有 O理由 V拒绝","wǒ méiyǒu lǐyóu jùjué","Tôi không có lý do từ chối"],["S他 K有 O能力 V做 O这个工作","tā yǒu nénglì zuò zhège gōngzuò","Anh ấy có năng lực làm việc này"],["S我 K没有 O心情 V吃 O饭","wǒ méiyǒu xīnqíng chī fàn","Tôi không có tâm trạng ăn"],["S我们 K有 O机会 V见面","wǒmen yǒu jīhuì jiàn miàn","Chúng ta có cơ hội gặp nhau"],["S你 K有 O空 V来 V玩","nǐ yǒu kòng lái wán","Bạn rảnh thì đến chơi"],["S我 K没有 O地方 V住","wǒ méiyǒu dìfang zhù","Tôi không có chỗ ở"]]},
{h:"有 + đồ vật + 可以 / 能 + động từ",o:"K=有 / 没有;O=thứ có",it:[["P家里 K有 O吃的 M吗？","jiā li yǒu chī de ma?","Ở nhà có gì ăn không?"],["P这儿 K没有 O喝的","zhèr méiyǒu hē de","Ở đây không có gì uống"],["S我 K没有 O什么 V可以 V说 M的","wǒ méiyǒu shénme kěyǐ shuō de","Tôi không có gì để nói"],["S你 K有 O问题 D可以 V问 O我","nǐ yǒu wèntí kěyǐ wèn wǒ","Bạn có câu hỏi có thể hỏi tôi"],["P这里 K有 A很多 O地方 H可以 V玩","zhèlǐ yǒu hěn duō dìfang kěyǐ wán","Ở đây có nhiều chỗ để chơi"],["S我 K没 V什么 V好 V说 M的","wǒ méi shénme hǎo shuō de","Tôi chẳng có gì để nói"],["S他 K有 O话 V要 V说","tā yǒu huà yào shuō","Anh ấy có điều muốn nói"],["P附近 K有 O吃饭的地方 M吗？","fùjìn yǒu chī fàn de dìfang ma?","Gần đây có chỗ ăn không?"],["S我 K有 L两张 O票， D一起 V去 M吧","wǒ yǒu liǎng zhāng piào, yìqǐ qù ba","Tôi có hai vé, cùng đi nhé"],["S你 K有 Q什么 V要 V买 M的？","nǐ yǒu shénme yào mǎi de?","Bạn có gì cần mua không?"]]}],d:[]},
{t:"Ghép câu với từ hỏi lặp: 什么…什么, 谁…谁, 哪儿…哪儿",g:"Hai từ hỏi giống nhau ở hai vế, chỉ cùng một thứ: 想吃什么就吃什么 = muốn ăn gì thì ăn nấy. Vế sau thường có 就.",gr:[{h:"什么…就…什么",o:"K=什么…什么 (gì… nấy)",it:[["S你 H想 V吃 K什么 D就 V吃 K什么","nǐ xiǎng chī shénme jiù chī shénme","Bạn muốn ăn gì thì ăn nấy"],["S你 V喜欢 K什么 D就 V买 K什么","nǐ xǐhuan shénme jiù mǎi shénme","Bạn thích gì thì mua nấy"],["V有 K什么 D就 V吃 K什么","yǒu shénme jiù chī shénme","Có gì ăn nấy"],["S他 V说 K什么 S我 D就 V做 K什么","tā shuō shénme wǒ jiù zuò shénme","Anh ấy nói gì tôi làm nấy"],["S你 V需要 K什么 D就 V拿 K什么","nǐ xūyào shénme jiù ná shénme","Bạn cần gì cứ lấy nấy"],["V想 V说 K什么 D就 V说 K什么","xiǎng shuō shénme jiù shuō shénme","Muốn nói gì thì nói nấy"],["S孩子 V看见 K什么 D就 V要 K什么","háizi kànjiàn shénme jiù yào shénme","Đứa bé thấy gì đòi nấy"],["S你 V点 K什么 S我 D就 V吃 K什么","nǐ diǎn shénme wǒ jiù chī shénme","Bạn gọi gì tôi ăn nấy"],["V缺 K什么 D就 V补 K什么","quē shénme jiù bǔ shénme","Thiếu gì bổ sung nấy"],["S你 V会 K什么 D就 V做 K什么","nǐ huì shénme jiù zuò shénme","Bạn biết gì làm nấy"]]},
{h:"谁…谁 / 哪儿…哪儿",o:"K=谁…谁 (ai… người ấy) / 哪儿…哪儿 (đâu… đó)",it:[["K谁 D先 V到 K谁 D先 V吃","shéi xiān dào shéi xiān chī","Ai đến trước người đó ăn trước"],["K谁 V做 C错 M了 K谁 V负责","shéi zuò cuò le shéi fùzé","Ai làm sai người đó chịu"],["K谁 H想 V去 K谁 D就 V去","shéi xiǎng qù shéi jiù qù","Ai muốn đi thì người đó đi"],["K谁 V赢 M了 K谁 V请客","shéi yíng le shéi qǐng kè","Ai thắng người đó mời"],["K谁 V知道 K谁 V说","shéi zhīdào shéi shuō","Ai biết thì nói"],["S你 H想 V去 K哪儿 S我们 D就 V去 K哪儿","nǐ xiǎng qù nǎr wǒmen jiù qù nǎr","Bạn muốn đi đâu chúng ta đi đó"],["K哪儿 A便宜 D就 V去 K哪儿 V买","nǎr piányi jiù qù nǎr mǎi","Chỗ nào rẻ thì đến đó mua"],["S他 V走 V到 K哪儿 D就 V拍 V到 K哪儿","tā zǒu dào nǎr jiù pāi dào nǎr","Anh ấy đi đến đâu chụp đến đó"],["K哪儿 A凉快 D就 V去 K哪儿","nǎr liángkuai jiù qù nǎr","Chỗ nào mát thì đi chỗ đó"],["K哪儿 V需要 S我 S我 D就 V去 K哪儿","nǎr xūyào wǒ wǒ jiù qù nǎr","Chỗ nào cần tôi thì tôi đến đó"]]},
{h:"怎么…怎么 / 多少…多少 / 几…几",o:"K=từ hỏi lặp",it:[["S你 V想 K怎么 V做 D就 K怎么 V做","nǐ xiǎng zěnme zuò jiù zěnme zuò","Bạn muốn làm thế nào thì làm thế ấy"],["S老师 K怎么 V说 S我们 D就 K怎么 V做","lǎoshī zěnme shuō wǒmen jiù zěnme zuò","Thầy nói sao chúng tôi làm vậy"],["K怎么 A方便 D就 K怎么 V来","zěnme fāngbiàn jiù zěnme lái","Cách nào tiện thì đến cách ấy"],["S你 V要 K多少 D就 V拿 K多少","nǐ yào duōshao jiù ná duōshao","Bạn cần bao nhiêu thì lấy bấy nhiêu"],["V能 V吃 K多少 D就 V点 K多少","néng chī duōshao jiù diǎn duōshao","Ăn được bao nhiêu thì gọi bấy nhiêu"],["V有 K多少 D就 V给 K多少","yǒu duōshao jiù gěi duōshao","Có bao nhiêu cho bấy nhiêu"],["S你 V几点 V到 S我们 D就 K几点 V开始","nǐ jǐ diǎn dào wǒmen jiù jǐ diǎn kāishǐ","Bạn đến mấy giờ chúng ta bắt đầu mấy giờ"],["V来 K几个 V算 K几个","lái jǐ ge suàn jǐ ge","Đến mấy người tính mấy người"],["K怎么 V好 D就 K怎么 V办","zěnme hǎo jiù zěnme bàn","Cách nào tốt thì làm cách ấy"],["S他 V想 K怎么 V说 D就 K怎么 V说， Z别 V管 O他","tā xiǎng zěnme shuō jiù zěnme shuō, bié guǎn tā","Anh ta muốn nói sao thì nói, kệ anh ta"]]}],d:[]},
{t:"Ghép câu với 每…都 và lượng từ lặp",g:"每 + lượng từ + danh từ + 都 = mỗi… đều. Lượng từ hoặc danh từ một âm tiết lặp lại cũng có nghĩa \"mọi\": 天天 = ngày nào cũng, 人人 = ai cũng, 个个 = cái nào cũng.",gr:[{h:"每 + lượng từ + … + 都",o:"K=每…都 (mỗi… đều)",it:[["K每个人 K都 V有 O自己的想法","měi ge rén dōu yǒu zìjǐ de xiǎngfǎ","Mỗi người đều có suy nghĩ riêng"],["S我 K每天 K都 V喝 O咖啡","wǒ měi tiān dōu hē kāfēi","Ngày nào tôi cũng uống cà phê"],["K每次 V见面 S他 K都 V迟到","měi cì jiàn miàn tā dōu chídào","Lần nào gặp anh ấy cũng muộn"],["K每个星期 S我们 K都 V开会","měi ge xīngqī wǒmen dōu kāi huì","Tuần nào chúng tôi cũng họp"],["K每个产品 K都 H要 V检查","měi ge chǎnpǐn dōu yào jiǎnchá","Mỗi sản phẩm đều phải kiểm tra"],["K每年 S我 K都 V回 O老家","měi nián wǒ dōu huí lǎojiā","Năm nào tôi cũng về quê"],["K每个月 V十号 V发 O工资","měi ge yuè shí hào fā gōngzī","Mùng mười mỗi tháng phát lương"],["K每道菜 K都 A很好吃","měi dào cài dōu hěn hǎochī","Món nào cũng ngon"],["K每个房间 K都 V有 O空调","měi ge fángjiān dōu yǒu kōngtiáo","Phòng nào cũng có điều hòa"],["K每个问题 S他 K都 V回答 M了","měi ge wèntí tā dōu huídá le","Câu nào anh ấy cũng trả lời"]]},
{h:"lượng từ / danh từ lặp (mọi)",o:"K=từ lặp (mọi)",it:[["S他 K天天 V加班","tā tiāntiān jiā bān","Ngày nào anh ấy cũng tăng ca"],["S我们 K人人 D都 V有 O责任","wǒmen rénrén dōu yǒu zérèn","Ai trong chúng ta cũng có trách nhiệm"],["S这些苹果 K个个 D都 A很甜","zhèxiē píngguǒ gègè dōu hěn tián","Quả táo nào cũng ngọt"],["S她 K年年 V来 P这儿","tā niánnián lái zhèr","Năm nào cô ấy cũng đến đây"],["S他们 K家家 V有 O车","tāmen jiājiā yǒu chē","Nhà nào họ cũng có xe"],["S我 K次次 D都 V输","wǒ cìcì dōu shū","Lần nào tôi cũng thua"],["S学生们 K个个 D都 A很努力","xuéshengmen gègè dōu hěn nǔlì","Học sinh nào cũng chăm"],["S他的衣服 K件件 D都 A很贵","tā de yīfu jiànjiàn dōu hěn guì","Áo nào của anh ấy cũng đắt"],["K天天 V下雨， A烦死 M了","tiāntiān xià yǔ, fán sǐ le","Ngày nào cũng mưa, chán chết"],["S她 K样样 D都 V会","tā yàngyàng dōu huì","Việc gì cô ấy cũng biết"]]},
{h:"所有 / 全 / 整 + … (tất cả, cả)",o:"K=所有 / 全 / 整 (tất cả, cả)",it:[["K所有的人 D都 V到 M了","suǒyǒu de rén dōu dào le","Tất cả mọi người đều đến rồi"],["K所有 O问题 D都 V解决 M了","suǒyǒu wèntí dōu jiějué le","Tất cả vấn đề đều đã giải quyết"],["K全家 D都 V来 M了","quán jiā dōu lái le","Cả nhà đều đến rồi"],["K全班 D都 V通过 M了","quán bān dōu tōngguò le","Cả lớp đều đỗ"],["S我 V找 M了 K整个 O房间","wǒ zhǎo le zhěnggè fángjiān","Tôi tìm khắp cả phòng"],["S他 V睡 M了 K整整 L一天","tā shuì le zhěngzhěng yì tiān","Anh ấy ngủ trọn một ngày"],["K全世界 D都 V知道","quán shìjiè dōu zhīdào","Cả thế giới đều biết"],["S我 V把 K所有的钱 D都 V花 M了","wǒ bǎ suǒyǒu de qián dōu huā le","Tôi tiêu hết toàn bộ tiền"],["K全部 V做 C完 M了","quánbù zuò wán le","Làm xong toàn bộ rồi"],["K整个晚上 S我 D都 Z没 V睡","zhěnggè wǎnshang wǒ dōu méi shuì","Cả buổi tối tôi không ngủ"]]}],d:[]},
{t:"Ghép câu bắt buộc: 非…不可, 不得不, 不…不行",g:"非 A 不可 = nhất định phải A (không làm không được). 不得不 + động từ = buộc phải (dù không muốn). 不…不行 = không… thì không được. 必须 = phải (mệnh lệnh).",gr:[{h:"非…不可",o:"K=非…不可 (nhất định phải)",it:[["S这件事 S我 K非 V去 K不可","zhè jiàn shì wǒ fēi qù bùkě","Việc này tôi nhất định phải đi"],["S他 K非 V要 V买 O那辆车 K不可","tā fēi yào mǎi nà liàng chē bùkě","Anh ấy nhất quyết đòi mua chiếc xe đó"],["S这个病 K非 V做 O手术 K不可","zhège bìng fēi zuò shǒushù bùkě","Bệnh này nhất định phải phẫu thuật"],["S你 K非 V今天 V走 K不可 M吗？","nǐ fēi jīntiān zǒu bùkě ma?","Bạn nhất định phải đi hôm nay à?"],["S她 K非 V嫁 O他 K不可","tā fēi jià tā bùkě","Cô ấy nhất định phải lấy anh ta"],["S这份报告 K非 S你 V写 K不可","zhè fèn bàogào fēi nǐ xiě bùkě","Báo cáo này nhất định phải bạn viết"],["S孩子 K非 V要 O这个玩具 K不可","háizi fēi yào zhège wánjù bùkě","Đứa bé nhất quyết đòi món đồ chơi này"],["S我 K非 V学 C会 K不可","wǒ fēi xué huì bùkě","Tôi nhất định phải học được"],["S这台机器 K非 V修 K不可 M了","zhè tái jīqì fēi xiū bùkě le","Máy này phải sửa thôi"],["S他 K非 V说 V他 V对 K不可","tā fēi shuō tā duì bùkě","Anh ấy cứ khăng khăng mình đúng"]]},
{h:"不得不 + động từ",o:"K=不得不 (buộc phải)",it:[["S我 K不得不 V加班","wǒ bùdébù jiā bān","Tôi buộc phải tăng ca"],["S他 K不得不 V离开 O家","tā bùdébù líkāi jiā","Anh ấy buộc phải xa nhà"],["Z没 O车 M了， S我们 K不得不 V走路","méi chē le, wǒmen bùdébù zǒu lù","Hết xe, chúng tôi buộc phải đi bộ"],["V下雨 M了， S比赛 K不得不 V取消","xià yǔ le, bǐsài bùdébù qǔxiāo","Trời mưa, trận đấu buộc phải hủy"],["S我 K不得不 V承认 S他 V说 M得 C对","wǒ bùdébù chéngrèn tā shuō de duì","Tôi buộc phải thừa nhận anh ấy nói đúng"],["S为了 O孩子， S她 K不得不 V辞职","wèile háizi, tā bùdébù cí zhí","Vì con, cô ấy buộc phải nghỉ việc"],["S我 K不得不 V借 O钱","wǒ bùdébù jiè qián","Tôi buộc phải vay tiền"],["S他 V病 M得 A很重， K不得不 V住院","tā bìng de hěn zhòng, bùdébù zhù yuàn","Anh ấy ốm nặng, buộc phải nằm viện"],["S工厂 K不得不 V停 O工","gōngchǎng bùdébù tíng gōng","Nhà máy buộc phải ngừng sản xuất"],["S我 K不得不 V说 L一句","wǒ bùdébù shuō yí jù","Tôi buộc phải nói một câu"]]},
{h:"不…不行 / 必须 / 一定要",o:"K=不…不行 / 必须 / 一定要 (phải)",it:[["K不 V吃 O药 K不行","bù chī yào bù xíng","Không uống thuốc không được"],["K不 V戴 O帽子 K不行","bú dài màozi bù xíng","Không đội mũ không được"],["S你 K不 V去 K不行","nǐ bú qù bù xíng","Bạn không đi không được"],["K不 D早点儿 V起 K不行","bù zǎo diǎnr qǐ bù xíng","Không dậy sớm không được"],["S你 K必须 V准时 V到","nǐ bìxū zhǔnshí dào","Bạn phải đến đúng giờ"],["S工人 K必须 V戴 O手套","gōngrén bìxū dài shǒutào","Công nhân phải đeo găng tay"],["S我们 K必须 V今天 V做 C完","wǒmen bìxū jīntiān zuò wán","Chúng ta phải làm xong hôm nay"],["S你 K一定要 V来","nǐ yídìng yào lái","Bạn nhất định phải đến"],["K一定要 V注意 O安全","yídìng yào zhùyì ānquán","Nhất định phải chú ý an toàn"],["K不用 V那么 A着急","bú yòng nàme zháojí","Không cần vội thế"]]}],d:[]},
{t:"Ghép câu hỏi chính phản: V不V, V没V, 有没有, 是不是",g:"Ghép khẳng định + phủ định của cùng động từ / tính từ thành câu hỏi, KHÔNG thêm 吗: 你去不去？ Việc đã qua dùng V没V hoặc …了没有.",gr:[{h:"V不V / A不A (hiện tại, tương lai)",o:"K=V不V (có… không)",it:[["S你 K去不去？","nǐ qù bu qù?","Bạn có đi không?"],["S你 K吃不吃 O辣？","nǐ chī bu chī là?","Bạn ăn cay không?"],["S这个 K贵不贵？","zhège guì bu guì?","Cái này có đắt không?"],["S你 K喜欢不喜欢 O这儿？","nǐ xǐhuan bu xǐhuan zhèr?","Bạn có thích ở đây không?"],["S他 K认识不认识 O你？","tā rènshi bu rènshi nǐ?","Anh ấy có biết bạn không?"],["S你 K累不累？","nǐ lèi bu lèi?","Bạn có mệt không?"],["S你 K想不想 V去 V看 O电影？","nǐ xiǎng bu xiǎng qù kàn diànyǐng?","Bạn có muốn đi xem phim không?"],["S你 K能不能 V帮 O我？","nǐ néng bu néng bāng wǒ?","Bạn giúp tôi được không?"],["S我们 K要不要 V等 O他？","wǒmen yào bu yào děng tā?","Chúng ta có đợi anh ấy không?"],["S你 K会不会 V开车？","nǐ huì bu huì kāi chē?","Bạn có biết lái xe không?"]]},

{h:"hỏi trải nghiệm",o:"K=câu hỏi trải nghiệm",it:[["S你 K觉得 O中国 Q怎么样？","nǐ juéde Zhōngguó zěnmeyàng?","Bạn thấy Trung Quốc thế nào?"],["S你 V在 P这儿 K习惯 M了 M吗？","nǐ zài zhèr xíguàn le ma?","Bạn quen ở đây chưa?"],["S你 V去 M过 K哪些 O地方？","nǐ qù guo nǎxiē dìfang?","Bạn đi những nơi nào rồi?"],["S你 D最 K难忘 M的 O事 V是 Q什么？","nǐ zuì nánwàng de shì shì shénme?","Việc khó quên nhất của bạn là gì?"],["S你 D刚 V来 V的时候 K遇到 M过 Q什么 O困难？","nǐ gāng lái de shíhou yùdào guo shénme kùnnan?","Lúc mới đến bạn gặp khó khăn gì?"],["S那里 K好玩 M吗？","nàli hǎowán ma?","Chỗ đó chơi vui không?"],["S你 V吃 M过 K最好吃 M的 O中国菜 V是 Q什么？","nǐ chī guo zuì hǎochī de Zhōngguó cài shì shénme?","Món Trung ngon nhất bạn từng ăn là gì?"],["S你 V后悔 M过 K吗？","nǐ hòuhuǐ guo ma?","Bạn có từng hối hận không?"],["S如果 D再 V来 L一次， S你 D还 V去 K吗？","rúguǒ zài lái yí cì, nǐ hái qù ma?","Nếu được lần nữa bạn còn đi không?"],["S你 V给 O我 K讲讲 M吧","nǐ gěi wǒ jiǎngjiang ba","Bạn kể tôi nghe đi"]]}],d:[]},

{t:"Ghép câu dài: định ngữ nhiều tầng với 的",g:"Phần bổ nghĩa luôn đứng TRƯỚC danh từ, ngược tiếng Việt: 我昨天买的那件红色的衣服 = cái áo đỏ mà tôi mua hôm qua. Thứ tự: sở hữu + chỉ định / số lượng + tính chất + danh từ.",gr:[{h:"sở hữu + chỉ định + danh từ",o:"K=的 (của, mà);N=danh từ trung tâm",it:[["S我的那个朋友 V是 N老师","wǒ de nàge péngyou shì lǎoshī","Người bạn đó của tôi là giáo viên"],["S他的这辆新车 A很贵","tā de zhè liàng xīn chē hěn guì","Chiếc xe mới này của anh ấy rất đắt"],["S我们公司的两个 N经理 V来 M了","wǒmen gōngsī de liǎng ge jīnglǐ lái le","Hai giám đốc công ty chúng tôi đến rồi"],["S你的那本中文 N书 V在 P桌子上","nǐ de nà běn Zhōngwén shū zài zhuōzi shang","Quyển sách tiếng Trung đó của bạn ở trên bàn"],["S我妈妈的生日 N蛋糕 A很好吃","wǒ māma de shēngrì dàngāo hěn hǎochī","Bánh sinh nhật của mẹ tôi rất ngon"],["S工厂的那台旧 N机器 V坏 M了","gōngchǎng de nà tái jiù jīqì huài le","Cái máy cũ đó của nhà máy hỏng rồi"],["S我们组的三个新 N工人 A很努力","wǒmen zǔ de sān ge xīn gōngrén hěn nǔlì","Ba công nhân mới của tổ tôi rất chăm"],["S他家的那只小 N狗 A很可爱","tā jiā de nà zhī xiǎo gǒu hěn kě'ài","Con chó nhỏ đó nhà anh ấy rất đáng yêu"],["S学校的那个大 N操场 A很漂亮","xuéxiào de nàge dà cāochǎng hěn piàoliang","Cái sân lớn đó của trường rất đẹp"],["S我的这双黑色的 N鞋 A很舒服","wǒ de zhè shuāng hēisè de xié hěn shūfu","Đôi giày đen này của tôi rất êm"]]},

function syl(py){const V="aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ",out=[];
 py.toLowerCase().replace(/[^a-zà-ǜ' ]/g," ").split(/[ ']+/).filter(Boolean).forEach(w=>{let i=0;
  while(i<w.length){let j=i;while(j<w.length&&!V.includes(w[j]))j++;
   if(j>=w.length){if(out.length)out[out.length-1]+=w.slice(i);else out.push(w.slice(i));break}
   while(j<w.length&&V.includes(w[j]))j++;
   const nv=k=>k<w.length&&V.includes(w[k]);
   if(w[j]==="n"&&!nv(j+1)){j++;if(w[j]==="g"&&!nv(j+1))j++}else if(w[j]==="r"&&!nv(j+1))j++;
   out.push(w.slice(i,j));i=j}});return out}

function charPy(p){if(p.cp!==undefined)return p.cp;const ch=hanOf(p.zh),sy=syl(p.py),out=[];let k=0;
 for(let i=0;i<ch.length;i++){const prev=sy[k-1]||"";
  if(ch[i]==="儿"&&i>0&&/r$/.test(prev)&&!/^[eēéěè]r$/.test(prev)){out.push("");continue}
  out.push(sy[k++])}

function words(p){const ch=hanOf(p.zh),cp=charPy(p),out=[],seen=new Set();let i=0;

const TM={1:"āēīōūǖ",2:"áéíóúǘ",3:"ǎěǐǒǔǚ",4:"àèìòùǜ"};
function toneOf(s){for(const c of s)for(const k in TM)if(TM[k].includes(c))return k;return 0}
function CP(py){return py.split(" ").map(w=>{const t=toneOf(w);return t?`<span class="t${t}">${w}</span>`:w}).join(" ")}
// Chữ Hán tách theo thành phần câu (màu + nhãn dưới mỗi đoạn) và dòng công thức của ví dụ đó.
function ZH(p){if(!p.sg||S.cfg.gram===false)return p.zh;
 return p.sg.map(([t,r])=>{const l=r.slice(2);return`<span class="sg s${CLS[r[0]]||"X"}">${t}${l?`<small>${RB(l)}</small>`:""}</span>`}).join("")}
const CLS={S:"S",V:"V",A:"V",O:"O",N:"O",T:"T",P:"T",C:"T",L:"T",K:"K",Q:"K",M:"K",D:"K",G:"K",H:"K",J:"K",Z:"K",E:"X",X:"X"};
function FM(p){if(!p.sg||S.cfg.gram===false)return"";
 return`<div class="fm">Công thức: ${p.sg.filter(s=>s[1].slice(2)).map(([t,r])=>`<b class="s${CLS[r[0]]||"X"}">${RB(r.slice(2))}</b>`).join(" + ")}</div>`}
// Ô "Từ mới trong câu": mọi từ, cụm từ của ví dụ đang hiện, bấm vào chữ để nghe.
function VOC(p){const ws=words(p);if(!ws.length)return"";
 return`<div class="card voc"><h3>📒 Từ mới trong câu (${ws.length})</h3>${ws.map(x=>`<div class="vr"><button class="vb han" title="Nghe" onclick="say('${x.w}')">${x.w}</button><span class="vp">${S.cfg.showPy?x.sy.map(s=>{const t=S.cfg.color?toneOf(s):0;return t?`<span class="t${t}">${s}</span>`:s}).join(""):""}</span><span class="vv">${x.vi}</span></div>`).join("")}</div>`}
function PY(py){return S.cfg.showPy?(S.cfg.color?CP(py):py):""}
/* ---------- PINYIN CHO MỌI CHỮ HÁN ----------
   Quy tắc của app: chữ Hán hiện ở đâu cũng phải có pinyin. Câu ví dụ có dòng pinyin riêng; mọi chỗ khác
   (ghi chú ngữ pháp, gợi ý, tên bài, ô ghép chữ, hướng dẫn) đi qua RB() để gắn pinyin lên trên từng chữ.
   Từ điển âm đọc lấy từ chính các câu trong bài: WPY theo từ (đúng cả biến điệu), CPY theo chữ (âm hay gặp nhất). */
const WPY={},CPY={};
(function(){const cnt={},add=(c,y)=>{if(y)(cnt[c]=cnt[c]||{})[y]=(cnt[c][y]||0)+1};
 const feed=p=>{const ch=hanOf(p.zh),cp=charPy(p);if(!cp)return;ch.forEach((c,i)=>add(c,cp[i]));let i=0;
  while(i<ch.length){let m=0;for(let n=Math.min(GMAX,ch.length-i);n>=2;n--)if(GL[ch.slice(i,i+n).join("")]!==undefined){m=n;break}
   if(m){const w=ch.slice(i,i+m).join("");if(!WPY[w])WPY[w]=cp.slice(i,i+m);i+=m}else i++}};
 LESSONS.forEach(l=>{l.p.forEach(feed);l.d.forEach(d=>feed({zh:d.zh,py:d.py}))});
 TP.forEach(t=>feed({zh:t[0],py:t[1]}));TONES.forEach(t=>[...t[2]].forEach((c,i)=>add(c,t[1].split(" ")[i])));
 for(const c in cnt)CPY[c]=Object.keys(cnt[c]).sort((a,b)=>cnt[c][b]-cnt[c][a])[0];
 CPY["不"]="bù";CPY["一"]="yī";
 // Chữ chỉ gặp trong ghi chú, chưa có trong câu ví dụ nào: khai âm đọc ở đây.
 const EXTRA={主:"zhǔ",管:"guǎn",淡:"dàn",松:"sōng",度:"dù",之:"zhī",煮:"zhǔ",炸:"zhá",蒸:"zhēng",擅:"shàn"};for(const c in EXTRA)if(!CPY[c])CPY[c]=EXTRA[c]})(); // chữ đứng riêng thì ghi thanh gốc
function pyRun(r){const ch=[...r],out=[];let i=0;
 while(i<ch.length){let m=0;for(let n=Math.min(GMAX,ch.length-i);n>=2;n--)if(WPY[ch.slice(i,i+n).join("")]){m=n;break}
  if(m){WPY[ch.slice(i,i+m).join("")].forEach((y,k)=>out.push([ch[i+k],y]));i+=m}else{out.push([ch[i],CPY[ch[i]]||""]);i++}}
 return out}
const rb=(c,y)=>y&&S.cfg.showPy?`<ruby>${c}<rt>${S.cfg.color&&toneOf(y)?`<span class="t${toneOf(y)}">${y}</span>`:y}</rt></ruby>`:c;
// plain=true: dùng ở nơi không chèn được thẻ (danh sách chọn bài), ghi "把 (bǎ)".
function RB(t,plain){if(!t||!S.cfg.showPy||!/[一-鿿]/.test(t))return t;
 return t.replace(/[一-鿿]+/g,r=>{const a=pyRun(r);return plain?r+" ("+a.map(x=>x[1]).filter(Boolean).join(" ")+")":a.map(x=>rb(x[0],x[1])).join("")})}
function mkBuild(p,q){const ch=hanOf(p.zh),cp=charPy(p)||[],ix=ch.map((_,i)=>i).sort(()=>Math.random()-.5);

// hạ điểm các giọng "vui" của macOS (Eddy, Flo, Grandma…) vì nghe như máy.

function vRank(v){const n=v.name,l=v.lang.replace("_","-").toLowerCase();
 if(!/^(zh|cmn)/.test(l)||/hk|yue/.test(l))return -1;
 let s=/cn|hans/.test(l)?100:40;
 if(BADV.test(n))s-=60;
 if(/premium|cao cấp/i.test(n))s+=40;else if(/enhanced|nâng cao/i.test(n))s+=30;
 if(/natural|neural|online/i.test(n))s+=35;
 if(/google/i.test(n))s+=15;
 if(/tingting|婷婷|lili|shanshan|yu-?shu|lanlan|xiaoxiao|yunxi|xiaoyi/i.test(n))s+=10;
 return s}

function say(t,rate){return new Promise(r=>{if(curAud){curAud.pause();curAud=null}
 const pk=S.cfg.pack!==false&&(window.AUDIO_PACK||{})[t];
 if(pk){if("speechSynthesis" in window)speechSynthesis.cancel();const a=new Audio("data:audio/mpeg;base64,"+pk);curAud=a;
  a.playbackRate=Math.max(0.5,Math.min(1.5,(rate||S.cfg.rate)/0.9));a.volume=S.cfg.vol;a.onended=r;a.onerror=r;a.play().catch(r);return}
 if(!("speechSynthesis" in window))return r();speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
 u.rate=rate||S.cfg.rate;u.pitch=S.cfg.pitch;u.volume=S.cfg.vol;u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}

function listen(){return new Promise((res,rej)=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return rej("Trình duyệt/khung này không hỗ trợ mic. Hãy mở trang bằng Chrome hoặc Edge, hoặc tự đánh giá.");
 const r=new SR();r.lang="zh-CN";r.maxAlternatives=3;
 r.onresult=e=>res([...e.results[0]].map(a=>a.transcript));
 r.onerror=e=>rej("Lỗi mic: "+e.error);r.onnomatch=()=>rej("Không nghe rõ");
 try{r.start()}catch(e){rej("Không mở được mic")}})}
const han=s=>(s.match(/[一-鿿]/g)||[]);
function score(target,heard){const a=han(target),b=han(heard);if(!a.length)return 0;
 const dp=Array(a.length+1).fill().map(()=>Array(b.length+1).fill(0));
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
 return Math.round(100*dp[a.length][b.length]/a.length)}

  o.innerHTML=`Nghe được: <b>${h}</b> · Khớp <b style="color:${best>=80?"var(--ok)":"var(--bad)"}">${best}%</b>`;return best}

 if(ctx.auto){ctx.auto=false;autoSay(txt,0.8)}
 return`<div class="hint" style="text-align:center">${q.w?"Từ 2 âm tiết: chọn đúng cặp thanh (thanh trong từ thật khó hơn thanh đơn).":"Thanh 1 ngang cao · 2 lên · 3 xuống rồi lên · 4 xuống mạnh. Nghe và chọn đúng thanh."} ${ctx.i+1}/${ctx.qs.length}</div>
 <div class="card"><div class="row"><button class="pri" onclick="say(toneTxt(),0.8)">🔊 Nghe</button><button onclick="slow(toneTxt())">🐢 Chậm</button></div>${ctx.ans!==null?`<div class="zh">${txt}</div><div class="py">${CP(q.w?q.w[1]:q.g[1].split(" ")[q.t])}</div>`:""}</div>`+

function vQuiz(){
 if(!ctx.qs){const pool=[];ORDER.slice(0,pos(S.lesson)+1).forEach(i=>pool.push(...LESSONS[i].p));
  const shuf=a=>a.slice().sort(()=>Math.random()-.5),pick=n=>shuf(pool).slice(0,n);
  ctx.qs=pick(Math.min(10,pool.length)).map(p=>{const ch=han(p.zh),types=["listen","vi"];if(ch.length>=3&&ch.length<=9)types.push("build","build");
   const type=types[Math.floor(Math.random()*types.length)],q={p,type};
   if(type==="build")mkBuild(p,q);
   else q.opts=shuf([p,...shuf(pool).filter(x=>x.id!==p.id).slice(0,3)]);return q});
  ctx.i=0;ctx.ok=0;ctx.ans=null;ctx.auto=true}
 if(ctx.i>=ctx.qs.length)return`<div class="card"><div class="zh">${ctx.ok}/${ctx.qs.length}</div>${ctx.ok>=ctx.qs.length*.8?"Xuất sắc! 🎉":"Tốt, mai ôn thêm."}</div><div class="row"><button onclick="ctx.qs=null;render()">Làm lại</button></div>`+nav();
 const q=ctx.qs[ctx.i],nxt=`<div class="row"><button class="pri" onclick="ctx.i++;ctx.ans=null;ctx.auto=true;render()">Tiếp →</button></div>`;
 const head=`<div class="hint" style="text-align:center">Câu ${ctx.i+1}/${ctx.qs.length}</div>`;
 if(q.type==="build"){
  return head+`<div class="card"><div class="vi">Sắp xếp thành câu: ${q.p.vi}</div><div class="zh" style="min-height:56px">${q.b.map(i=>rb(q.tok[i],q.tp[i])).join("")||"…"}</div>
  ${q.res!==null?`<div>${q.res?"✅ Đúng":"❌ Đáp án:"} <b>${q.p.zh}</b></div><div class="py">${PY(q.p.py)}</div>`:""}</div>`+
  (q.res===null?`<div class="row">${q.tok.map((c,i)=>`<button ${q.b.includes(i)?"disabled":""} onclick="bTap(${i})" style="font-size:24px">${rb(c,q.tp[i])}</button>`).join("")}</div><div class="row"><button onclick="ctx.qs[ctx.i].b=[];render()">Xóa</button></div>`:nxt)}
 if(ctx.auto&&q.type==="listen"){ctx.auto=false;autoSay(q.p.zh)}
 return head+`<div class="card">${q.type==="listen"?`<div class="vi">Nghe và chọn câu đúng</div><div class="row"><button onclick="say(ctx.qs[ctx.i].p.zh)">🔊 Nghe</button></div>`:`<div class="vi">${q.p.vi}</div>`}</div>`+
 q.opts.map((o,k)=>`<button class="opt ${ctx.ans!==null?(o.id===q.p.id?"good":k===ctx.ans?"wrong":""):""}" ${ctx.ans!==null?"disabled":""} onclick="answer(${k})">${o.zh} <span class="hint">${PY(o.py)}</span></button>`).join("")+
 (ctx.ans!==null?nxt:"")}
function answer(k){const q=ctx.qs[ctx.i];ctx.ans=k;const ok=q.opts[k].id===q.p.id;if(ok)ctx.ok++;grade(q.p.id,ok?2:0);render();say(q.p.zh)}
function bTap(i){const q=ctx.qs[ctx.i];q.b.push(i);
 if(q.b.length===q.chars.length){q.res=q.b.map(k=>q.tok[k]).join("")===q.chars.join("");if(q.res)ctx.ok++;grade(q.p.id,q.res?2:0);render();say(q.p.zh)}else render()}

pinyin(){return`<h3>📘 Ngữ âm tiếng Trung (pinyin)</h3>
 <p><b>4 thanh + thanh nhẹ.</b> Thanh điệu đổi nghĩa từ: mā 妈 mẹ, má 麻 gai, mǎ 马 ngựa, mà 骂 mắng.</p>
 <table><tr><th>Thanh</th><th>Cách đọc</th><th>Ví dụ</th></tr>
 <tr><td><span class=t1>1 ā</span></td><td>Cao, đều, giữ ngang</td><td>妈 mā</td></tr>
 <tr><td><span class=t2>2 á</span></td><td>Đi lên như hỏi "hả?"</td><td>麻 má</td></tr>
 <tr><td><span class=t3>3 ǎ</span></td><td>Xuống thấp rồi nhích lên; trước thanh khác chỉ xuống thấp</td><td>马 mǎ</td></tr>
 <tr><td><span class=t4>4 à</span></td><td>Rơi dứt khoát từ cao xuống thấp</td><td>骂 mà</td></tr>
 <tr><td>Nhẹ</td><td>Ngắn, nhẹ, không nhấn</td><td>妈妈 māma</td></tr></table>
 <p><b>Biến điệu quan trọng</b></p>
 <ul><li>3 + 3 → đọc thành 2 + 3: 你好 viết nǐ hǎo, đọc ní hǎo.</li>
 <li>不 (bù) + thanh 4 → bú: 不是 bú shì, 不去 bú qù.</li>
 <li>一 (yī) + thanh 4 → yí: 一个 yí ge. 一 + thanh 1/2/3 → yì: 一天 yì tiān.</li></ul>
 <p><b>Phụ âm dễ nhầm</b></p>
 <ul><li><b>b/d/g</b> không bật hơi, <b>p/t/k</b> bật hơi mạnh (đặt tờ giấy trước miệng: p/t/k làm giấy bay).</li>
 <li><b>j/q/x</b>: lưỡi bằng, mặt lưỡi chạm ngạc cứng, miệng như đang cười. q bật hơi, j không.</li>
 <li><b>zh/ch/sh/r</b>: cuốn đầu lưỡi lên. <b>z/c/s</b>: lưỡi phẳng, đầu lưỡi sát răng dưới. ch và c bật hơi.</li></ul>
 <p><b>Vần dễ sai</b></p>
 <ul><li><b>ü</b>: chu môi như "u" nhưng phát âm "i". Sau j/q/x viết u nhưng đọc ü: 去 qù = qü.</li>
 <li><b>e</b> đơn đọc như "ơ" kéo từ họng. <b>-n</b> mũi trước (lưỡi chạm lợi), <b>-ng</b> mũi sau (họng). Phân biệt: 新 xīn / 星 xīng.</li>
 <li>ian đọc gần "iên": 天 tiān. iu = iou, ui = uei, un = uen.</li></ul>
 <p class="note">Cách luyện: nghe → nhắc lại → ghi âm giọng bạn → so sánh. Luyện cặp thanh tối thiểu mỗi ngày (bước "Luyện thanh").</p>
 <div class="row"><button class="pri" onclick="closeOv()">Đóng</button></div>`},

method(){return`<h3>🧭 Phương pháp & lộ trình</h3>
 <p><b>Buổi học 60 phút</b>: ôn thẻ 10' → học câu mới 12' → luyện thanh 8' → nghe & nhắc lại 12' → hội thoại 13' → kiểm tra 5'.</p>
 <p><b>7 nguyên tắc đã được dùng rộng rãi trong dạy ngôn ngữ</b></p>
 <ol><li><b>Lặp lại ngắt quãng</b>: thẻ quay lại sau 1, 2, 4, 8, 16, 32 ngày. Quên thì về hộp đầu.</li>
 <li><b>Học theo câu trọn vẹn</b>, không học từ rời: nhớ lâu và nói được ngay.</li>
 <li><b>Shadowing</b>: nghe rồi nhắc lại ngay, bắt chước cả thanh điệu và nhịp.</li>
 <li><b>Thanh điệu từ ngày đầu</b>: sửa sau rất khó.</li>
 <li><b>Hội thoại đóng vai</b>: luyện phản xạ, đổi vai A/B.</li>
 <li><b>Tự kiểm tra (retrieval)</b>: nhớ lại chủ động hiệu quả hơn đọc lại.</li>
 <li><b>Nói với người thật 2-3 buổi/tuần</b> (gia sư, bạn trao đổi ngôn ngữ). App không thay được việc này.</li></ol>
 <p><b>Bằng chứng nghiên cứu (tóm tắt trung thực)</b></p>
 <ul><li>Không có nghiên cứu nào chứng minh một phương pháp "tốt nhất thế giới". Các tổng quan cho thấy kết quả phụ thuộc cách đo và người học.</li>
 <li>Luyện nghe phân biệt âm có phản hồi ngay (đúng/sai) là kiểu luyện ngữ âm có bằng chứng mạnh nhất. App áp dụng ở bước "Luyện thanh".</li>
 <li>Thanh điệu trong từ 2 âm tiết khó hơn và sát thực tế hơn thanh đơn, nên app luyện cả cặp thanh (今天, 学习, 问题…).</li>
 <li>Dạy quy tắc rõ ràng trước rồi mới luyện nhiều giọng khác nhau cho kết quả tốt hơn. Hãy đọc "📘 Ngữ âm" trước, rồi thỉnh thoảng đổi giọng đọc trong "⚙ Giọng nói".</li>
 <li>Luyện hội thoại với máy có giúp kỹ năng nói, chủ yếu vì giảm ngại và tăng số lần mở miệng. Vì vậy có đóng vai, "▶ Nghe cả đoạn" và "🗣 Tự nói 1 phút".</li></ul>
 <p><b>Lộ trình</b>: 301 bài chia 15 chặng, học theo thứ tự trong danh sách, 1 bài mỗi ngày. Bài có dấu 🧩 là bài ghép 30 ví dụ, có thể chia làm 2 ngày; bước "Hội thoại" của các bài này là bài tập tự ghép chữ thành câu. Chặng 1 Nền tảng xen kẽ hội thoại với ghép từ và ghép câu cơ bản. Chặng 2 Sơ trung thêm câu ghép, bổ ngữ, 把 / 被 / 比. Chặng 3 Giao tiếp công xưởng: cần đi làm xưởng gấp thì nhảy thẳng tới đây sau 5 bài đầu. Chặng 4 Khẩu ngữ tự nhiên. Chặng 5 Nâng cao xen kẽ tình huống (phỏng vấn, khám bệnh, ngân hàng, khiếu nại, họp) với ngữ pháp. Chặng 6 đến 10 là 150 bài bổ sung theo chủ đề đời sống (sinh hoạt, ăn uống mua sắm, đi lại dịch vụ, công việc học tập, quan hệ cảm xúc); mỗi chủ đề đi theo bộ ba: một bài hội thoại, một bài ghép từ 🧩, một bài ghép câu 🧩. Chặng 11 đến 15 là 100 bài ghép câu nâng cao: bổ ngữ, câu ghép và liên từ, mẫu câu đặc biệt, cách nói lịch sự, rồi ghép câu theo tình huống đời sống và công việc. Học hết thì lặp lại vòng mới, thẻ ôn vẫn chạy. Mức HSK ghi ở tên chặng chỉ là so sánh gần đúng.</p>
 <p class="note"><b>Giới hạn thật</b>: 7138 câu và từ (ngữ pháp tới khoảng HSK 3-4) giúp bạn xoay xở các tình huống cơ bản và nghe tự nhiên hơn, nhưng chưa thể nói như người bản xứ. Trình độ đó cần hàng nghìn giờ nghe và nói thật trong nhiều năm; không app nào thay được. Hội thoại tự do cần thêm vài nghìn từ, nghe nhiều tiếng Trung thật (podcast, phim có phụ đề) và nói với người bản ngữ. Từ chuyên ngành mỗi xưởng khác nhau, hãy hỏi tổ trưởng tên máy và công đoạn của xưởng bạn. Khi xong 53 bài, hãy thêm: nghe hằng ngày, học chữ Hán, và thi thử HSK 1-2 để đo trình độ.</p>

 $("#lessonList").innerHTML=STAGES.map(([n,ids],k)=>{const [a,b]=n.split(" · ");
  return`<details class="stage" data-s="${k}" ${ids.includes(S.lesson)?"open":""}><summary><em>${SICON[k]||"📘"}</em><span>${b||n}</span><i>${ids.filter(learned).length}/${ids.length}</i></summary>${ids.map(i=>`<button class="li ${i===S.lesson?"on":""}" onclick="pickLesson(${i})"><span class="n">${pos(i)+1}</span><span>${RB(LESSONS[i].t)}</span><span class="k">${learned(i)?"✓":""}</span></button>`).join("")}</details>`}).join("");
 const box=$("#lessonList"),on=box.querySelector(".on");if(on)box.scrollTop=Math.max(0,on.offsetTop-box.offsetTop-box.clientHeight/2);
 const st=STAGES.find(x=>x[1].includes(S.lesson))||STAGES[0],l=L();
