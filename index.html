{t:"Thú cưng",g:"养 = nuôi. 只 là lượng từ cho con vật: 一只狗. 又…又… = vừa… vừa…: 又可爱又聪明.",gr:[{h:"",o:"",it:[["S你 V养 O宠物 M吗？","nǐ yǎng chǒngwù ma?","Bạn có nuôi thú cưng không?"],["S我 V养 M了 L一只 O狗","wǒ yǎng le yì zhī gǒu","Tôi nuôi một con chó"],["S它 V叫 Q什么 N名字？","tā jiào shénme míngzi?","Nó tên là gì?"],["S它 T今年 L两岁 M了","tā jīnnián liǎng suì le","Năm nay nó hai tuổi rồi"],["S它 D又 A可爱 D又 A聪明","tā yòu kě'ài yòu cōngming","Nó vừa đáng yêu vừa thông minh"],["S我 T每天 V带 O它 V散步","wǒ měi tiān dài tā sàn bù","Ngày nào tôi cũng dắt nó đi dạo"],["S它 V咬 O人 M吗？","tā yǎo rén ma?","Nó có cắn người không?"],["S我 H可以 V摸摸 O它 M吗？","wǒ kěyǐ mōmo tā ma?","Tôi sờ nó một chút được không?"]]}],d:[["A","你养宠物吗？","nǐ yǎng chǒngwù ma?","Bạn có nuôi thú cưng không?"],["B","我养了一只狗，今年两岁了。","wǒ yǎng le yì zhī gǒu, jīnnián liǎng suì le.","Mình nuôi một con chó, năm nay hai tuổi."],["A","它叫什么名字？","tā jiào shénme míngzi?","Nó tên là gì?"],["B","它叫小白，又可爱又聪明。","tā jiào Xiǎobái, yòu kě'ài yòu cōngming.","Nó tên Tiểu Bạch, vừa đáng yêu vừa thông minh."],["A","它咬人吗？我可以摸摸它吗？","tā yǎo rén ma? wǒ kěyǐ mōmo tā ma?","Nó có cắn không? Mình sờ nó được không?"],["B","可以，它不咬人。","kěyǐ, tā bù yǎo rén.","Được, nó không cắn đâu."]]},
{t:"Giải trí ở nhà",g:"在 + động từ + 呢 = đang làm gì. 有意思 = thú vị, 没意思 = chán. 换 = đổi.",gr:[{h:"",o:"",it:[["S你 D在 V看 Q什么 M呢？","nǐ zài kàn shénme ne?","Bạn đang xem gì thế?"],["S我 D在 V看 O电视剧","wǒ zài kàn diànshìjù","Tôi đang xem phim truyền hình"],["S这个节目 D很 A有意思","zhège jiémù hěn yǒu yìsi","Chương trình này rất thú vị"],["V换 L个 O台 M吧","huàn ge tái ba","Đổi kênh đi"],["S声音 V开 C大 L一点儿","shēngyīn kāi dà yìdiǎnr","Mở tiếng to lên một chút"],["S我 V喜欢 V听 O音乐","wǒ xǐhuan tīng yīnyuè","Tôi thích nghe nhạc"],["S我们 V玩 O游戏 M吧","wǒmen wán yóuxì ba","Chúng ta chơi game đi"],["S这个电影 S我 V看 M过 M了","zhège diànyǐng wǒ kàn guo le","Phim này tôi xem rồi"]]}],d:[["A","你在看什么呢？","nǐ zài kàn shénme ne?","Bạn đang xem gì thế?"],["B","我在看电视剧。这个节目很有意思。","wǒ zài kàn diànshìjù. zhège jiémù hěn yǒu yìsi.","Mình đang xem phim truyền hình. Chương trình này hay lắm."],["A","声音开大一点儿。","shēngyīn kāi dà yìdiǎnr.","Mở tiếng to lên chút."],["B","好。你想看电影吗？","hǎo. nǐ xiǎng kàn diànyǐng ma?","Ừ. Bạn muốn xem phim không?"],["A","这个电影我看过了，换个台吧。","zhège diànyǐng wǒ kàn guo le, huàn ge tái ba.","Phim này mình xem rồi, đổi kênh đi."],["B","那我们玩游戏吧。","nà wǒmen wán yóuxì ba.","Vậy mình chơi game đi."]]},
{t:"Gọi điện về nhà",g:"挺…的 = khá…: 挺好的. 别担心 = đừng lo. 想 + người = nhớ ai: 我想你们.",gr:[{h:"",o:"",it:[["E喂， S妈， V是 O我","wèi, mā, shì wǒ","A lô, mẹ ơi, con đây"],["S家里 D都 A好 M吗？","jiā li dōu hǎo ma?","Ở nhà mọi người khỏe cả chứ?"],["S我 P这儿 D挺 A好 M的","wǒ zhèr tǐng hǎo de","Con ở đây khá ổn"],["S你们 Z别 V担心 O我","nǐmen bié dānxīn wǒ","Bố mẹ đừng lo cho con"],["S爸爸 N身体 Q怎么样？","bàba shēntǐ zěnmeyàng?","Sức khỏe bố thế nào?"],["S我 D很 V想 O你们","wǒ hěn xiǎng nǐmen","Con rất nhớ bố mẹ"],["S我 T过年 V回家","wǒ guò nián huí jiā","Tết con về nhà"],["S你们 V注意 O身体","nǐmen zhùyì shēntǐ","Bố mẹ giữ gìn sức khỏe"]]}],d:[["A","喂，妈，是我。家里都好吗？","wèi, mā, shì wǒ. jiā li dōu hǎo ma?","A lô, mẹ ơi, con đây. Ở nhà khỏe cả chứ?"],["B","都好。你在那儿怎么样？","dōu hǎo. nǐ zài nàr zěnmeyàng?","Khỏe cả. Con ở đó thế nào?"],["A","我这儿挺好的，你们别担心我。爸爸身体怎么样？","wǒ zhèr tǐng hǎo de, nǐmen bié dānxīn wǒ. bàba shēntǐ zěnmeyàng?","Con ở đây khá ổn, bố mẹ đừng lo. Sức khỏe bố thế nào?"],["B","他很好。你什么时候回来？","tā hěn hǎo. nǐ shénme shíhou huílai?","Bố khỏe. Bao giờ con về?"],["A","我过年回家。我很想你们。","wǒ guò nián huí jiā. wǒ hěn xiǎng nǐmen.","Tết con về. Con nhớ bố mẹ lắm."],["B","好，你也注意身体。","hǎo, nǐ yě zhùyì shēntǐ.","Ừ, con cũng giữ gìn sức khỏe nhé."]]},
{t:"Đi chợ mua rau",g:"怎么卖 = bán thế nào (hỏi giá theo cân). 斤 = nửa ký. 新鲜 = tươi. 一共 = tổng cộng.",gr:[{h:"",o:"",it:[["S白菜 Q怎么 V卖？","báicài zěnme mài?","Cải thảo bán thế nào?"],["L三块 L一斤","sān kuài yì jīn","Ba tệ một cân"],["S这些菜 A新鲜 M吗？","zhèxiē cài xīnxiān ma?","Rau này có tươi không?"],["V给 O我 V来 L两斤 O西红柿","gěi wǒ lái liǎng jīn xīhóngshì","Cho tôi hai cân cà chua"],["H能 Z不 H能 A便宜 L一点儿？","néng bu néng piányi yìdiǎnr?","Có thể rẻ hơn chút không?"],["D一共 Q多少 N钱？","yígòng duōshao qián?","Tổng cộng bao nhiêu tiền?"],["D再 V送 O我 L两根 O葱 M吧","zài sòng wǒ liǎng gēn cōng ba","Tặng tôi thêm hai cây hành đi"],["S我 V要 L半斤 O猪肉","wǒ yào bàn jīn zhūròu","Tôi lấy nửa cân thịt lợn"]]}],d:[["A","老板，白菜怎么卖？","lǎobǎn, báicài zěnme mài?","Chủ quán ơi, cải thảo bán thế nào?"],["B","三块一斤，今天的菜很新鲜。","sān kuài yì jīn, jīntiān de cài hěn xīnxiān.","Ba tệ một cân, rau hôm nay tươi lắm."],["A","给我来两斤西红柿，再要半斤猪肉。","gěi wǒ lái liǎng jīn xīhóngshì, zài yào bàn jīn zhūròu.","Cho tôi hai cân cà chua, thêm nửa cân thịt lợn."],["B","好的。一共二十五块。","hǎo de. yígòng èrshíwǔ kuài.","Vâng. Tổng cộng hai mươi lăm tệ."],["A","能不能便宜一点儿？再送我两根葱吧。","néng bu néng piányi yìdiǎnr? zài sòng wǒ liǎng gēn cōng ba.","Rẻ chút được không? Tặng tôi thêm hai cây hành đi."],["B","行，送你。","xíng, sòng nǐ.","Được, tặng chị."]]},
{t:"Ở siêu thị",g:"在哪儿 hỏi vị trí hàng. 找 = tìm. 排队 = xếp hàng. 需要…吗 = có cần… không.",gr:[{h:"",o:"",it:[["E请问， S牛奶 V在 Q哪儿？","qǐngwèn, niúnǎi zài nǎr?","Xin hỏi, sữa ở đâu?"],["V在 P那边 P第三排","zài nàbiān dì sān pái","Ở bên kia, dãy thứ ba"],["S我 V找 Z不 C到 O酱油","wǒ zhǎo bu dào jiàngyóu","Tôi không tìm thấy xì dầu"],["S这个 V有 Z没 V有 O大包的？","zhège yǒu méiyǒu dà bāo de?","Cái này có gói to không?"],["T今天 S鸡蛋 V打折","jīntiān jīdàn dǎ zhé","Hôm nay trứng giảm giá"],["D请 G在 P这儿 V排队","qǐng zài zhèr pái duì","Xin xếp hàng ở đây"],["V需要 O袋子 M吗？","xūyào dàizi ma?","Có cần túi không?"],["S我 D自己 V带 M了 O袋子","wǒ zìjǐ dài le dàizi","Tôi tự mang túi rồi"]]}],d:[["A","请问，牛奶在哪儿？","qǐngwèn, niúnǎi zài nǎr?","Xin hỏi, sữa ở đâu?"],["B","在那边第三排。今天鸡蛋打折。","zài nàbiān dì sān pái. jīntiān jīdàn dǎ zhé.","Bên kia dãy thứ ba. Hôm nay trứng giảm giá."],["A","我找不到酱油。","wǒ zhǎo bu dào jiàngyóu.","Tôi không tìm thấy xì dầu."],["B","酱油在牛奶旁边。请在这儿排队。","jiàngyóu zài niúnǎi pángbiān. qǐng zài zhèr pái duì.","Xì dầu cạnh sữa. Xin xếp hàng ở đây."],["B","需要袋子吗？","xūyào dàizi ma?","Có cần túi không?"],["A","不用，我自己带了袋子。","bú yòng, wǒ zìjǐ dài le dàizi.","Không cần, tôi tự mang túi rồi."]]},
{t:"Quán cà phê, trà sữa",g:"要…的 chọn loại: 要热的 / 冰的. 在这儿喝还是带走 = uống tại đây hay mang đi. 少糖 = ít đường.",gr:[{h:"",o:"",it:[["S我 V要 L一杯 O奶茶","wǒ yào yì bēi nǎichá","Tôi lấy một cốc trà sữa"],["V要 A热的 J还是 A冰的？","yào rè de háishi bīng de?","Lấy nóng hay đá?"],["V要 A冰的， V少 O糖","yào bīng de, shǎo táng","Lấy đá, ít đường"],["V要 A大杯的 J还是 A小杯的？","yào dà bēi de háishi xiǎo bēi de?","Cốc lớn hay cốc nhỏ?"],["G在 P这儿 V喝 J还是 V带走？","zài zhèr hē háishi dài zǒu?","Uống ở đây hay mang đi?"],["S我 V带走","wǒ dài zǒu","Tôi mang đi"],["Z不 H要 V加 O冰","bú yào jiā bīng","Đừng cho đá"],["D请 V等 L五分钟","qǐng děng wǔ fēnzhōng","Xin đợi năm phút"]]}],d:[["A","你好，我要一杯奶茶。","nǐ hǎo, wǒ yào yì bēi nǎichá.","Chào bạn, tôi lấy một cốc trà sữa."],["B","要热的还是冰的？","yào rè de háishi bīng de?","Lấy nóng hay đá?"],["A","要冰的，少糖。","yào bīng de, shǎo táng.","Lấy đá, ít đường."],["B","大杯的还是小杯的？在这儿喝还是带走？","dà bēi de háishi xiǎo bēi de? zài zhèr hē háishi dài zǒu?","Cốc lớn hay nhỏ? Uống ở đây hay mang đi?"],["A","大杯的，我带走。","dà bēi de, wǒ dài zǒu.","Cốc lớn, tôi mang đi."],["B","好的，请等五分钟。","hǎo de, qǐng děng wǔ fēnzhōng.","Vâng, xin đợi năm phút."]]},
{t:"Gọi món theo khẩu vị",g:"别放 + thứ gì = đừng cho…: 别放香菜. 对…过敏 = dị ứng với…. 够了 = đủ rồi.",gr:[{h:"",o:"",it:[["S这个菜 A辣 Z不 A辣？","zhège cài là bu là?","Món này có cay không?"],["V要 A微辣的","yào wēi là de","Lấy cay ít"],["Z别 V放 O香菜","bié fàng xiāngcài","Đừng cho rau mùi"],["S我 G对 O海鲜 V过敏","wǒ duì hǎixiān guòmǐn","Tôi dị ứng hải sản"],["S我们 V点 M了 Q几个 O菜？","wǒmen diǎn le jǐ ge cài?","Chúng ta gọi mấy món rồi?"],["L四个菜 A够 M了","sì ge cài gòu le","Bốn món đủ rồi"],["D再 V来 L一碗 O米饭","zài lái yì wǎn mǐfàn","Cho thêm một bát cơm"],["S菜 Q怎么 D还 Z没 V上？","cài zěnme hái méi shàng?","Sao món vẫn chưa lên?"]]}],d:[["A","这个菜辣不辣？","zhège cài là bu là?","Món này có cay không?"],["B","有一点儿辣。可以做微辣的。","yǒu yìdiǎnr là. kěyǐ zuò wēi là de.","Hơi cay. Có thể làm cay ít."],["A","要微辣的，别放香菜。我对海鲜过敏。","yào wēi là de, bié fàng xiāngcài. wǒ duì hǎixiān guòmǐn.","Lấy cay ít, đừng cho rau mùi. Tôi dị ứng hải sản."],["B","好的。四个菜够了吗？","hǎo de. sì ge cài gòu le ma?","Vâng. Bốn món đủ chưa ạ?"],["A","够了。再来一碗米饭。","gòu le. zài lái yì wǎn mǐfàn.","Đủ rồi. Cho thêm một bát cơm."],["A","服务员，菜怎么还没上？","fúwùyuán, cài zěnme hái méi shàng?","Phục vụ ơi, sao món vẫn chưa lên?"]]},
{t:"Thanh toán, mời nhau",g:"我请客 = tôi mời. AA = chia đều. 找 + tiền = thối tiền. 算 = tính.",gr:[{h:"",o:"",it:[["E服务员， V买单","fúwùyuán, mǎi dān","Phục vụ ơi, tính tiền"],["T今天 S我 V请客","jīntiān wǒ qǐng kè","Hôm nay tôi mời"],["S我们 V分开 V付 M吧","wǒmen fēnkāi fù ba","Chúng ta trả riêng đi"],["D一共 L两百块","yígòng liǎng bǎi kuài","Tổng cộng hai trăm tệ"],["V用 O现金 J还是 V扫码？","yòng xiànjīn háishi sǎo mǎ?","Dùng tiền mặt hay quét mã?"],["V找 O你 L二十块","zhǎo nǐ èrshí kuài","Thối lại bạn hai mươi tệ"],["S你 V算 C错 M了 M吧？","nǐ suàn cuò le ba?","Bạn tính nhầm rồi phải không?"],["T下次 S我 V请 O你","xià cì wǒ qǐng nǐ","Lần sau tôi mời bạn"]]}],d:[["A","服务员，买单。","fúwùyuán, mǎi dān.","Phục vụ ơi, tính tiền."],["B","一共两百块。用现金还是扫码？","yígòng liǎng bǎi kuài. yòng xiànjīn háishi sǎo mǎ?","Tổng cộng hai trăm tệ. Tiền mặt hay quét mã ạ?"],["A","今天我请客，我扫码。","jīntiān wǒ qǐng kè, wǒ sǎo mǎ.","Hôm nay tôi mời, tôi quét mã."],["C","不行，我们分开付吧。","bù xíng, wǒmen fēnkāi fù ba.","Không được, mình trả riêng đi."],["A","没关系，下次你请我。","méi guānxi, xià cì nǐ qǐng wǒ.","Không sao, lần sau bạn mời tôi."],["C","好，下次我请你。","hǎo, xià cì wǒ qǐng nǐ.","Được, lần sau tôi mời bạn."]]},
{t:"Mua quần áo",g:"试 = thử. 合适 = vừa, hợp. 号 = cỡ. 有点儿 + tính từ = hơi… (không hài lòng).",gr:[{h:"",o:"",it:[["S我 H可以 V试 L一下 M吗？","wǒ kěyǐ shì yíxià ma?","Tôi thử một chút được không?"],["S试衣间 V在 Q哪儿？","shìyījiān zài nǎr?","Phòng thử đồ ở đâu?"],["S这件 D有点儿 A大","zhè jiàn yǒudiǎnr dà","Cái này hơi rộng"],["V有 O小一号的 M吗？","yǒu xiǎo yí hào de ma?","Có cỡ nhỏ hơn một số không?"],["S这件 D很 A合适","zhè jiàn hěn héshì","Cái này rất vừa"],["S你 V穿 Q多大 N号？","nǐ chuān duō dà hào?","Bạn mặc cỡ bao nhiêu?"],["V有 O别的颜色 M吗？","yǒu bié de yánsè ma?","Có màu khác không?"],["S我 D就 V要 O这件","wǒ jiù yào zhè jiàn","Tôi lấy cái này"]]}],d:[["A","这件衣服我可以试一下吗？","zhè jiàn yīfu wǒ kěyǐ shì yíxià ma?","Cái áo này tôi thử được không?"],["B","可以。你穿多大号？","kěyǐ. nǐ chuān duō dà hào?","Được. Chị mặc cỡ bao nhiêu?"],["A","中号。试衣间在哪儿？","zhōng hào. shìyījiān zài nǎr?","Cỡ vừa. Phòng thử đồ ở đâu?"],["B","在那边。","zài nàbiān.","Ở bên kia."],["A","这件有点儿大，有小一号的吗？","zhè jiàn yǒudiǎnr dà, yǒu xiǎo yí hào de ma?","Cái này hơi rộng, có cỡ nhỏ hơn không?"],["B","有，给你。","yǒu, gěi nǐ.","Có, của chị đây."],["A","这件很合适，我就要这件。","zhè jiàn hěn héshì, wǒ jiù yào zhè jiàn.","Cái này rất vừa, tôi lấy cái này."]]},
{t:"Mua giày",g:"双 là lượng từ cho đôi: 一双鞋. 码 = cỡ giày. 紧 = chật, 松 = lỏng. 走走看 = đi thử xem.",gr:[{h:"",o:"",it:[["S我 H想 V买 L一双 O运动鞋","wǒ xiǎng mǎi yì shuāng yùndòngxié","Tôi muốn mua một đôi giày thể thao"],["S你 V穿 Q多少 N码？","nǐ chuān duōshao mǎ?","Bạn đi cỡ bao nhiêu?"],["S我 V穿 L四十码","wǒ chuān sìshí mǎ","Tôi đi cỡ bốn mươi"],["S这双 D有点儿 A紧","zhè shuāng yǒudiǎnr jǐn","Đôi này hơi chật"],["V换 L一双 A大一点儿的","huàn yì shuāng dà yìdiǎnr de","Đổi một đôi lớn hơn chút"],["S你 V走走 V看","nǐ zǒuzou kàn","Bạn đi thử xem"],["V穿 M着 D很 A舒服","chuān zhe hěn shūfu","Đi vào rất thoải mái"],["S这双鞋 V打 Q几 N折？","zhè shuāng xié dǎ jǐ zhé?","Đôi giày này giảm mấy phần?"]]}],d:[["A","我想买一双运动鞋。","wǒ xiǎng mǎi yì shuāng yùndòngxié.","Tôi muốn mua một đôi giày thể thao."],["B","你穿多少码？","nǐ chuān duōshao mǎ?","Anh đi cỡ bao nhiêu?"],["A","我穿四十码。","wǒ chuān sìshí mǎ.","Tôi đi cỡ bốn mươi."],["B","试试这双，你走走看。","shìshi zhè shuāng, nǐ zǒuzou kàn.","Thử đôi này, anh đi thử xem."],["A","这双有点儿紧，换一双大一点儿的。","zhè shuāng yǒudiǎnr jǐn, huàn yì shuāng dà yìdiǎnr de.","Đôi này hơi chật, đổi đôi lớn hơn chút."],["A","这双穿着很舒服。打几折？","zhè shuāng chuān zhe hěn shūfu. dǎ jǐ zhé?","Đôi này đi rất thoải mái. Giảm mấy phần?"],["B","打八折。","dǎ bā zhé.","Giảm hai mươi phần trăm."]]},
{t:"Mua hàng online",g:"下单 = đặt đơn. 发货 = gửi hàng. 包邮 = miễn phí vận chuyển. 收到 = nhận được.",gr:[{h:"",o:"",it:[["S我 G在 P网上 V买 M了 L一件 O衣服","wǒ zài wǎngshàng mǎi le yí jiàn yīfu","Tôi mua một cái áo trên mạng"],["S你 V下单 M了 M吗？","nǐ xià dān le ma?","Bạn đặt đơn chưa?"],["Q什么时候 V发货？","shénme shíhou fā huò?","Bao giờ gửi hàng?"],["V包邮 M吗？","bāo yóu ma?","Có miễn phí vận chuyển không?"],["L三天 D就 H能 V到","sān tiān jiù néng dào","Ba ngày là đến"],["S我 D还 Z没 V收到 O货","wǒ hái méi shōudào huò","Tôi vẫn chưa nhận được hàng"],["S快递 V放 G在 P门口 M了","kuàidì fàng zài ménkǒu le","Hàng chuyển phát để ở cửa rồi"],["D请 V给 O我 L一个 O好评","qǐng gěi wǒ yí ge hǎopíng","Xin cho tôi một đánh giá tốt"]]}],d:[["A","我在网上买了一件衣服。","wǒ zài wǎngshàng mǎi le yí jiàn yīfu.","Mình mua một cái áo trên mạng."],["B","包邮吗？什么时候发货？","bāo yóu ma? shénme shíhou fā huò?","Có miễn phí ship không? Bao giờ gửi hàng?"],["A","包邮，三天就能到。","bāo yóu, sān tiān jiù néng dào.","Miễn ship, ba ngày là đến."],["B","我上个星期下单的，还没收到货。","wǒ shàng ge xīngqī xià dān de, hái méi shōudào huò.","Mình đặt tuần trước, vẫn chưa nhận được hàng."],["A","你问问卖家吧。","nǐ wènwen màijiā ba.","Bạn hỏi người bán xem."],["B","啊，快递放在门口了。","a, kuàidì fàng zài ménkǒu le.","À, hàng để ở cửa rồi."]]},
{t:"Đổi, trả hàng",g:"退 = trả, 换 = đổi. 小票 = hóa đơn. 坏了 = hỏng rồi. 不能…吗 = không thể… sao.",gr:[{h:"",o:"",it:[["S这个 S我 H想 V退","zhège wǒ xiǎng tuì","Cái này tôi muốn trả"],["S我 T昨天 D刚 V买 M的","wǒ zuótiān gāng mǎi de","Tôi vừa mua hôm qua"],["V有 O小票 M吗？","yǒu xiǎopiào ma?","Có hóa đơn không?"],["S小票 V在 P这儿","xiǎopiào zài zhèr","Hóa đơn đây"],["S它 V用 M了 L一次 D就 A坏 M了","tā yòng le yí cì jiù huài le","Dùng một lần là hỏng"],["H可以 V换 L一个 A新的 M吗？","kěyǐ huàn yí ge xīn de ma?","Có thể đổi cái mới không?"],["V退 O钱 J还是 V换 O货？","tuì qián háishi huàn huò?","Trả tiền hay đổi hàng?"],["D请 V等 L一下， S我 V问问 O经理","qǐng děng yíxià, wǒ wènwen jīnglǐ","Xin đợi chút, tôi hỏi quản lý"]]}],d:[["A","你好，这个我想退。我昨天刚买的。","nǐ hǎo, zhège wǒ xiǎng tuì. wǒ zuótiān gāng mǎi de.","Chào bạn, cái này tôi muốn trả. Tôi vừa mua hôm qua."],["B","有什么问题吗？","yǒu shénme wèntí ma?","Có vấn đề gì ạ?"],["A","用了一次就坏了。","yòng le yí cì jiù huài le.","Dùng một lần là hỏng."],["B","有小票吗？","yǒu xiǎopiào ma?","Có hóa đơn không ạ?"],["A","小票在这儿。可以换一个新的吗？","xiǎopiào zài zhèr. kěyǐ huàn yí ge xīn de ma?","Hóa đơn đây. Đổi cái mới được không?"],["B","请等一下，我问问经理。","qǐng děng yíxià, wǒ wènwen jīnglǐ.","Xin đợi chút, tôi hỏi quản lý."]]},
{t:"Mua hoa quả",g:"甜 = ngọt, 酸 = chua. 挑 = chọn. 称 = cân. 尝一个 = nếm một quả.",gr:[{h:"",o:"",it:[["S这个西瓜 A甜 Z不 A甜？","zhège xīguā tián bu tián?","Quả dưa hấu này có ngọt không?"],["Z不 A甜 Z不 V要 O钱","bù tián bú yào qián","Không ngọt không lấy tiền"],["S我 H可以 V尝 L一个 M吗？","wǒ kěyǐ cháng yí ge ma?","Tôi nếm một quả được không?"],["V帮 O我 V挑 L一个 A好的","bāng wǒ tiāo yí ge hǎo de","Chọn giúp tôi một quả ngon"],["S香蕉 Q多少 N钱 L一斤？","xiāngjiāo duōshao qián yì jīn?","Chuối bao nhiêu tiền một cân?"],["V帮 O我 V称 L一下","bāng wǒ chēng yíxià","Cân giúp tôi một chút"],["S这些橘子 D有点儿 A酸","zhèxiē júzi yǒudiǎnr suān","Mấy quả quýt này hơi chua"],["D再 V买 L一斤 O葡萄","zài mǎi yì jīn pútao","Mua thêm một cân nho"]]}],d:[["A","这个西瓜甜不甜？","zhège xīguā tián bu tián?","Dưa hấu này có ngọt không?"],["B","很甜，不甜不要钱。","hěn tián, bù tián bú yào qián.","Rất ngọt, không ngọt không lấy tiền."],["A","帮我挑一个好的。香蕉多少钱一斤？","bāng wǒ tiāo yí ge hǎo de. xiāngjiāo duōshao qián yì jīn?","Chọn giúp tôi quả ngon. Chuối bao nhiêu một cân?"],["B","四块一斤。橘子你可以尝一个。","sì kuài yì jīn. júzi nǐ kěyǐ cháng yí ge.","Bốn tệ một cân. Quýt chị nếm thử một quả đi."],["A","橘子有点儿酸。再买一斤葡萄。","júzi yǒudiǎnr suān. zài mǎi yì jīn pútao.","Quýt hơi chua. Mua thêm một cân nho."],["B","好，我帮你称一下。","hǎo, wǒ bāng nǐ chēng yíxià.","Vâng, để tôi cân cho chị."]]},
{t:"Gọi xe, đi taxi",g:"到 + nơi = đến đâu. 大概 = khoảng. 靠边 = tấp vào lề. 堵车 = tắc đường.",gr:[{h:"",o:"",it:[["E师傅， V去 P火车站","shīfu, qù huǒchēzhàn","Bác tài, đi ga tàu"],["V到 P那儿 D大概 Q多少 N钱？","dào nàr dàgài duōshao qián?","Đến đó khoảng bao nhiêu tiền?"],["H要 Q多长 N时间？","yào duō cháng shíjiān?","Mất bao lâu?"],["T现在 V堵车 M吗？","xiànzài dǔ chē ma?","Bây giờ có tắc đường không?"],["S我 V赶 O时间， D请 V开 C快一点儿","wǒ gǎn shíjiān, qǐng kāi kuài yìdiǎnr","Tôi đang vội, xin lái nhanh chút"],["G在 P前面 V靠边 V停","zài qiánmiàn kào biān tíng","Tấp vào lề phía trước"],["D请 V打 O表","qǐng dǎ biǎo","Xin bật đồng hồ tính tiền"],["S我 V叫 M了 L一辆 O车","wǒ jiào le yí liàng chē","Tôi đã gọi một chiếc xe"]]}],d:[["A","师傅，去火车站。到那儿大概多少钱？","shīfu, qù huǒchēzhàn. dào nàr dàgài duōshao qián?","Bác tài, đi ga tàu. Đến đó khoảng bao nhiêu?"],["B","打表，大概四十块。","dǎ biǎo, dàgài sìshí kuài.","Tính đồng hồ, khoảng bốn mươi tệ."],["A","要多长时间？现在堵车吗？","yào duō cháng shíjiān? xiànzài dǔ chē ma?","Mất bao lâu? Giờ có tắc không?"],["B","不堵，二十分钟就到。","bù dǔ, èrshí fēnzhōng jiù dào.","Không tắc, hai mươi phút là đến."],["A","我赶时间，请开快一点儿。","wǒ gǎn shíjiān, qǐng kāi kuài yìdiǎnr.","Tôi đang vội, xin lái nhanh chút."],["A","到了，在前面靠边停。","dào le, zài qiánmiàn kào biān tíng.","Đến rồi, tấp vào lề phía trước."]]},
{t:"Đi xe buýt",g:"路 = tuyến xe: 五路车. 站 = bến, trạm. 下车 = xuống xe. 还有…站 = còn… bến.",gr:[{h:"",o:"",it:[["V去 P市中心 V坐 Q几路 O车？","qù shì zhōngxīn zuò jǐ lù chē?","Đi trung tâm thành phố ngồi xe số mấy?"],["V坐 L五路车","zuò wǔ lù chē","Ngồi xe số năm"],["S这路车 V到 P医院 M吗？","zhè lù chē dào yīyuàn ma?","Xe này có đến bệnh viện không?"],["D还 V有 Q几 N站？","hái yǒu jǐ zhàn?","Còn mấy bến nữa?"],["S我 G在 P下一站 V下车","wǒ zài xià yí zhàn xià chē","Tôi xuống ở bến sau"],["V到 M了 D请 V告诉 O我","dào le qǐng gàosu wǒ","Đến nơi xin báo tôi"],["D请 V让 L一下， S我 H要 V下车","qǐng ràng yíxià, wǒ yào xià chē","Xin nhường chút, tôi xuống xe"],["S车 P上 S人 D太 A多 M了","chē shang rén tài duō le","Trên xe đông người quá"]]}],d:[["A","请问，去市中心坐几路车？","qǐngwèn, qù shì zhōngxīn zuò jǐ lù chē?","Xin hỏi, đi trung tâm ngồi xe số mấy?"],["B","坐五路车。","zuò wǔ lù chē.","Ngồi xe số năm."],["A","师傅，这路车到医院吗？","shīfu, zhè lù chē dào yīyuàn ma?","Bác tài, xe này có đến bệnh viện không?"],["B","到。还有三站。","dào. hái yǒu sān zhàn.","Có. Còn ba bến."],["A","到了请告诉我。","dào le qǐng gàosu wǒ.","Đến nơi xin báo tôi."],["B","下一站就是医院。","xià yí zhàn jiù shì yīyuàn.","Bến sau là bệnh viện."],["A","请让一下，我要下车。","qǐng ràng yíxià, wǒ yào xià chē.","Xin nhường chút, tôi xuống xe."]]},
{t:"Hỏi đường chi tiết",g:"一直 = thẳng. 路口 = ngã tư. 拐 = rẽ. 对面 = đối diện. 走路 = đi bộ.",gr:[{h:"",o:"",it:[["D一直 G往 P前 V走","yìzhí wǎng qián zǒu","Đi thẳng về phía trước"],["G在 P第二个路口 G往 P右 V拐","zài dì èr ge lùkǒu wǎng yòu guǎi","Đến ngã tư thứ hai rẽ phải"],["V过 O马路 D就 V到 M了","guò mǎlù jiù dào le","Qua đường là đến"],["S银行 V在 P超市对面","yínháng zài chāoshì duìmiàn","Ngân hàng ở đối diện siêu thị"],["V走路 H要 Q多久？","zǒu lù yào duō jiǔ?","Đi bộ mất bao lâu?"],["V走路 L十分钟 D就 V到","zǒu lù shí fēnzhōng jiù dào","Đi bộ mười phút là đến"],["S你 V走 C错 O方向 M了","nǐ zǒu cuò fāngxiàng le","Bạn đi sai hướng rồi"],["S我 V带 O你 V去 M吧","wǒ dài nǐ qù ba","Để tôi dẫn bạn đi"]]}],d:[["A","请问，银行怎么走？","qǐngwèn, yínháng zěnme zǒu?","Xin hỏi, ngân hàng đi thế nào?"],["B","你走错方向了。一直往前走。","nǐ zǒu cuò fāngxiàng le. yìzhí wǎng qián zǒu.","Anh đi sai hướng rồi. Đi thẳng về phía trước."],["B","在第二个路口往右拐，过马路就到了。","zài dì èr ge lùkǒu wǎng yòu guǎi, guò mǎlù jiù dào le.","Đến ngã tư thứ hai rẽ phải, qua đường là đến."],["A","走路要多久？","zǒu lù yào duō jiǔ?","Đi bộ mất bao lâu?"],["B","走路十分钟就到。银行在超市对面。","zǒu lù shí fēnzhōng jiù dào. yínháng zài chāoshì duìmiàn.","Đi bộ mười phút. Ngân hàng đối diện siêu thị."],["B","我也去那边，我带你去吧。","wǒ yě qù nàbiān, wǒ dài nǐ qù ba.","Tôi cũng đi phía đó, để tôi dẫn anh đi."]]},
{t:"Gửi bưu kiện",g:"寄 = gửi (bưu điện). 包裹 = bưu kiện. 重 = nặng. 填 = điền. 地址 = địa chỉ.",gr:[{h:"",o:"",it:[["S我 H想 V寄 L一个 O包裹","wǒ xiǎng jì yí ge bāoguǒ","Tôi muốn gửi một bưu kiện"],["V寄 G到 Q哪儿？","jì dào nǎr?","Gửi đi đâu?"],["V寄 G到 P越南","jì dào Yuènán","Gửi đến Việt Nam"],["P里面 V是 Q什么 N东西？","lǐmiàn shì shénme dōngxi?","Bên trong là đồ gì?"],["D请 V填 L一下 O地址","qǐng tián yíxià dìzhǐ","Xin điền địa chỉ"],["Q几天 H能 V到？","jǐ tiān néng dào?","Mấy ngày thì đến?"],["S这个包裹 Q多 A重？","zhège bāoguǒ duō zhòng?","Bưu kiện này nặng bao nhiêu?"],["S运费 Q多少 N钱？","yùnfèi duōshao qián?","Phí vận chuyển bao nhiêu tiền?"]]}],d:[["A","你好，我想寄一个包裹。","nǐ hǎo, wǒ xiǎng jì yí ge bāoguǒ.","Chào bạn, tôi muốn gửi một bưu kiện."],["B","寄到哪儿？里面是什么东西？","jì dào nǎr? lǐmiàn shì shénme dōngxi?","Gửi đi đâu? Bên trong là gì?"],["A","寄到越南，里面是衣服。","jì dào Yuènán, lǐmiàn shì yīfu.","Gửi đến Việt Nam, bên trong là quần áo."],["B","请填一下地址。","qǐng tián yíxià dìzhǐ.","Xin điền địa chỉ."],["A","运费多少钱？几天能到？","yùnfèi duōshao qián? jǐ tiān néng dào?","Phí bao nhiêu? Mấy ngày đến?"],["B","一百二十块，大概七天。","yìbǎi èrshí kuài, dàgài qī tiān.","Một trăm hai mươi tệ, khoảng bảy ngày."]]},
{t:"Cắt tóc",g:"剪 = cắt. 短 = ngắn. 只…就行 = chỉ cần… là được. 洗头 = gội đầu. 染 = nhuộm.",gr:[{h:"",o:"",it:[["S我 H想 V剪 O头发","wǒ xiǎng jiǎn tóufa","Tôi muốn cắt tóc"],["S你 H想 Q怎么 V剪？","nǐ xiǎng zěnme jiǎn?","Bạn muốn cắt thế nào?"],["V剪 C短 L一点儿 D就 A行","jiǎn duǎn yìdiǎnr jiù xíng","Cắt ngắn một chút là được"],["Z不 H要 V剪 C太短","bú yào jiǎn tài duǎn","Đừng cắt ngắn quá"],["H要 V洗 O头 M吗？","yào xǐ tóu ma?","Có gội đầu không?"],["S我 H想 V染 O头发","wǒ xiǎng rǎn tóufa","Tôi muốn nhuộm tóc"],["H要 V等 Q多久？","yào děng duō jiǔ?","Phải đợi bao lâu?"],["S你 V看 A可以 M吗？","nǐ kàn kěyǐ ma?","Bạn xem được chưa?"]]}],d:[["A","你好，我想剪头发。要等多久？","nǐ hǎo, wǒ xiǎng jiǎn tóufa. yào děng duō jiǔ?","Chào bạn, tôi muốn cắt tóc. Phải đợi bao lâu?"],["B","不用等。你想怎么剪？","bú yòng děng. nǐ xiǎng zěnme jiǎn?","Không phải đợi. Anh muốn cắt thế nào?"],["A","剪短一点儿就行，不要剪太短。","jiǎn duǎn yìdiǎnr jiù xíng, bú yào jiǎn tài duǎn.","Cắt ngắn chút là được, đừng ngắn quá."],["B","要洗头吗？","yào xǐ tóu ma?","Có gội đầu không?"],["A","要。","yào.","Có."],["B","剪好了，你看可以吗？","jiǎn hǎo le, nǐ kàn kěyǐ ma?","Cắt xong rồi, anh xem được chưa?"],["A","很好，谢谢。","hěn hǎo, xièxie.","Rất tốt, cảm ơn."]]},
{t:"Sửa điện thoại",g:"坏了 / 碎了 / 开不了机 mô tả hỏng hóc. 修 = sửa. 取 = lấy. 多少钱 hỏi giá sửa.",gr:[{h:"",o:"",it:[["S我的手机 V摔 C坏 M了","wǒ de shǒujī shuāi huài le","Điện thoại tôi rơi hỏng rồi"],["S屏幕 V碎 M了","píngmù suì le","Màn hình vỡ rồi"],["S手机 V开 Z不 C了 O机","shǒujī kāi bu liǎo jī","Điện thoại không bật lên được"],["H能 V修 M吗？","néng xiū ma?","Sửa được không?"],["V换 L一个 O屏幕 Q多少 N钱？","huàn yí ge píngmù duōshao qián?","Thay màn hình bao nhiêu tiền?"],["Q什么时候 H能 V修 C好？","shénme shíhou néng xiū hǎo?","Bao giờ sửa xong?"],["T明天 T下午 V来 V取","míngtiān xiàwǔ lái qǔ","Chiều mai đến lấy"],["S电池 V用 M得 D很 A快","diànchí yòng de hěn kuài","Pin hết rất nhanh"]]}],d:[["A","我的手机摔坏了，屏幕碎了。能修吗？","wǒ de shǒujī shuāi huài le, píngmù suì le. néng xiū ma?","Điện thoại tôi rơi hỏng, màn hình vỡ rồi. Sửa được không?"],["B","我看看。能修，要换一个屏幕。","wǒ kànkan. néng xiū, yào huàn yí ge píngmù.","Để tôi xem. Sửa được, phải thay màn hình."],["A","换一个屏幕多少钱？","huàn yí ge píngmù duōshao qián?","Thay màn hình bao nhiêu?"],["B","三百块。","sān bǎi kuài.","Ba trăm tệ."],["A","什么时候能修好？","shénme shíhou néng xiū hǎo?","Bao giờ sửa xong?"],["B","明天下午来取。","míngtiān xiàwǔ lái qǔ.","Chiều mai đến lấy."]]},
{t:"Sim và nạp tiền điện thoại",g:"办 = làm (thủ tục). 流量 = dung lượng mạng. 充 = nạp. 套餐 = gói cước.",gr:[{h:"",o:"",it:[["S我 H想 V办 L一张 O手机卡","wǒ xiǎng bàn yì zhāng shǒujīkǎ","Tôi muốn làm một cái sim"],["V有 Q什么 O套餐？","yǒu shénme tàocān?","Có gói cước nào?"],["T每个月 Q多少 N钱？","měi ge yuè duōshao qián?","Mỗi tháng bao nhiêu tiền?"],["S流量 A够 V用 M吗？","liúliàng gòu yòng ma?","Dung lượng mạng có đủ dùng không?"],["S我 H要 V充 L一百块 O话费","wǒ yào chōng yìbǎi kuài huàfèi","Tôi muốn nạp một trăm tệ tiền điện thoại"],["S我的手机 Z没 O信号","wǒ de shǒujī méi xìnhào","Điện thoại tôi không có sóng"],["S你的号码 V是 Q多少？","nǐ de hàomǎ shì duōshao?","Số của bạn là bao nhiêu?"],["D请 V给 O我 V看 L一下 O护照","qǐng gěi wǒ kàn yíxià hùzhào","Xin cho tôi xem hộ chiếu"]]}],d:[["A","我想办一张手机卡。有什么套餐？","wǒ xiǎng bàn yì zhāng shǒujīkǎ. yǒu shénme tàocān?","Tôi muốn làm sim. Có gói cước nào?"],["B","这个套餐每个月五十块。","zhège tàocān měi ge yuè wǔshí kuài.","Gói này mỗi tháng năm mươi tệ."],["A","流量够用吗？","liúliàng gòu yòng ma?","Dung lượng có đủ dùng không?"],["B","够用。请给我看一下护照。","gòu yòng. qǐng gěi wǒ kàn yíxià hùzhào.","Đủ dùng. Xin cho tôi xem hộ chiếu."],["A","给你。我再充一百块话费。","gěi nǐ. wǒ zài chōng yìbǎi kuài huàfèi.","Đây ạ. Tôi nạp thêm một trăm tệ."],["B","好的，办好了。","hǎo de, bàn hǎo le.","Vâng, làm xong rồi."]]},
{t:"Xem phòng thuê",g:"包括 = bao gồm. 押金 = tiền cọc. 合同 = hợp đồng. 可以…吗 hỏi điều kiện.",gr:[{h:"",o:"",it:[["S我 H想 V看看 O房子","wǒ xiǎng kànkan fángzi","Tôi muốn xem nhà"],["S房租 V包括 O水电费 M吗？","fángzū bāokuò shuǐdiànfèi ma?","Tiền thuê có gồm điện nước không?"],["H要 V交 A多少 O押金？","yào jiāo duōshao yājīn?","Phải đặt cọc bao nhiêu?"],["V交 L一个月 O押金","jiāo yí ge yuè yājīn","Đặt cọc một tháng"],["H可以 V做饭 M吗？","kěyǐ zuò fàn ma?","Có được nấu ăn không?"],["S房间 P里 V有 O家具 M吗？","fángjiān li yǒu jiājù ma?","Trong phòng có đồ đạc không?"],["Q什么时候 H可以 V搬 C进来？","shénme shíhou kěyǐ bān jìnlai?","Bao giờ có thể chuyển vào?"],["S我们 V签 L一年 O合同","wǒmen qiān yì nián hétong","Chúng ta ký hợp đồng một năm"]]}],d:[["A","我想看看房子。房租多少钱？","wǒ xiǎng kànkan fángzi. fángzū duōshao qián?","Tôi muốn xem nhà. Tiền thuê bao nhiêu?"],["B","一个月两千块。","yí ge yuè liǎng qiān kuài.","Một tháng hai nghìn tệ."],["A","房租包括水电费吗？房间里有家具吗？","fángzū bāokuò shuǐdiànfèi ma? fángjiān li yǒu jiājù ma?","Có gồm điện nước không? Trong phòng có đồ không?"],["B","不包括水电费。家具都有，可以做饭。","bù bāokuò shuǐdiànfèi. jiājù dōu yǒu, kěyǐ zuò fàn.","Không gồm điện nước. Đồ đạc có đủ, được nấu ăn."],["A","要交多少押金？","yào jiāo duōshao yājīn?","Phải cọc bao nhiêu?"],["B","交一个月押金。我们签一年合同。","jiāo yí ge yuè yājīn. wǒmen qiān yì nián hétong.","Cọc một tháng. Mình ký hợp đồng một năm."]]},
{t:"Ở sân bay",g:"办登机手续 = làm thủ tục lên máy bay. 托运 = ký gửi. 登机口 = cửa lên máy bay. 晚点 = trễ giờ.",gr:[{h:"",o:"",it:[["G在 Q哪儿 V办 O登机手续？","zài nǎr bàn dēngjī shǒuxù?","Làm thủ tục lên máy bay ở đâu?"],["D请 V出示 O护照 J和 O机票","qǐng chūshì hùzhào hé jīpiào","Xin xuất trình hộ chiếu và vé máy bay"],["S你 V有 O行李 H要 V托运 M吗？","nǐ yǒu xíngli yào tuōyùn ma?","Bạn có hành lý cần ký gửi không?"],["S我 V有 L一个 O箱子","wǒ yǒu yí ge xiāngzi","Tôi có một cái va li"],["S我 H想 V要 O靠窗的座位","wǒ xiǎng yào kào chuāng de zuòwèi","Tôi muốn ghế cạnh cửa sổ"],["S登机口 V在 Q哪儿？","dēngjīkǒu zài nǎr?","Cửa lên máy bay ở đâu?"],["S飞机 V晚点 M了","fēijī wǎn diǎn le","Máy bay trễ giờ rồi"],["Q几点 V开始 V登机？","jǐ diǎn kāishǐ dēngjī?","Mấy giờ bắt đầu lên máy bay?"]]}],d:[["A","请问，在哪儿办登机手续？","qǐngwèn, zài nǎr bàn dēngjī shǒuxù?","Xin hỏi, làm thủ tục lên máy bay ở đâu?"],["B","在这儿。请出示护照和机票。","zài zhèr. qǐng chūshì hùzhào hé jīpiào.","Ở đây. Xin xuất trình hộ chiếu và vé."],["B","你有行李要托运吗？","nǐ yǒu xíngli yào tuōyùn ma?","Anh có hành lý ký gửi không?"],["A","我有一个箱子。我想要靠窗的座位。","wǒ yǒu yí ge xiāngzi. wǒ xiǎng yào kào chuāng de zuòwèi.","Tôi có một va li. Tôi muốn ghế cạnh cửa sổ."],["A","几点开始登机？登机口在哪儿？","jǐ diǎn kāishǐ dēngjī? dēngjīkǒu zài nǎr?","Mấy giờ lên máy bay? Cửa nào?"],["B","九点登机，十二号登机口。","jiǔ diǎn dēngjī, shí'èr hào dēngjīkǒu.","Chín giờ lên máy bay, cửa số mười hai."]]},
{t:"Nhận phòng khách sạn",g:"预订 = đặt trước. 住…晚 = ở… đêm. 含早餐 = gồm bữa sáng. 房卡 = thẻ phòng.",gr:[{h:"",o:"",it:[["S我 V预订 M了 L一个 O房间","wǒ yùdìng le yí ge fángjiān","Tôi đã đặt trước một phòng"],["S您 V住 Q几 N晚？","nín zhù jǐ wǎn?","Ông ở mấy đêm?"],["S我 V住 L两晚","wǒ zhù liǎng wǎn","Tôi ở hai đêm"],["S房费 V含 O早餐 M吗？","fángfèi hán zǎocān ma?","Giá phòng có gồm bữa sáng không?"],["S早餐 Q几点 V开始？","zǎocān jǐ diǎn kāishǐ?","Bữa sáng mấy giờ bắt đầu?"],["S这 V是 N您的房卡","zhè shì nín de fángkǎ","Đây là thẻ phòng của ông"],["S房间 P里 Z没有 O热水","fángjiān li méiyǒu rè shuǐ","Trong phòng không có nước nóng"],["T明天 Q几点 V退 O房？","míngtiān jǐ diǎn tuì fáng?","Mai mấy giờ trả phòng?"]]}],d:[["A","你好，我预订了一个房间。","nǐ hǎo, wǒ yùdìng le yí ge fángjiān.","Chào bạn, tôi đã đặt trước một phòng."],["B","请出示护照。您住几晚？","qǐng chūshì hùzhào. nín zhù jǐ wǎn?","Xin xuất trình hộ chiếu. Ông ở mấy đêm?"],["A","我住两晚。房费含早餐吗？","wǒ zhù liǎng wǎn. fángfèi hán zǎocān ma?","Tôi ở hai đêm. Giá phòng có gồm bữa sáng không?"],["B","含早餐，早餐七点开始。这是您的房卡。","hán zǎocān, zǎocān qī diǎn kāishǐ. zhè shì nín de fángkǎ.","Có, bữa sáng bắt đầu lúc bảy giờ. Đây là thẻ phòng của ông."],["A","明天几点退房？","míngtiān jǐ diǎn tuì fáng?","Mai mấy giờ trả phòng?"],["B","十二点以前。","shí'èr diǎn yǐqián.","Trước mười hai giờ."]]},
{t:"Ngày đầu ở văn phòng",g:"负责 = phụ trách. 向…介绍 = giới thiệu với…. 有不懂的 = có gì không hiểu. 熟悉 = làm quen.",gr:[{h:"",o:"",it:[["S我 V是 N新来的同事","wǒ shì xīn lái de tóngshì","Tôi là đồng nghiệp mới đến"],["S这 V是 N你的座位","zhè shì nǐ de zuòwèi","Đây là chỗ ngồi của bạn"],["S我 V负责 Q什么 O工作？","wǒ fùzé shénme gōngzuò?","Tôi phụ trách việc gì?"],["S我 V带 O你 V熟悉 L一下 O环境","wǒ dài nǐ shúxi yíxià huánjìng","Tôi dẫn bạn làm quen môi trường"],["V有 O不懂的 D就 V问 O我","yǒu bù dǒng de jiù wèn wǒ","Có gì không hiểu cứ hỏi tôi"],["S我 H会 A努力 V工作 M的","wǒ huì nǔlì gōngzuò de","Tôi sẽ cố gắng làm việc"],["T中午 S我们 D一起 V吃 O饭","zhōngwǔ wǒmen yìqǐ chī fàn","Buổi trưa chúng ta cùng ăn cơm"],["D请 S大家 A多 V帮助","qǐng dàjiā duō bāngzhù","Mong mọi người giúp đỡ nhiều"]]}],d:[["A","大家好，我是新来的同事，请大家多帮助。","dàjiā hǎo, wǒ shì xīn lái de tóngshì, qǐng dàjiā duō bāngzhù.","Chào mọi người, tôi là đồng nghiệp mới, mong mọi người giúp đỡ."],["B","欢迎。这是你的座位。","huānyíng. zhè shì nǐ de zuòwèi.","Hoan nghênh. Đây là chỗ ngồi của bạn."],["A","谢谢。我负责什么工作？","xièxie. wǒ fùzé shénme gōngzuò?","Cảm ơn. Tôi phụ trách việc gì?"],["B","我先带你熟悉一下环境。有不懂的就问我。","wǒ xiān dài nǐ shúxi yíxià huánjìng. yǒu bù dǒng de jiù wèn wǒ.","Tôi dẫn bạn làm quen môi trường trước. Có gì không hiểu cứ hỏi."],["A","好的，我会努力工作的。","hǎo de, wǒ huì nǔlì gōngzuò de.","Vâng, tôi sẽ cố gắng làm việc."],["B","中午我们一起吃饭。","zhōngwǔ wǒmen yìqǐ chī fàn.","Trưa mình cùng ăn cơm."]]},
{t:"Xin nghỉ, đổi ca",g:"因为…所以… nêu lý do. 替 = thay. 批准 = phê duyệt. 请假条 = đơn xin nghỉ.",gr:[{h:"",o:"",it:[["S我 T明天 H想 V请假","wǒ míngtiān xiǎng qǐng jià","Ngày mai tôi muốn xin nghỉ"],["S我 N家里 V有 O事","wǒ jiā li yǒu shì","Nhà tôi có việc"],["S你 H要 V请 Q几天 O假？","nǐ yào qǐng jǐ tiān jià?","Bạn muốn nghỉ mấy ngày?"],["S你 H能 V替 O我 V上班 M吗？","nǐ néng tì wǒ shàng bān ma?","Bạn đi làm thay tôi được không?"],["S我 G跟 O你 V换 O班 A行 M吗？","wǒ gēn nǐ huàn bān xíng ma?","Tôi đổi ca với bạn được không?"],["D请 V写 L一张 O请假条","qǐng xiě yì zhāng qǐngjiàtiáo","Xin viết một đơn xin nghỉ"],["S经理 V批准 M了","jīnglǐ pīzhǔn le","Quản lý phê duyệt rồi"],["S我 T后天 D就 V回来 V上班","wǒ hòutiān jiù huílai shàng bān","Ngày kia tôi đi làm lại"]]}],d:[["A","经理，我明天想请假，我家里有事。","jīnglǐ, wǒ míngtiān xiǎng qǐng jià, wǒ jiā li yǒu shì.","Quản lý, mai tôi muốn xin nghỉ, nhà tôi có việc."],["B","你要请几天假？","nǐ yào qǐng jǐ tiān jià?","Bạn muốn nghỉ mấy ngày?"],["A","一天，我后天就回来上班。","yì tiān, wǒ hòutiān jiù huílai shàng bān.","Một ngày, ngày kia tôi đi làm lại."],["B","谁替你上班？","shéi tì nǐ shàng bān?","Ai làm thay bạn?"],["A","小王跟我换班。","Xiǎo Wáng gēn wǒ huàn bān.","Tiểu Vương đổi ca với tôi."],["B","好，请写一张请假条。","hǎo, qǐng xiě yì zhāng qǐngjiàtiáo.","Được, viết một đơn xin nghỉ nhé."]]},
{t:"Họp nhóm",g:"开始 = bắt đầu. 先…然后… trình tự. 有什么意见 = có ý kiến gì. 总结 = tổng kết.",gr:[{h:"",o:"",it:[["S我们 V开始 V开会 M吧","wǒmen kāishǐ kāi huì ba","Chúng ta bắt đầu họp nhé"],["S人 D都 V到 C齐 M了 M吗？","rén dōu dào qí le ma?","Mọi người đến đủ chưa?"],["T今天 V讨论 L两个 O问题","jīntiān tǎolùn liǎng ge wèntí","Hôm nay thảo luận hai vấn đề"],["S大家 V有 Q什么 O意见？","dàjiā yǒu shénme yìjiàn?","Mọi người có ý kiến gì?"],["S我 V说 L两句","wǒ shuō liǎng jù","Tôi nói vài câu"],["S我 V同意 O他的看法","wǒ tóngyì tā de kànfǎ","Tôi đồng ý với cách nhìn của anh ấy"],["S我 D来 V总结 L一下","wǒ lái zǒngjié yíxià","Để tôi tổng kết một chút"],["S会 D就 V开 G到 P这儿","huì jiù kāi dào zhèr","Cuộc họp đến đây là hết"]]}],d:[["A","人都到齐了吗？我们开始开会吧。","rén dōu dào qí le ma? wǒmen kāishǐ kāi huì ba.","Mọi người đủ chưa? Mình bắt đầu họp nhé."],["B","到齐了。今天讨论两个问题。","dào qí le. jīntiān tǎolùn liǎng ge wèntí.","Đủ rồi. Hôm nay thảo luận hai vấn đề."],["A","大家有什么意见？","dàjiā yǒu shénme yìjiàn?","Mọi người có ý kiến gì?"],["B","我说两句。我同意他的看法。","wǒ shuō liǎng jù. wǒ tóngyì tā de kànfǎ.","Tôi nói vài câu. Tôi đồng ý cách nhìn của anh ấy."],["A","好，我来总结一下。","hǎo, wǒ lái zǒngjié yíxià.","Được, để tôi tổng kết."],["A","会就开到这儿，谢谢大家。","huì jiù kāi dào zhèr, xièxie dàjiā.","Cuộc họp đến đây thôi, cảm ơn mọi người."]]},
{t:"Nhờ đồng nghiệp",g:"能不能 + động từ = có thể… không. 帮我 + động từ. 顺便 = tiện thể. 麻烦你了 = phiền bạn rồi.",gr:[{h:"",o:"",it:[["S你 T现在 A忙 M吗？","nǐ xiànzài máng ma?","Bây giờ bạn bận không?"],["H能 Z不 H能 V帮 O我 L一个 O忙？","néng bu néng bāng wǒ yí ge máng?","Giúp tôi một việc được không?"],["V帮 O我 V看 L一下 O这个文件","bāng wǒ kàn yíxià zhège wénjiàn","Xem giúp tôi tài liệu này"],["S这个 S我 Z不 H会 V做","zhège wǒ bú huì zuò","Cái này tôi không biết làm"],["S你 V教教 O我 M吧","nǐ jiāojiao wǒ ba","Bạn dạy tôi đi"],["D顺便 V帮 O我 V带 L一杯 O咖啡","shùnbiàn bāng wǒ dài yì bēi kāfēi","Tiện thể mua giúp tôi cốc cà phê"],["A太 V谢谢 O你 M了","tài xièxie nǐ le","Cảm ơn bạn nhiều lắm"],["T下次 S我 V帮 O你","xià cì wǒ bāng nǐ","Lần sau tôi giúp bạn"]]}],d:[["A","你现在忙吗？能不能帮我一个忙？","nǐ xiànzài máng ma? néng bu néng bāng wǒ yí ge máng?","Giờ bạn bận không? Giúp mình một việc được không?"],["B","不忙，什么事？","bù máng, shénme shì?","Không bận, việc gì thế?"],["A","帮我看一下这个文件。这个我不会做。","bāng wǒ kàn yíxià zhège wénjiàn. zhège wǒ bú huì zuò.","Xem giúp mình tài liệu này. Cái này mình không biết làm."],["B","很简单，我教你。","hěn jiǎndān, wǒ jiāo nǐ.","Dễ lắm, mình chỉ cho."],["A","太谢谢你了。下次我帮你。","tài xièxie nǐ le. xià cì wǒ bāng nǐ.","Cảm ơn nhiều lắm. Lần sau mình giúp bạn."],["B","不客气。我去买咖啡，要帮你带一杯吗？","bú kèqi. wǒ qù mǎi kāfēi, yào bāng nǐ dài yì bēi ma?","Không có gì. Mình đi mua cà phê, mua giúp bạn một cốc nhé?"]]},
{t:"Báo cáo tiến độ",g:"进度 = tiến độ. 完成了百分之… = xong… phần trăm. 来得及 = kịp. 遇到 = gặp phải.",gr:[{h:"",o:"",it:[["S工作 V进行 M得 Q怎么样？","gōngzuò jìnxíng de zěnmeyàng?","Công việc tiến hành thế nào rồi?"],["D已经 V完成 M了 L一半","yǐjīng wánchéng le yíbàn","Đã hoàn thành một nửa"],["S我们 V遇到 M了 L一点儿 O问题","wǒmen yùdào le yìdiǎnr wèntí","Chúng tôi gặp một chút vấn đề"],["T星期五 V来得及 M吗？","xīngqīwǔ láidejí ma?","Thứ sáu có kịp không?"],["D应该 V来得及","yīnggāi láidejí","Chắc là kịp"],["S我 V需要 D再 L两天","wǒ xūyào zài liǎng tiān","Tôi cần thêm hai ngày nữa"],["S报告 S我 T明天 V交","bàogào wǒ míngtiān jiāo","Báo cáo mai tôi nộp"],["V有 O问题 D随时 V联系 O我","yǒu wèntí suíshí liánxì wǒ","Có vấn đề cứ liên hệ tôi bất cứ lúc nào"]]}],d:[["A","工作进行得怎么样？","gōngzuò jìnxíng de zěnmeyàng?","Công việc thế nào rồi?"],["B","已经完成了一半，我们遇到了一点儿问题。","yǐjīng wánchéng le yíbàn, wǒmen yùdào le yìdiǎnr wèntí.","Đã xong một nửa, bọn em gặp chút vấn đề."],["A","星期五来得及吗？","xīngqīwǔ láidejí ma?","Thứ sáu có kịp không?"],["B","应该来得及。我需要再两天。","yīnggāi láidejí. wǒ xūyào zài liǎng tiān.","Chắc kịp ạ. Em cần thêm hai ngày."],["A","好。报告什么时候交？","hǎo. bàogào shénme shíhou jiāo?","Được. Báo cáo bao giờ nộp?"],["B","报告我明天交。","bàogào wǒ míngtiān jiāo.","Báo cáo mai em nộp."]]},
{t:"Trong lớp tiếng Trung",g:"怎么说 / 怎么写 / 什么意思 là ba câu hỏi vàng của người học. 跟我读 = đọc theo tôi.",gr:[{h:"",o:"",it:[["S这个字 Q怎么 V读？","zhège zì zěnme dú?","Chữ này đọc thế nào?"],["S这个词 V是 Q什么 N意思？","zhège cí shì shénme yìsi?","Từ này nghĩa là gì?"],["O这个 G用 O中文 Q怎么 V说？","zhège yòng Zhōngwén zěnme shuō?","Cái này tiếng Trung nói thế nào?"],["S老师， D请 D再 V讲 L一遍","lǎoshī, qǐng zài jiǎng yí biàn","Thầy ơi, xin giảng lại một lần"],["D请 V跟 O我 V读","qǐng gēn wǒ dú","Xin đọc theo tôi"],["S我 V有 L一个 O问题","wǒ yǒu yí ge wèntí","Em có một câu hỏi"],["S我的发音 V对 Z不 V对？","wǒ de fāyīn duì bu duì?","Phát âm của em có đúng không?"],["S你 V说 M得 D越来越 A好 M了","nǐ shuō de yuèláiyuè hǎo le","Em nói ngày càng tốt"]]}],d:[["A","老师，我有一个问题。这个字怎么读？","lǎoshī, wǒ yǒu yí ge wèntí. zhège zì zěnme dú?","Thầy ơi, em có một câu hỏi. Chữ này đọc thế nào?"],["B","读“谢”。请跟我读：谢谢。","dú \"xiè\". qǐng gēn wǒ dú: xièxie.","Đọc là \"xiè\". Đọc theo thầy: xièxie."],["A","谢谢。我的发音对不对？","xièxie. wǒ de fāyīn duì bu duì?","Xièxie. Em phát âm đúng không ạ?"],["B","很对。你说得越来越好了。","hěn duì. nǐ shuō de yuèláiyuè hǎo le.","Rất đúng. Em nói ngày càng tốt."],["A","这个词是什么意思？","zhège cí shì shénme yìsi?","Từ này nghĩa là gì ạ?"],["B","是感谢的意思。","shì gǎnxiè de yìsi.","Nghĩa là \"cảm ơn\"."]]},
{t:"Thi cử",g:"考试 = thi. 复习 = ôn. 紧张 = căng thẳng. 考得… đánh giá kết quả. 通过 = qua, đỗ.",gr:[{h:"",o:"",it:[["T明天 V有 O考试","míngtiān yǒu kǎoshì","Ngày mai có bài thi"],["S你 V复习 M了 M吗？","nǐ fùxí le ma?","Bạn ôn bài chưa?"],["S我 D有点儿 A紧张","wǒ yǒudiǎnr jǐnzhāng","Tôi hơi căng thẳng"],["Z别 A紧张， D慢慢 V做","bié jǐnzhāng, mànmàn zuò","Đừng căng thẳng, làm từ từ"],["S你 V考 M得 Q怎么样？","nǐ kǎo de zěnmeyàng?","Bạn thi thế nào?"],["S我 V考 M得 Z不 D太 A好","wǒ kǎo de bú tài hǎo","Tôi thi không tốt lắm"],["S这次考试 D很 A难","zhè cì kǎoshì hěn nán","Bài thi lần này rất khó"],["S我 V通过 M了","wǒ tōngguò le","Tôi qua rồi"]]}],d:[["A","明天有考试，你复习了吗？","míngtiān yǒu kǎoshì, nǐ fùxí le ma?","Mai thi rồi, bạn ôn chưa?"],["B","复习了，但是我有点儿紧张。","fùxí le, dànshì wǒ yǒudiǎnr jǐnzhāng.","Ôn rồi, nhưng mình hơi căng thẳng."],["A","别紧张，慢慢做。","bié jǐnzhāng, mànmàn zuò.","Đừng căng thẳng, làm từ từ."],["A","你考得怎么样？","nǐ kǎo de zěnmeyàng?","Bạn thi thế nào?"],["B","这次考试很难，我考得不太好。你呢？","zhè cì kǎoshì hěn nán, wǒ kǎo de bú tài hǎo. nǐ ne?","Bài lần này khó, mình thi không tốt lắm. Còn bạn?"],["A","我通过了。","wǒ tōngguò le.","Mình qua rồi."]]},
{t:"Ở thư viện",g:"借 = mượn, 还 (huán) = trả. 可以借多久 = mượn được bao lâu. 过期 = quá hạn. 安静 = yên lặng.",gr:[{h:"",o:"",it:[["S我 H想 V借 L这本 O书","wǒ xiǎng jiè zhè běn shū","Tôi muốn mượn quyển sách này"],["H可以 V借 Q多久？","kěyǐ jiè duō jiǔ?","Mượn được bao lâu?"],["H可以 V借 L一个月","kěyǐ jiè yí ge yuè","Mượn được một tháng"],["S我 V来 V还 O书","wǒ lái huán shū","Tôi đến trả sách"],["S这本书 V过期 M了","zhè běn shū guò qī le","Quyển này quá hạn rồi"],["P这儿 H可以 V上网 M吗？","zhèr kěyǐ shàng wǎng ma?","Ở đây lên mạng được không?"],["D请 V保持 A安静","qǐng bǎochí ānjìng","Xin giữ yên lặng"],["S你的借书证 N呢？","nǐ de jièshūzhèng ne?","Thẻ mượn sách của bạn đâu?"]]}],d:[["A","你好，我想借这本书。","nǐ hǎo, wǒ xiǎng jiè zhè běn shū.","Chào bạn, tôi muốn mượn quyển này."],["B","你的借书证呢？","nǐ de jièshūzhèng ne?","Thẻ mượn sách của bạn đâu?"],["A","在这儿。可以借多久？","zài zhèr. kěyǐ jiè duō jiǔ?","Đây ạ. Mượn được bao lâu?"],["B","可以借一个月。","kěyǐ jiè yí ge yuè.","Mượn được một tháng."],["A","我还要还书。","wǒ hái yào huán shū.","Tôi còn phải trả sách nữa."],["B","这本书过期了，要交两块钱。","zhè běn shū guò qī le, yào jiāo liǎng kuài qián.","Quyển này quá hạn rồi, phải nộp hai tệ."]]},
{t:"Máy tính và in ấn",g:"打印 = in. 复印 = photo. 份 = bản. 死机 = treo máy. 保存 = lưu. 发给 = gửi cho.",gr:[{h:"",o:"",it:[["S电脑 V死机 M了","diànnǎo sǐ jī le","Máy tính treo rồi"],["S你 V保存 M了 M吗？","nǐ bǎocún le ma?","Bạn lưu chưa?"],["V帮 O我 V打印 L两份","bāng wǒ dǎyìn liǎng fèn","In giúp tôi hai bản"],["S打印机 Z没 O纸 M了","dǎyìnjī méi zhǐ le","Máy in hết giấy rồi"],["S这个 H要 V复印 Q几 L份？","zhège yào fùyìn jǐ fèn?","Cái này photo mấy bản?"],["G把 O文件 V发 G给 O我","bǎ wénjiàn fā gěi wǒ","Gửi tài liệu cho tôi"],["S我 V收 Z不 C到 O你的邮件","wǒ shōu bu dào nǐ de yóujiàn","Tôi không nhận được email của bạn"],["S你 V重新 V发 L一次","nǐ chóngxīn fā yí cì","Bạn gửi lại một lần nữa"]]}],d:[["A","糟糕，电脑死机了。","zāogāo, diànnǎo sǐ jī le.","Chết rồi, máy tính treo rồi."],["B","你保存了吗？","nǐ bǎocún le ma?","Bạn lưu chưa?"],["A","保存了。你把文件发给我吧。","bǎocún le. nǐ bǎ wénjiàn fā gěi wǒ ba.","Lưu rồi. Bạn gửi tài liệu cho mình đi."],["B","发了。","fā le.","Gửi rồi."],["A","我收不到你的邮件，你重新发一次。","wǒ shōu bu dào nǐ de yóujiàn, nǐ chóngxīn fā yí cì.","Mình không nhận được email, bạn gửi lại lần nữa."],["B","好。帮我打印两份。","hǎo. bāng wǒ dǎyìn liǎng fèn.","Ừ. In giúp mình hai bản."],["A","打印机没纸了。","dǎyìnjī méi zhǐ le.","Máy in hết giấy rồi."]]},
{t:"Tan làm, hẹn sau giờ",g:"下班以后 = sau khi tan làm. 要不要 = có muốn… không. 顺路 = tiện đường. 改天 = hôm khác.",gr:[{h:"",o:"",it:[["S你 Q几点 V下班？","nǐ jǐ diǎn xià bān?","Mấy giờ bạn tan làm?"],["T下班以后 S你 V有 O事 M吗？","xià bān yǐhòu nǐ yǒu shì ma?","Tan làm xong bạn có việc gì không?"],["H要 Z不 H要 D一起 V吃 O晚饭？","yào bu yào yìqǐ chī wǎnfàn?","Có muốn cùng ăn tối không?"],["S我 D还 H得 V加 L一会儿 O班","wǒ hái děi jiā yíhuìr bān","Tôi còn phải tăng ca một lát"],["S我 V等 O你","wǒ děng nǐ","Tôi đợi bạn"],["S我 V送 O你 V回家， S我 V顺路","wǒ sòng nǐ huí jiā, wǒ shùn lù","Tôi đưa bạn về, tôi tiện đường"],["T今天 A累 C坏 M了","jīntiān lèi huài le","Hôm nay mệt rã rời"],["T明天 V见","míngtiān jiàn","Mai gặp lại"]]}],d:[["A","你几点下班？下班以后你有事吗？","nǐ jǐ diǎn xià bān? xià bān yǐhòu nǐ yǒu shì ma?","Mấy giờ bạn tan làm? Tan làm xong có việc gì không?"],["B","没事。怎么了？","méi shì. zěnme le?","Không. Sao thế?"],["A","要不要一起吃晚饭？","yào bu yào yìqǐ chī wǎnfàn?","Cùng ăn tối không?"],["B","好啊，但是我还得加一会儿班。","hǎo a, dànshì wǒ hái děi jiā yíhuìr bān.","Được chứ, nhưng mình còn phải tăng ca một lát."],["A","没关系，我等你。","méi guānxi, wǒ děng nǐ.","Không sao, mình đợi bạn."],["B","今天累坏了。吃完饭我送你回家，我顺路。","jīntiān lèi huài le. chī wán fàn wǒ sòng nǐ huí jiā, wǒ shùn lù.","Hôm nay mệt rã rời. Ăn xong mình đưa bạn về, mình tiện đường."]]},
{t:"Làm quen bạn mới",g:"来…多久了 = đến… bao lâu rồi. 是…人 = là người…. 加个微信 = kết bạn WeChat.",gr:[{h:"",o:"",it:[["S你 V是 Q哪里 N人？","nǐ shì nǎlǐ rén?","Bạn là người ở đâu?"],["S我 V是 N越南人， V来 P中国 L两年 M了","wǒ shì Yuènán rén, lái Zhōngguó liǎng nián le","Tôi là người Việt Nam, đến Trung Quốc hai năm rồi"],["S你的中文 V说 M得 D真 A好","nǐ de Zhōngwén shuō de zhēn hǎo","Tiếng Trung của bạn nói hay thật"],["E哪里哪里， D还 V差 M得 A远","nǎlǐ nǎlǐ, hái chà de yuǎn","Đâu có, còn kém xa lắm"],["S你 V有 Q什么 O爱好？","nǐ yǒu shénme àihào?","Bạn có sở thích gì?"],["S我 V喜欢 V旅游 J和 V拍照","wǒ xǐhuan lǚyóu hé pāi zhào","Tôi thích du lịch và chụp ảnh"],["S我们 V加 L个 O微信 M吧","wǒmen jiā ge Wēixìn ba","Chúng ta kết bạn WeChat nhé"],["D很 A高兴 V认识 O你","hěn gāoxìng rènshi nǐ","Rất vui được quen bạn"]]}],d:[["A","你好，你是哪里人？","nǐ hǎo, nǐ shì nǎlǐ rén?","Chào bạn, bạn là người ở đâu?"],["B","我是越南人，来中国两年了。","wǒ shì Yuènán rén, lái Zhōngguó liǎng nián le.","Mình là người Việt Nam, đến Trung Quốc hai năm rồi."],["A","你的中文说得真好。","nǐ de Zhōngwén shuō de zhēn hǎo.","Tiếng Trung của bạn hay thật."],["B","哪里哪里，还差得远。你有什么爱好？","nǎlǐ nǎlǐ, hái chà de yuǎn. nǐ yǒu shénme àihào?","Đâu có, còn kém lắm. Bạn có sở thích gì?"],["A","我喜欢旅游和拍照。我们加个微信吧。","wǒ xǐhuan lǚyóu hé pāi zhào. wǒmen jiā ge Wēixìn ba.","Mình thích du lịch và chụp ảnh. Mình kết bạn WeChat nhé."],["B","好啊，很高兴认识你。","hǎo a, hěn gāoxìng rènshi nǐ.","Được chứ, rất vui được quen bạn."]]},

{t:"An ủi, động viên",g:"别难过 = đừng buồn. 会好的 = sẽ ổn thôi. 有我呢 = có tôi đây. 想开点儿 = nghĩ thoáng lên.",gr:[{h:"",o:"",it:[["S你 Q怎么 Z不 A高兴？","nǐ zěnme bù gāoxìng?","Sao bạn không vui?"],["S我 T最近 N压力 D很 A大","wǒ zuìjìn yālì hěn dà","Dạo này tôi áp lực lắm"],["Z别 A难过 M了","bié nánguò le","Đừng buồn nữa"],["S一切 D都 H会 A好 M的","yíqiè dōu huì hǎo de","Mọi thứ sẽ ổn thôi"],["V有 O我 M呢","yǒu wǒ ne","Có tôi đây mà"],["S你 D已经 V做 M得 D很 A好 M了","nǐ yǐjīng zuò de hěn hǎo le","Bạn đã làm rất tốt rồi"],["V休息 L几天 D就 A好 M了","xiūxi jǐ tiān jiù hǎo le","Nghỉ vài ngày là ổn"],["S我 V相信 O你","wǒ xiāngxìn nǐ","Tôi tin bạn"]]}],d:[["A","你怎么不高兴？","nǐ zěnme bù gāoxìng?","Sao bạn không vui?"],["B","我最近压力很大，工作也做不好。","wǒ zuìjìn yālì hěn dà, gōngzuò yě zuò bu hǎo.","Dạo này mình áp lực lắm, việc cũng làm không tốt."],["A","别难过了。你已经做得很好了。","bié nánguò le. nǐ yǐjīng zuò de hěn hǎo le.","Đừng buồn nữa. Bạn đã làm rất tốt rồi."],["B","真的吗？","zhēn de ma?","Thật không?"],["A","真的。我相信你，一切都会好的。","zhēn de. wǒ xiāngxìn nǐ, yíqiè dōu huì hǎo de.","Thật. Mình tin bạn, mọi thứ sẽ ổn thôi."],["B","谢谢你。","xièxie nǐ.","Cảm ơn bạn."],["A","有我呢。休息几天就好了。","yǒu wǒ ne. xiūxi jǐ tiān jiù hǎo le.","Có mình đây mà. Nghỉ vài ngày là ổn."]]},
{t:"Xin lỗi và làm lành",g:"是我不好 = lỗi tại tôi. 不是故意的 = không cố ý. 原谅 = tha thứ. 下次不会了 = lần sau không thế nữa.",gr:[{h:"",o:"",it:[["E对不起， V是 S我 Z不 A好","duìbuqǐ, shì wǒ bù hǎo","Xin lỗi, là tôi không tốt"],["S我 Z不 V是 A故意的","wǒ bú shì gùyì de","Tôi không cố ý"],["S你 D还 V生 O我的气 M吗？","nǐ hái shēng wǒ de qì ma?","Bạn còn giận tôi không?"],["S你 H能 V原谅 O我 M吗？","nǐ néng yuánliàng wǒ ma?","Bạn tha thứ cho tôi được không?"],["T下次 Z不 H会 M了","xià cì bú huì le","Lần sau không thế nữa"],["S我 V说话 D太 A重 M了","wǒ shuō huà tài zhòng le","Tôi nói nặng lời quá"],["E算了， Z别 V放 G在 P心上","suàn le, bié fàng zài xīn shang","Thôi, đừng để bụng"],["S我们 D还 V是 N好朋友","wǒmen hái shì hǎo péngyou","Chúng ta vẫn là bạn tốt"]]}],d:[["A","对不起，是我不好。我说话太重了。","duìbuqǐ, shì wǒ bù hǎo. wǒ shuō huà tài zhòng le.","Xin lỗi, là mình không tốt. Mình nói nặng lời quá."],["B","你知道就好。","nǐ zhīdào jiù hǎo.","Bạn biết thế là được."],["A","我不是故意的。你还生我的气吗？","wǒ bú shì gùyì de. nǐ hái shēng wǒ de qì ma?","Mình không cố ý. Bạn còn giận mình không?"],["B","有一点儿。","yǒu yìdiǎnr.","Còn một chút."],["A","你能原谅我吗？下次不会了。","nǐ néng yuánliàng wǒ ma? xià cì bú huì le.","Tha thứ cho mình được không? Lần sau không thế nữa."],["B","算了，别放在心上。我们还是好朋友。","suàn le, bié fàng zài xīn shang. wǒmen hái shì hǎo péngyou.","Thôi, đừng để bụng. Mình vẫn là bạn tốt."]]},

{t:"Tập thể dục",g:"锻炼 = rèn luyện. 每周…次 = mỗi tuần… lần. 减肥 = giảm cân. 坚持 = kiên trì. 出汗 = ra mồ hôi.",gr:[{h:"",o:"",it:[["S你 D经常 V锻炼 O身体 M吗？","nǐ jīngcháng duànliàn shēntǐ ma?","Bạn có hay tập thể dục không?"],["S我 T每周 V跑 L三次 O步","wǒ měi zhōu pǎo sān cì bù","Mỗi tuần tôi chạy bộ ba lần"],["S我 H想 V减肥","wǒ xiǎng jiǎn féi","Tôi muốn giảm cân"],["S我们 D一起 V去 O健身房 M吧","wǒmen yìqǐ qù jiànshēnfáng ba","Mình cùng đi phòng gym đi"],["S我 V跑 Z不 C动 M了","wǒ pǎo bu dòng le","Tôi chạy không nổi nữa"],["D再 V坚持 L一下","zài jiānchí yíxià","Cố thêm chút nữa"],["S我 V出 M了 A很多 O汗","wǒ chū le hěn duō hàn","Tôi ra rất nhiều mồ hôi"],["S运动 G对 O身体 D很 A好","yùndòng duì shēntǐ hěn hǎo","Vận động rất tốt cho sức khỏe"]]}],d:[["A","你经常锻炼身体吗？","nǐ jīngcháng duànliàn shēntǐ ma?","Bạn có hay tập thể dục không?"],["B","我每周跑三次步。你呢？","wǒ měi zhōu pǎo sān cì bù. nǐ ne?","Mỗi tuần mình chạy ba lần. Còn bạn?"],["A","我不运动。但是我想减肥。","wǒ bú yùndòng. dànshì wǒ xiǎng jiǎn féi.","Mình không vận động. Nhưng mình muốn giảm cân."],["B","运动对身体很好。我们一起去健身房吧。","yùndòng duì shēntǐ hěn hǎo. wǒmen yìqǐ qù jiànshēnfáng ba.","Vận động tốt cho sức khỏe. Mình cùng đi gym đi."],["A","我跑不动了，出了很多汗。","wǒ pǎo bu dòng le, chū le hěn duō hàn.","Mình chạy không nổi nữa, ra nhiều mồ hôi quá."],["B","再坚持一下。","zài jiānchí yíxià.","Cố thêm chút nữa."]]},

{h:"chủ ngữ + 在 + nơi + động từ",o:"K=在 (ở)",it:[["S我 K在 P家 V吃 O饭","wǒ zài jiā chī fàn","Tôi ăn cơm ở nhà"],["S他 K在 P工厂 V上班","tā zài gōngchǎng shàng bān","Anh ấy làm ở nhà máy"],["S我们 K在 P教室 V上课","wǒmen zài jiàoshì shàng kè","Chúng tôi học ở phòng học"],["S孩子 K在 P公园 V玩","háizi zài gōngyuán wán","Trẻ con chơi ở công viên"],["S我 K在 P网上 V买 O东西","wǒ zài wǎngshàng mǎi dōngxi","Tôi mua đồ trên mạng"],["S她 K在 P医院 V工作","tā zài yīyuàn gōngzuò","Cô ấy làm việc ở bệnh viện"],["S我 K在 P门口 V等 O你","wǒ zài ménkǒu děng nǐ","Tôi đợi bạn ở cửa"],["S爸爸 K在 P房间里 V睡觉","bàba zài fángjiān li shuì jiào","Bố ngủ trong phòng"],["S我们 K在 P食堂 V吃 O午饭","wǒmen zài shítáng chī wǔfàn","Chúng tôi ăn trưa ở nhà ăn"],["S你 K在 Q哪儿 V工作？","nǐ zài nǎr gōngzuò?","Bạn làm việc ở đâu?"]]},
{h:"住在 / 放在 / 坐在 (động từ + 在 + nơi)",o:"V=động từ;K=在 (ở, vào)",it:[["S我 V住 K在 P河内","wǒ zhù zài Hénèi","Tôi sống ở Hà Nội"],["S他 V住 K在 P公司宿舍","tā zhù zài gōngsī sùshè","Anh ấy ở ký túc xá công ty"],["S书 V放 K在 P桌子上","shū fàng zài zhuōzi shang","Sách để trên bàn"],["S你 V坐 K在 P这儿","nǐ zuò zài zhèr","Bạn ngồi ở đây"],["S车 V停 K在 P楼下","chē tíng zài lóu xià","Xe đỗ dưới nhà"],["S他 V站 K在 P门口","tā zhàn zài ménkǒu","Anh ấy đứng ở cửa"],["S名字 V写 K在 P这儿","míngzi xiě zài zhèr","Tên viết ở đây"],["S衣服 V挂 K在 P衣柜里","yīfu guà zài yīguì li","Quần áo treo trong tủ"],["S我 V生 K在 P越南","wǒ shēng zài Yuènán","Tôi sinh ra ở Việt Nam"],["S你 V住 K在 Q几楼？","nǐ zhù zài jǐ lóu?","Bạn ở tầng mấy?"]]}],d:[]},
{t:"Ghép câu tính từ làm vị ngữ",g:"Chủ ngữ + 很 + tính từ, KHÔNG có 是. 很 ở đây gần như chỉ để câu trọn vẹn. Phủ định: 不 + tính từ. Hỏi: tính từ + 吗 hoặc tính từ + 不 + tính từ.",gr:[{h:"chủ ngữ + 很 + tính từ",o:"D=很 (rất)",it:[["S今天 D很 A热","jīntiān hěn rè","Hôm nay rất nóng"],["S他 D很 A高","tā hěn gāo","Anh ấy rất cao"],["S这个菜 D很 A辣","zhège cài hěn là","Món này rất cay"],["S中文 D很 A难","Zhōngwén hěn nán","Tiếng Trung rất khó"],["S我家 D很 A远","wǒ jiā hěn yuǎn","Nhà tôi rất xa"],["S房间 D很 A干净","fángjiān hěn gānjìng","Phòng rất sạch"],["S老板 D很 A忙","lǎobǎn hěn máng","Sếp rất bận"],["S她 D很 A漂亮","tā hěn piàoliang","Cô ấy rất đẹp"],["S东西 D很 A便宜","dōngxi hěn piányi","Đồ rất rẻ"],["S我 D很 A高兴","wǒ hěn gāoxìng","Tôi rất vui"]]},
{h:"chủ ngữ + 不 + tính từ",o:"Z=不 (phủ định)",it:[["S我 Z不 A忙","wǒ bù máng","Tôi không bận"],["S今天 Z不 A冷","jīntiān bù lěng","Hôm nay không lạnh"],["S这个 Z不 A贵","zhège bú guì","Cái này không đắt"],["S他 Z不 A高兴","tā bù gāoxìng","Anh ấy không vui"],["S公司 Z不 A远","gōngsī bù yuǎn","Công ty không xa"],["S这件 Z不 A好看","zhè jiàn bù hǎokàn","Cái này không đẹp"],["S我 Z不 A饿","wǒ bú è","Tôi không đói"],["S路 Z不 A好走","lù bù hǎo zǒu","Đường không dễ đi"],["S水 Z不 A热","shuǐ bú rè","Nước không nóng"],["S问题 Z不 A大","wèntí bú dà","Vấn đề không lớn"]]},
{h:"hỏi: tính từ + 吗 / A 不 A",o:"M=吗;K=A 不 A",it:[["S你 A累 M吗？","nǐ lèi ma?","Bạn mệt không?"],["S那儿 A远 M吗？","nàr yuǎn ma?","Chỗ đó xa không?"],["S工作 A忙 M吗？","gōngzuò máng ma?","Công việc bận không?"],["S这个 K好不好？","zhège hǎo bu hǎo?","Cái này tốt không?"],["S房租 K贵不贵？","fángzū guì bu guì?","Tiền thuê nhà đắt không?"],["S菜 K辣不辣？","cài là bu là?","Món có cay không?"],["S你 K饿不饿？","nǐ è bu è?","Bạn đói không?"],["S外面 K冷不冷？","wàimiàn lěng bu lěng?","Bên ngoài lạnh không?"],["S中文 K难不难？","Zhōngwén nán bu nán?","Tiếng Trung khó không?"],["S那个地方 K好玩不好玩？","nàge dìfang hǎowán bu hǎowán?","Chỗ đó chơi vui không?"]]}],d:[]},
{t:"Ghép câu với 也, 都, 还",g:"Ba phó từ luôn đứng TRƯỚC động từ / tính từ, sau chủ ngữ. 也 = cũng. 都 = đều. 还 = còn, vẫn. Thứ tự khi đi cùng: 也 + 都.",gr:[{h:"chủ ngữ + 也 + vị ngữ",o:"K=也 (cũng)",it:[["S我 K也 V是 N越南人","wǒ yě shì Yuènán rén","Tôi cũng là người Việt Nam"],["S他 K也 V喜欢 O咖啡","tā yě xǐhuan kāfēi","Anh ấy cũng thích cà phê"],["S我 K也 D很 A忙","wǒ yě hěn máng","Tôi cũng rất bận"],["S我 K也 H想 V去","wǒ yě xiǎng qù","Tôi cũng muốn đi"],["S她 K也 Z不 V知道","tā yě bù zhīdào","Cô ấy cũng không biết"],["S我 K也 V有 L一个","wǒ yě yǒu yí ge","Tôi cũng có một cái"],["S明天 K也 V下雨","míngtiān yě xià yǔ","Ngày mai cũng mưa"],["S你 K也 V来 M吧","nǐ yě lái ba","Bạn cũng đến đi"],["S我 K也 Z没 V吃","wǒ yě méi chī","Tôi cũng chưa ăn"],["S这个 K也 D很 A好","zhège yě hěn hǎo","Cái này cũng rất tốt"]]},
{h:"chủ ngữ + 都 + vị ngữ",o:"K=都 (đều)",it:[["S我们 K都 V是 N工人","wǒmen dōu shì gōngrén","Chúng tôi đều là công nhân"],["S大家 K都 V来 M了","dàjiā dōu lái le","Mọi người đều đến rồi"],["S他们 K都 D很 A好","tāmen dōu hěn hǎo","Họ đều rất tốt"],["S我 T每天 K都 V上班","wǒ měi tiān dōu shàng bān","Ngày nào tôi cũng đi làm"],["S这些 K都 V是 N我的","zhèxiē dōu shì wǒ de","Những cái này đều là của tôi"],["S我们 K都 V喜欢 O她","wǒmen dōu xǐhuan tā","Chúng tôi đều thích cô ấy"],["S我 Q什么 K都 V吃","wǒ shénme dōu chī","Cái gì tôi cũng ăn"],["S他们 K都 Z不 V去","tāmen dōu bú qù","Họ đều không đi"],["S我们 K也都 V知道","wǒmen yě dōu zhīdào","Chúng tôi cũng đều biết"],["S东西 K都 V买 C好 M了","dōngxi dōu mǎi hǎo le","Đồ đều mua xong rồi"]]},
{h:"chủ ngữ + 还 + vị ngữ",o:"K=还 (còn, vẫn)",it:[["S我 K还 Z没 V吃 O饭","wǒ hái méi chī fàn","Tôi vẫn chưa ăn cơm"],["S他 K还 D在 V睡觉","tā hái zài shuì jiào","Anh ấy vẫn đang ngủ"],["S我 K还 V有 L一个 O问题","wǒ hái yǒu yí ge wèntí","Tôi còn một câu hỏi"],["S你 K还 V要 Q什么？","nǐ hái yào shénme?","Bạn còn cần gì nữa?"],["S她 K还 Z没 V来","tā hái méi lái","Cô ấy vẫn chưa đến"],["S我 K还 H想 V吃","wǒ hái xiǎng chī","Tôi còn muốn ăn nữa"],["S时间 K还 A早","shíjiān hái zǎo","Thời gian còn sớm"],["S雨 K还 D在 V下","yǔ hái zài xià","Mưa vẫn đang rơi"],["S我 K还 Z不 V知道","wǒ hái bù zhīdào","Tôi vẫn chưa biết"],["S他 K还 V是 N学生","tā hái shì xuésheng","Anh ấy vẫn là học sinh"]]}],d:[]},
{t:"Ghép câu hỏi với 什么, 谁, 哪",g:"Từ để hỏi đứng đúng chỗ của câu trả lời, không đưa lên đầu câu như tiếng Anh: 你吃什么？ → 我吃面. Không thêm 吗.",gr:[{h:"… + 什么 (+ danh từ)",o:"K=什么 (gì)",it:[["S你 V吃 K什么？","nǐ chī shénme?","Bạn ăn gì?"],["S你 V叫 K什么 N名字？","nǐ jiào shénme míngzi?","Bạn tên là gì?"],["S你 V做 K什么 N工作？","nǐ zuò shénme gōngzuò?","Bạn làm nghề gì?"],["S你 V说 K什么？","nǐ shuō shénme?","Bạn nói gì?"],["S你 H想 V买 K什么？","nǐ xiǎng mǎi shénme?","Bạn muốn mua gì?"],["S这 V是 K什么 N意思？","zhè shì shénme yìsi?","Cái này nghĩa là gì?"],["S你 V喜欢 K什么 N颜色？","nǐ xǐhuan shénme yánsè?","Bạn thích màu gì?"],["S你 K什么 N时候 V来？","nǐ shénme shíhou lái?","Khi nào bạn đến?"],["S你 D在 V找 K什么？","nǐ zài zhǎo shénme?","Bạn đang tìm gì?"],["V有 K什么 N事？","yǒu shénme shì?","Có việc gì?"]]},
{h:"谁 làm chủ ngữ hoặc tân ngữ",o:"K=谁 (ai)",it:[["K谁 V是 N老板？","shéi shì lǎobǎn?","Ai là sếp?"],["K谁 V来 M了？","shéi lái le?","Ai đến thế?"],["K谁 V知道？","shéi zhīdào?","Ai biết?"],["K谁 V有 O笔？","shéi yǒu bǐ?","Ai có bút?"],["K谁 H想 V去？","shéi xiǎng qù?","Ai muốn đi?"],["S你 V找 K谁？","nǐ zhǎo shéi?","Bạn tìm ai?"],["S你 V跟 K谁 V去？","nǐ gēn shéi qù?","Bạn đi với ai?"],["S这 V是 K谁的？","zhè shì shéi de?","Cái này của ai?"],["S你 V给 K谁 V打 O电话？","nǐ gěi shéi dǎ diànhuà?","Bạn gọi điện cho ai?"],["K谁 V教 O你们 O中文？","shéi jiāo nǐmen Zhōngwén?","Ai dạy các bạn tiếng Trung?"]]},
{h:"哪 + lượng từ / 哪儿",o:"K=哪 (nào) / 哪儿 (đâu)",it:[["S你 V要 K哪个？","nǐ yào nǎge?","Bạn lấy cái nào?"],["S你 V喜欢 K哪件？","nǐ xǐhuan nǎ jiàn?","Bạn thích cái (áo) nào?"],["S你 K哪天 V有 O空？","nǐ nǎ tiān yǒu kòng?","Hôm nào bạn rảnh?"],["K哪个 A好？","nǎge hǎo?","Cái nào tốt?"],["K哪位 V是 N王经理？","nǎ wèi shì Wáng jīnglǐ?","Vị nào là giám đốc Vương?"],["S你 V去 K哪儿？","nǐ qù nǎr?","Bạn đi đâu?"],["S你 V住 K哪儿？","nǐ zhù nǎr?","Bạn sống ở đâu?"],["S我们 G在 K哪儿 V见？","wǒmen zài nǎr jiàn?","Chúng ta gặp ở đâu?"],["S你 G从 K哪儿 V来？","nǐ cóng nǎr lái?","Bạn từ đâu đến?"],["K哪儿 V有 O卖水的？","nǎr yǒu mài shuǐ de?","Ở đâu có bán nước?"]]}],d:[]},
{t:"Ghép câu hỏi số lượng: 几, 多少, 多 + tính từ",g:"几 hỏi số nhỏ (dưới 10), phải có lượng từ: 几个. 多少 hỏi số bất kỳ, lượng từ có thể bỏ. 多 + tính từ hỏi mức độ: 多大, 多长, 多远.",gr:[{h:"几 + lượng từ",o:"K=几 (mấy)",it:[["S你 V有 K几个 O孩子？","nǐ yǒu jǐ ge háizi?","Bạn có mấy đứa con?"],["T现在 K几点？","xiànzài jǐ diǎn?","Bây giờ mấy giờ?"],["T今天 K几号？","jīntiān jǐ hào?","Hôm nay ngày mấy?"],["S你 V要 K几个？","nǐ yào jǐ ge?","Bạn lấy mấy cái?"],["S你们 K几位？","nǐmen jǐ wèi?","Các vị mấy người?"],["S你 V来 K几天 M了？","nǐ lái jǐ tiān le?","Bạn đến mấy ngày rồi?"],["S你 V住 K几楼？","nǐ zhù jǐ lóu?","Bạn ở tầng mấy?"],["S你 V去 M过 K几次？","nǐ qù guo jǐ cì?","Bạn đi mấy lần rồi?"],["S你 V买 M了 K几本 O书？","nǐ mǎi le jǐ běn shū?","Bạn mua mấy quyển sách?"],["S你 V学 M了 K几年？","nǐ xué le jǐ nián?","Bạn học mấy năm rồi?"]]},
{h:"多少 (+ danh từ)",o:"K=多少 (bao nhiêu)",it:[["S这个 K多少 N钱？","zhège duōshao qián?","Cái này bao nhiêu tiền?"],["D一共 K多少 N钱？","yígòng duōshao qián?","Tổng cộng bao nhiêu tiền?"],["S公司 V有 K多少 N人？","gōngsī yǒu duōshao rén?","Công ty có bao nhiêu người?"],["S你的电话 V是 K多少？","nǐ de diànhuà shì duōshao?","Số điện thoại của bạn là bao nhiêu?"],["T一个月 K多少 N工资？","yí ge yuè duōshao gōngzī?","Một tháng lương bao nhiêu?"],["S你 V要 K多少？","nǐ yào duōshao?","Bạn cần bao nhiêu?"],["S房租 V是 K多少？","fángzū shì duōshao?","Tiền thuê nhà là bao nhiêu?"],["S你 V认识 K多少 N汉字？","nǐ rènshi duōshao Hànzì?","Bạn biết bao nhiêu chữ Hán?"],["V还 V有 K多少？","hái yǒu duōshao?","Còn bao nhiêu nữa?"],["S你 V带 M了 K多少 N钱？","nǐ dài le duōshao qián?","Bạn mang bao nhiêu tiền?"]]},
{h:"多 + tính từ",o:"K=多 + tính từ (bao…)",it:[["S你 K多大 M了？","nǐ duō dà le?","Bạn bao nhiêu tuổi rồi?"],["S你 K多高？","nǐ duō gāo?","Bạn cao bao nhiêu?"],["P这儿 V离 P机场 K多远？","zhèr lí jīchǎng duō yuǎn?","Từ đây đến sân bay bao xa?"],["H要 V等 K多久？","yào děng duō jiǔ?","Phải đợi bao lâu?"],["S这个箱子 K多重？","zhège xiāngzi duō zhòng?","Cái va li này nặng bao nhiêu?"],["S你 V来 P中国 K多久 M了？","nǐ lái Zhōngguó duō jiǔ le?","Bạn đến Trung Quốc bao lâu rồi?"],["S这条路 K多长？","zhè tiáo lù duō cháng?","Con đường này dài bao nhiêu?"],["S房间 K多大？","fángjiān duō dà?","Phòng rộng bao nhiêu?"],["V坐 O车 H要 K多长 N时间？","zuò chē yào duō cháng shíjiān?","Đi xe mất bao lâu?"],["S你 V学 O中文 K多久 M了？","nǐ xué Zhōngwén duō jiǔ le?","Bạn học tiếng Trung bao lâu rồi?"]]}],d:[]},
{t:"Ghép câu hỏi cách thức và lý do: 怎么, 怎么样, 为什么",g:"怎么 + động từ = làm thế nào. 怎么样 đứng cuối = thế nào (hỏi nhận xét, đề nghị). 为什么 = tại sao; trả lời bằng 因为.",gr:[{h:"怎么 + động từ",o:"K=怎么 (thế nào)",it:[["S这个 K怎么 V用？","zhège zěnme yòng?","Cái này dùng thế nào?"],["S这个字 K怎么 V写？","zhège zì zěnme xiě?","Chữ này viết thế nào?"],["S你 K怎么 V去 O公司？","nǐ zěnme qù gōngsī?","Bạn đến công ty bằng gì?"],["S这个菜 K怎么 V做？","zhège cài zěnme zuò?","Món này nấu thế nào?"],["S我 K怎么 V称呼 O您？","wǒ zěnme chēnghu nín?","Tôi xưng hô với ông thế nào?"],["V去 P火车站 K怎么 V走？","qù huǒchēzhàn zěnme zǒu?","Đến ga tàu đi thế nào?"],["S你 K怎么 V知道？","nǐ zěnme zhīdào?","Sao bạn biết?"],["S他 K怎么 Z没 V来？","tā zěnme méi lái?","Sao anh ấy không đến?"],["S你 K怎么 M了？","nǐ zěnme le?","Bạn sao thế?"],["S我们 K怎么 V办？","wǒmen zěnme bàn?","Chúng ta làm thế nào bây giờ?"]]},
{h:"… + 怎么样",o:"K=怎么样 (thế nào)",it:[["S你 N身体 K怎么样？","nǐ shēntǐ zěnmeyàng?","Sức khỏe bạn thế nào?"],["S工作 K怎么样？","gōngzuò zěnmeyàng?","Công việc thế nào?"],["S这件衣服 K怎么样？","zhè jiàn yīfu zěnmeyàng?","Cái áo này thế nào?"],["T明天 N天气 K怎么样？","míngtiān tiānqì zěnmeyàng?","Thời tiết ngày mai thế nào?"],["S那家饭店 K怎么样？","nà jiā fàndiàn zěnmeyàng?","Nhà hàng đó thế nào?"],["S我们 V去 V喝 O咖啡， K怎么样？","wǒmen qù hē kāfēi, zěnmeyàng?","Mình đi uống cà phê, thấy sao?"],["S你 V觉得 K怎么样？","nǐ juéde zěnmeyàng?","Bạn thấy thế nào?"],["S考试 V考 M得 K怎么样？","kǎoshì kǎo de zěnmeyàng?","Thi thế nào?"],["S他 N人 K怎么样？","tā rén zěnmeyàng?","Con người anh ấy thế nào?"],["T周末 V去 V爬山， K怎么样？","zhōumò qù pá shān, zěnmeyàng?","Cuối tuần đi leo núi, thấy sao?"]]},
{h:"为什么 + vị ngữ",o:"K=为什么 (tại sao)",it:[["S你 K为什么 V学 O中文？","nǐ wèishénme xué Zhōngwén?","Tại sao bạn học tiếng Trung?"],["S他 K为什么 Z不 V来？","tā wèishénme bù lái?","Tại sao anh ấy không đến?"],["S你 K为什么 V迟到？","nǐ wèishénme chídào?","Tại sao bạn đến muộn?"],["S你 K为什么 V哭？","nǐ wèishénme kū?","Tại sao bạn khóc?"],["S你 K为什么 Z不 V告诉 O我？","nǐ wèishénme bú gàosu wǒ?","Tại sao bạn không nói với tôi?"],["S这个 K为什么 D这么 A贵？","zhège wèishénme zhème guì?","Sao cái này đắt thế?"],["S你 K为什么 V喜欢 O他？","nǐ wèishénme xǐhuan tā?","Tại sao bạn thích anh ấy?"],["S你 K为什么 Z不 V吃？","nǐ wèishénme bù chī?","Tại sao bạn không ăn?"],["S他 K为什么 V生气？","tā wèishénme shēng qì?","Tại sao anh ấy giận?"],["K为什么 Z不 A行？","wèishénme bù xíng?","Tại sao không được?"]]}],d:[]},
{t:"Ghép câu với trợ từ cuối câu: 呢, 吧, 啊",g:"呢: hỏi ngược lại (你呢？) hoặc \"đang\". 吧: đề nghị, đoán. 啊: cảm thán, làm mềm câu. Cùng một câu, đổi trợ từ là đổi giọng.",gr:[{h:"… + 呢",o:"K=呢 (còn… thì sao; đang)",it:[["S你 K呢？","nǐ ne?","Còn bạn?"],["S我 D很 A好， S你 K呢？","wǒ hěn hǎo, nǐ ne?","Tôi khỏe, còn bạn?"],["S我的手机 K呢？","wǒ de shǒujī ne?","Điện thoại của tôi đâu?"],["S老板 K呢？","lǎobǎn ne?","Sếp đâu rồi?"],["S我 V去， S他 K呢？","wǒ qù, tā ne?","Tôi đi, còn anh ấy?"],["S他 D在 V开会 K呢","tā zài kāi huì ne","Anh ấy đang họp"],["S我 D在 V吃 O饭 K呢","wǒ zài chī fàn ne","Tôi đang ăn cơm"],["S你 V想 Q什么 K呢？","nǐ xiǎng shénme ne?","Bạn đang nghĩ gì thế?"],["S他们 D还 Z没 V来 K呢","tāmen hái méi lái ne","Họ vẫn chưa đến đâu"],["J那 T明天 K呢？","nà míngtiān ne?","Thế còn ngày mai?"]]},
{h:"… + 吧",o:"K=吧 (đề nghị; đoán)",it:[["S我们 V走 K吧","wǒmen zǒu ba","Chúng ta đi thôi"],["S你 V坐 K吧","nǐ zuò ba","Bạn ngồi đi"],["D快 V吃 K吧","kuài chī ba","Mau ăn đi"],["V休息 L一下 K吧","xiūxi yíxià ba","Nghỉ một chút đi"],["S你 V是 N新来的 K吧？","nǐ shì xīn lái de ba?","Bạn mới đến phải không?"],["S他 Z不 H会 V来 K吧","tā bú huì lái ba","Chắc anh ấy không đến đâu"],["A好 K吧","hǎo ba","Thôi được"],["S你 A累 M了 K吧？","nǐ lèi le ba?","Bạn mệt rồi nhỉ?"],["T明天 D再 V说 K吧","míngtiān zài shuō ba","Mai hẵng nói"],["S我们 D一起 V去 K吧","wǒmen yìqǐ qù ba","Chúng ta cùng đi nhé"]]},
{h:"… + 啊 / 啦 / 嘛",o:"K=trợ từ ngữ khí",it:[["A好 K啊","hǎo a","Được chứ"],["V是 K啊","shì a","Đúng thế"],["D真 A漂亮 K啊","zhēn piàoliang a","Đẹp thật đấy"],["S你 V来 K啦","nǐ lái la","Bạn đến rồi à"],["Q谁 K啊？","shéi a?","Ai đấy?"],["D多 A好 K啊","duō hǎo a","Tốt biết bao"],["D太 A好 K啦","tài hǎo la","Tốt quá rồi"],["S你 V说 K啊","nǐ shuō a","Bạn nói đi chứ"],["Z别 V客气 K嘛","bié kèqi ma","Đừng khách sáo mà"],["S我 V知道 K啦","wǒ zhīdào la","Tôi biết rồi mà"]]}],d:[]},
{t:"Ghép câu có thời gian",g:"Từ chỉ thời gian đứng TRƯỚC động từ: ngay sau chủ ngữ hoặc ở đầu câu. Không đặt cuối câu như tiếng Việt: 我明天去 (không nói 我去明天).",gr:[{h:"chủ ngữ + thời gian + động từ",o:"T=thời gian (trước động từ)",it:[["S我 T明天 V去 P北京","wǒ míngtiān qù Běijīng","Ngày mai tôi đi Bắc Kinh"],["S他 T昨天 Z没 V来","tā zuótiān méi lái","Hôm qua anh ấy không đến"],["S我 T早上 V喝 O咖啡","wǒ zǎoshang hē kāfēi","Buổi sáng tôi uống cà phê"],["S我们 T下午 V开会","wǒmen xiàwǔ kāi huì","Buổi chiều chúng tôi họp"],["S她 T晚上 V学 O中文","tā wǎnshang xué Zhōngwén","Buổi tối cô ấy học tiếng Trung"],["S我 T周末 V休息","wǒ zhōumò xiūxi","Cuối tuần tôi nghỉ"],["S我 T八点 V上班","wǒ bā diǎn shàng bān","Tám giờ tôi đi làm"],["S他 T去年 V结婚 M了","tā qùnián jié hūn le","Năm ngoái anh ấy kết hôn"],["S我 T现在 Z没 O空","wǒ xiànzài méi kòng","Bây giờ tôi không rảnh"],["S你 T今天 V忙 M吗？","nǐ jīntiān máng ma?","Hôm nay bạn bận không?"]]},
{h:"thời gian + chủ ngữ + động từ",o:"T=thời gian (đầu câu)",it:[["T今天 S我 V请客","jīntiān wǒ qǐng kè","Hôm nay tôi mời"],["T明天 S我们 V放假","míngtiān wǒmen fàng jià","Ngày mai chúng ta nghỉ"],["T昨天 S我 V加班 M了","zuótiān wǒ jiā bān le","Hôm qua tôi tăng ca"],["T下个月 S我 V回 O国","xià ge yuè wǒ huí guó","Tháng sau tôi về nước"],["T星期天 S你 V做 Q什么？","xīngqītiān nǐ zuò shénme?","Chủ nhật bạn làm gì?"],["T现在 S我 V去 V吃 O饭","xiànzài wǒ qù chī fàn","Bây giờ tôi đi ăn cơm"],["T晚上 S我 V给 O你 V打 O电话","wǎnshang wǒ gěi nǐ dǎ diànhuà","Tối tôi gọi điện cho bạn"],["T以后 S我 H想 V开 O公司","yǐhòu wǒ xiǎng kāi gōngsī","Sau này tôi muốn mở công ty"],["T刚才 S谁 V来 M了？","gāngcái shéi lái le?","Vừa nãy ai đến?"],["T春节 S你 V回家 M吗？","Chūnjié nǐ huí jiā ma?","Tết bạn có về nhà không?"]]},
{h:"thời gian + nơi chốn + động từ",o:"T=thời gian;P=nơi chốn",it:[["S我 T明天 G在 P家 V休息","wǒ míngtiān zài jiā xiūxi","Ngày mai tôi nghỉ ở nhà"],["S我们 T六点 G在 P门口 V见","wǒmen liù diǎn zài ménkǒu jiàn","Sáu giờ chúng ta gặp ở cửa"],["S他 T每天 G在 P公司 V吃 O午饭","tā měi tiān zài gōngsī chī wǔfàn","Ngày nào anh ấy cũng ăn trưa ở công ty"],["S我 T晚上 G在 P家 V看 O电视","wǒ wǎnshang zài jiā kàn diànshì","Buổi tối tôi xem tivi ở nhà"],["S她 T周末 G在 P商场 V买 O东西","tā zhōumò zài shāngchǎng mǎi dōngxi","Cuối tuần cô ấy mua đồ ở trung tâm thương mại"],["S我 T早上 G在 P公园 V跑步","wǒ zǎoshang zài gōngyuán pǎo bù","Buổi sáng tôi chạy bộ ở công viên"],["S我们 T明年 G在 P中国 V工作","wǒmen míngnián zài Zhōngguó gōngzuò","Năm sau chúng tôi làm việc ở Trung Quốc"],["S他 T昨天 G在 P医院 V看病","tā zuótiān zài yīyuàn kàn bìng","Hôm qua anh ấy khám bệnh ở bệnh viện"],["S我 T下班以后 G在 P食堂 V吃 O饭","wǒ xià bān yǐhòu zài shítáng chī fàn","Tan làm tôi ăn cơm ở nhà ăn"],["S你 T晚上 G在 Q哪儿 V吃 O饭？","nǐ wǎnshang zài nǎr chī fàn?","Buổi tối bạn ăn cơm ở đâu?"]]}],d:[]},
{t:"Ghép câu với 会, 能, 可以",g:"会 = biết (do học), hoặc \"sẽ\". 能 = có thể (đủ sức, đủ điều kiện). 可以 = được phép. Phủ định: 不会, 不能; cấm thì dùng 不可以 / 不能.",gr:[{h:"chủ ngữ + 会 + động từ",o:"K=会 (biết; sẽ)",it:[["S我 K会 V说 O中文","wǒ huì shuō Zhōngwén","Tôi biết nói tiếng Trung"],["S他 K会 V开车","tā huì kāi chē","Anh ấy biết lái xe"],["S我 Z不 K会 V游泳","wǒ bú huì yóu yǒng","Tôi không biết bơi"],["S她 K会 V做 O中国菜","tā huì zuò Zhōngguó cài","Cô ấy biết nấu món Trung"],["S你 K会 V用 O电脑 M吗？","nǐ huì yòng diànnǎo ma?","Bạn biết dùng máy tính không?"],["S我 K会 L一点儿 O英语","wǒ huì yìdiǎnr Yīngyǔ","Tôi biết một chút tiếng Anh"],["T明天 K会 V下雨","míngtiān huì xià yǔ","Ngày mai sẽ mưa"],["S他 Z不 K会 V来 M的","tā bú huì lái de","Anh ấy sẽ không đến đâu"],["S我 K会 V想 O你 M的","wǒ huì xiǎng nǐ de","Tôi sẽ nhớ bạn"],["S你 K会不会 V唱歌？","nǐ huì bu huì chàng gē?","Bạn có biết hát không?"]]},
{h:"chủ ngữ + 能 + động từ",o:"K=能 (có thể)",it:[["S我 K能 V帮 O你","wǒ néng bāng nǐ","Tôi có thể giúp bạn"],["S你 K能 V来 M吗？","nǐ néng lái ma?","Bạn đến được không?"],["S我 T今天 Z不 K能 V去","wǒ jīntiān bù néng qù","Hôm nay tôi không đi được"],["S他 K能 V吃 O辣","tā néng chī là","Anh ấy ăn được cay"],["S我 K能 V听懂","wǒ néng tīng dǒng","Tôi nghe hiểu được"],["S你 K能 V等 O我 M吗？","nǐ néng děng wǒ ma?","Bạn đợi tôi được không?"],["P这儿 Z不 K能 V停车","zhèr bù néng tíng chē","Ở đây không được đỗ xe"],["S我 Z不 K能 V喝 O酒","wǒ bù néng hē jiǔ","Tôi không uống rượu được"],["S你 K能不能 V说 C慢一点儿？","nǐ néng bu néng shuō màn yìdiǎnr?","Bạn nói chậm chút được không?"],["S我 K能 V看看 M吗？","wǒ néng kànkan ma?","Tôi xem một chút được không?"]]},

{t:"Ghép câu nhượng bộ: 就算 / 即使…也…",g:"就算 (khẩu ngữ) / 即使 (trang trọng) A，也 B = cho dù A thì vẫn B. A là giả thiết chưa chắc xảy ra. Khác 虽然 (A là sự thật).",gr:[{h:"就算…也…",o:"K=就算…也… (cho dù… vẫn…)",it:[["K就算 V下雨 S我 K也 V去","jiùsuàn xià yǔ wǒ yě qù","Cho dù mưa tôi vẫn đi"],["K就算 D很 A贵 S我 K也 V买","jiùsuàn hěn guì wǒ yě mǎi","Cho dù rất đắt tôi vẫn mua"],["K就算 S你 Z不 V说 S我 K也 V知道","jiùsuàn nǐ bù shuō wǒ yě zhīdào","Cho dù bạn không nói tôi vẫn biết"],["K就算 D很 A累 K也 H要 V坚持","jiùsuàn hěn lèi yě yào jiānchí","Cho dù rất mệt vẫn phải kiên trì"],["K就算 S他 V来 K也 Z没 O用","jiùsuàn tā lái yě méi yòng","Cho dù anh ấy đến cũng vô ích"],["K就算 Z没 O钱 K也 H要 V吃 O饭","jiùsuàn méi qián yě yào chī fàn","Cho dù không có tiền vẫn phải ăn"],["K就算 V失败 K也 Z没 O关系","jiùsuàn shībài yě méi guānxi","Cho dù thất bại cũng không sao"],["K就算 S你 V生气 S我 K也 H要 V说","jiùsuàn nǐ shēng qì wǒ yě yào shuō","Cho dù bạn giận tôi vẫn phải nói"],["K就算 A晚 L一点儿 K也 H要 V来","jiùsuàn wǎn yìdiǎnr yě yào lái","Cho dù muộn một chút vẫn phải đến"],["K就算 V是 N老板 K也 Z不 H能 V这样","jiùsuàn shì lǎobǎn yě bù néng zhèyàng","Cho dù là sếp cũng không được như thế"]]},
{h:"即使…也…",o:"K=即使…也… (dù cho… vẫn…)",it:[["K即使 A忙 K也 H要 V休息","jíshǐ máng yě yào xiūxi","Dù bận vẫn phải nghỉ ngơi"],["K即使 V失败 M了 K也 Z别 V放弃","jíshǐ shībài le yě bié fàngqì","Dù thất bại cũng đừng bỏ cuộc"],["K即使 S他 Z不 V同意 S我 K也 H要 V去","jíshǐ tā bù tóngyì wǒ yě yào qù","Dù anh ấy không đồng ý tôi vẫn đi"],["K即使 Z没 O人 V帮 S我 K也 H能 V做 C完","jíshǐ méi rén bāng wǒ yě néng zuò wán","Dù không ai giúp tôi vẫn làm xong được"],["K即使 V下雪 S火车 K也 V开","jíshǐ xià xuě huǒchē yě kāi","Dù tuyết rơi tàu vẫn chạy"],["K即使 D很 A难 K也 H要 V试试","jíshǐ hěn nán yě yào shìshi","Dù rất khó vẫn phải thử"],["K即使 S你 V道歉 S他 K也 Z不 H会 V原谅","jíshǐ nǐ dào qiàn tā yě bú huì yuánliàng","Dù bạn xin lỗi anh ấy cũng không tha thứ"],["K即使 A便宜 S我 K也 Z不 V买","jíshǐ piányi wǒ yě bù mǎi","Dù rẻ tôi cũng không mua"],["K即使 V生病 S他 K也 V来 V上班","jíshǐ shēng bìng tā yě lái shàng bān","Dù ốm anh ấy vẫn đến làm"],["K即使 A远 K也 H要 V回家 V过年","jíshǐ yuǎn yě yào huí jiā guò nián","Dù xa vẫn phải về nhà ăn Tết"]]},
{h:"再…也… (dù… đến mấy cũng)",o:"K=再…也… (dù… mấy cũng…)",it:[["K再 A忙 K也 H要 V吃 O饭","zài máng yě yào chī fàn","Bận mấy cũng phải ăn cơm"],["K再 A贵 K也 H要 V买","zài guì yě yào mǎi","Đắt mấy cũng phải mua"],["K再 A难 K也 Z不 V怕","zài nán yě bú pà","Khó mấy cũng không sợ"],["K再 A累 K也 Z不 V说","zài lèi yě bù shuō","Mệt mấy cũng không nói"],["K再 A晚 K也 V回家","zài wǎn yě huí jiā","Muộn mấy cũng về nhà"],["K再 V等 K也 Z没 O用","zài děng yě méi yòng","Đợi nữa cũng vô ích"],["K再 V说 K也 Z没 O用","zài shuō yě méi yòng","Nói nữa cũng vô ích"],["K再 A好 K也 Z不 V要","zài hǎo yě bú yào","Tốt mấy cũng không lấy"],["K再 A冷 K也 V去 V跑步","zài lěng yě qù pǎo bù","Lạnh mấy cũng đi chạy bộ"],["K再 A苦 K也 H要 V坚持","zài kǔ yě yào jiānchí","Khổ mấy cũng phải kiên trì"]]}],d:[]},
{t:"Ghép câu chỉ mục đích: 为了, 为, 是为了",g:"为了 + mục đích，+ hành động = để… thì…. Mục đích đứng TRƯỚC. Hành động + 是为了 + mục đích = làm… là để…. 为 + người = vì, cho ai.",gr:[{h:"为了 + mục đích，…",o:"K=为了 (để, vì)",it:[["K为了 V学 O中文， S我 V来 M了 P中国","wèile xué Zhōngwén, wǒ lái le Zhōngguó","Để học tiếng Trung, tôi đã sang Trung Quốc"],["K为了 O孩子， S她 Z不 V工作 M了","wèile háizi, tā bù gōngzuò le","Vì con, cô ấy không đi làm nữa"],["K为了 V赚 O钱， S他 T每天 V加班","wèile zhuàn qián, tā měi tiān jiā bān","Để kiếm tiền, ngày nào anh ấy cũng tăng ca"],["K为了 O健康， S我 Z不 V抽烟 M了","wèile jiànkāng, wǒ bù chōu yān le","Vì sức khỏe, tôi không hút thuốc nữa"],["K为了 V减肥， S她 Z不 V吃 O晚饭","wèile jiǎn féi, tā bù chī wǎnfàn","Để giảm cân, cô ấy không ăn tối"],["K为了 Z不 V迟到， S我 V早 V起","wèile bù chídào, wǒ zǎo qǐ","Để không đến muộn, tôi dậy sớm"],["K为了 V买 O房， S他们 D很 V省 O钱","wèile mǎi fáng, tāmen hěn shěng qián","Để mua nhà, họ rất tiết kiệm"],["K为了 V见 O你， S我 V等 M了 L两个小时","wèile jiàn nǐ, wǒ děng le liǎng ge xiǎoshí","Để gặp bạn, tôi đã đợi hai tiếng"],["K为了 O家人， S我 H要 V努力","wèile jiārén, wǒ yào nǔlì","Vì gia đình, tôi phải cố gắng"],["K为了 O安全， D请 V戴 O帽子","wèile ānquán, qǐng dài màozi","Vì an toàn, xin đội mũ"]]},
{h:"… 是为了 + mục đích",o:"K=是为了 (là để)",it:[["S我 V学 O中文 K是为了 V工作","wǒ xué Zhōngwén shì wèile gōngzuò","Tôi học tiếng Trung là để làm việc"],["S他 V来 K是为了 V见 O你","tā lái shì wèile jiàn nǐ","Anh ấy đến là để gặp bạn"],["S我 V这么 V做 K是为了 O你 A好","wǒ zhème zuò shì wèile nǐ hǎo","Tôi làm thế là vì muốn tốt cho bạn"],["S我 V努力 K是为了 O家人","wǒ nǔlì shì wèile jiārén","Tôi cố gắng là vì gia đình"],["S她 V存 O钱 K是为了 V买 O车","tā cún qián shì wèile mǎi chē","Cô ấy để dành tiền là để mua xe"],["S我 V运动 K是为了 O健康","wǒ yùndòng shì wèile jiànkāng","Tôi tập thể thao là vì sức khỏe"],["S我 V早 V来 K是为了 V帮 O你","wǒ zǎo lái shì wèile bāng nǐ","Tôi đến sớm là để giúp bạn"],["S他 V加班 K是为了 A多 V赚 O钱","tā jiā bān shì wèile duō zhuàn qián","Anh ấy tăng ca là để kiếm thêm tiền"],["S我 V问 K是为了 V了解 O情况","wǒ wèn shì wèile liǎojiě qíngkuàng","Tôi hỏi là để nắm tình hình"],["S我们 V开会 K是为了 V解决 O问题","wǒmen kāi huì shì wèile jiějué wèntí","Chúng ta họp là để giải quyết vấn đề"]]},
{h:"为 + người + … (vì, cho ai)",o:"K=为 (vì, cho)",it:[["S我 K为 O你 V高兴","wǒ wèi nǐ gāoxìng","Tôi mừng cho bạn"],["S妈妈 K为 O我 V担心","māma wèi wǒ dānxīn","Mẹ lo cho tôi"],["S我 K为 O大家 V唱 L一个 O歌","wǒ wèi dàjiā chàng yí ge gē","Tôi hát tặng mọi người một bài"],["S他 K为 O公司 V工作 M了 L十年","tā wèi gōngsī gōngzuò le shí nián","Anh ấy làm cho công ty mười năm"],["S我们 K为 O你 V准备 M了 O礼物","wǒmen wèi nǐ zhǔnbèi le lǐwù","Chúng tôi chuẩn bị quà cho bạn"],["S我 K为 O这件事 V道歉","wǒ wèi zhè jiàn shì dào qiàn","Tôi xin lỗi vì việc này"],["K为 O我们的友谊 V干杯","wèi wǒmen de yǒuyì gān bēi","Cạn ly vì tình bạn của chúng ta"],["S你 K为 Q什么 V生气？","nǐ wèi shénme shēng qì?","Bạn giận vì cái gì?"],["S我 K为 O他 V买 M了 L一件 O衣服","wǒ wèi tā mǎi le yí jiàn yīfu","Tôi mua cho anh ấy một cái áo"],["Z别 K为 O我 V担心","bié wèi wǒ dānxīn","Đừng lo cho tôi"]]}],d:[]},
{t:"Ghép câu với 才 và 就",g:"Cùng một sự việc: 就 = sớm, nhanh, dễ (ngay, đã); 才 = muộn, chậm, khó (mới). Câu có 才 thường KHÔNG có 了 ở cuối.",gr:[{h:"thời điểm + 就 + động từ + 了 (sớm, nhanh)",o:"K=就 (đã, ngay)",it:[["S我 T六点 K就 V起床 M了","wǒ liù diǎn jiù qǐchuáng le","Sáu giờ tôi đã dậy rồi"],["S他 T昨天 K就 V到 M了","tā zuótiān jiù dào le","Hôm qua anh ấy đã đến rồi"],["S我 L十分钟 K就 V做 C完 M了","wǒ shí fēnzhōng jiù zuò wán le","Mười phút là tôi làm xong rồi"],["S她 L二十岁 K就 V结婚 M了","tā èrshí suì jiù jié hūn le","Hai mươi tuổi cô ấy đã kết hôn"],["S我 T马上 K就 V来","wǒ mǎshàng jiù lái","Tôi đến ngay đây"],["S他 V吃 C完 O饭 K就 V走 M了","tā chī wán fàn jiù zǒu le","Ăn xong là anh ấy đi luôn"],["V走 L五分钟 K就 V到","zǒu wǔ fēnzhōng jiù dào","Đi năm phút là đến"],["S我 L一会儿 K就 V回来","wǒ yíhuìr jiù huílai","Lát nữa tôi về ngay"],["S票 L一天 K就 V卖 C完 M了","piào yì tiān jiù mài wán le","Vé một ngày đã bán hết"],["S你 Q怎么 T现在 K就 V走？","nǐ zěnme xiànzài jiù zǒu?","Sao bạn đi sớm thế?"]]},
{h:"thời điểm + 才 + động từ (muộn, chậm)",o:"K=才 (mới)",it:[["S我 T十点 K才 V起床","wǒ shí diǎn cái qǐchuáng","Mười giờ tôi mới dậy"],["S他 T昨天 K才 V到","tā zuótiān cái dào","Hôm qua anh ấy mới đến"],["S我 L两个小时 K才 V做 C完","wǒ liǎng ge xiǎoshí cái zuò wán","Hai tiếng tôi mới làm xong"],["S她 L四十岁 K才 V结婚","tā sìshí suì cái jié hūn","Bốn mươi tuổi cô ấy mới kết hôn"],["S你 Q怎么 T现在 K才 V来？","nǐ zěnme xiànzài cái lái?","Sao giờ bạn mới đến?"],["S我 T昨天 K才 V知道","wǒ zuótiān cái zhīdào","Hôm qua tôi mới biết"],["S他 T晚上 T十二点 K才 V睡","tā wǎnshang shí'èr diǎn cái shuì","Mười hai giờ đêm anh ấy mới ngủ"],["S我 V等 M了 L半天 S他 K才 V来","wǒ děng le bàntiān tā cái lái","Tôi đợi nửa ngày anh ấy mới đến"],["S电影 T八点 K才 V开始","diànyǐng bā diǎn cái kāishǐ","Tám giờ phim mới bắt đầu"],["S我 V看 M了 L三遍 K才 V懂","wǒ kàn le sān biàn cái dǒng","Tôi xem ba lần mới hiểu"]]},

{t:"Ghép câu với 再, 又, 还 (lặp lại)",g:"再 = lại (việc CHƯA xảy ra, tương lai). 又 = lại (việc ĐÃ xảy ra, thường kèm 了, hay mang ý chê). 还 = còn, vẫn (kéo dài, thêm nữa).",gr:[{h:"再 + động từ (sẽ làm lại)",o:"K=再 (lại, nữa)",it:[["D请 K再 V说 L一遍","qǐng zài shuō yí biàn","Xin nói lại một lần nữa"],["S我 T明天 K再 V来","wǒ míngtiān zài lái","Mai tôi lại đến"],["K再 V来 L一个","zài lái yí ge","Cho thêm một cái nữa"],["S你 K再 V想想","nǐ zài xiǎngxiang","Bạn nghĩ lại xem"],["S我们 K再 V等 L十分钟","wǒmen zài děng shí fēnzhōng","Chúng ta đợi thêm mười phút"],["K再 V吃 L一点儿","zài chī yìdiǎnr","Ăn thêm chút nữa"],["S我 T以后 K再 V告诉 O你","wǒ yǐhòu zài gàosu nǐ","Sau này tôi sẽ nói với bạn"],["K再 V试 L一次","zài shì yí cì","Thử lại lần nữa"],["S我 Z不 H想 K再 V见 O他","wǒ bù xiǎng zài jiàn tā","Tôi không muốn gặp lại anh ấy"],["V欢迎 K再 V来","huānyíng zài lái","Hoan nghênh lần sau lại đến"]]},

{t:"Ghép câu so sánh bằng và kém: 跟…一样, 没有…那么",g:"A 跟 B 一样 (+ tính từ) = A giống B, bằng B. A 没有 B (那么) + tính từ = A không… bằng B. 不一样 = khác nhau.",gr:[{h:"A + 跟 + B + 一样 (+ tính từ)",o:"K=跟…一样 (giống, bằng)",it:[["S我 K跟 O你 K一样","wǒ gēn nǐ yíyàng","Tôi giống bạn"],["S他 K跟 O我 K一样 A高","tā gēn wǒ yíyàng gāo","Anh ấy cao bằng tôi"],["S这个 K跟 O那个 K一样 A贵","zhège gēn nàge yíyàng guì","Cái này đắt bằng cái kia"],["S今天 K跟 O昨天 K一样 A热","jīntiān gēn zuótiān yíyàng rè","Hôm nay nóng như hôm qua"],["S我的手机 K跟 O你的 K一样","wǒ de shǒujī gēn nǐ de yíyàng","Điện thoại tôi giống của bạn"],["S她 K跟 O妈妈 K一样 A漂亮","tā gēn māma yíyàng piàoliang","Cô ấy đẹp như mẹ"],["S我 K跟 O他 K一样 A大","wǒ gēn tā yíyàng dà","Tôi bằng tuổi anh ấy"],["S我 K跟 O你 K一样 V喜欢 O咖啡","wǒ gēn nǐ yíyàng xǐhuan kāfēi","Tôi thích cà phê giống bạn"],["S这儿 K跟 O我老家 K一样","zhèr gēn wǒ lǎojiā yíyàng","Ở đây giống quê tôi"],["S我的想法 K跟 O你 K一样","wǒ de xiǎngfǎ gēn nǐ yíyàng","Suy nghĩ của tôi giống bạn"]]},

{t:"Ghép câu so sánh hơn nâng cao với 比, 更, 最",g:"A 比 B + tính từ + mức chênh (一点儿 / 得多 / 多了 / số lượng). Không dùng 很 sau 比. 更 = càng, hơn nữa. 最 = nhất.",gr:[{h:"A + 比 + B + tính từ + mức chênh",o:"K=比 (hơn);C=mức chênh",it:[["S他 K比 O我 A高 C一点儿","tā bǐ wǒ gāo yìdiǎnr","Anh ấy cao hơn tôi một chút"],["S今天 K比 O昨天 A热 C得多","jīntiān bǐ zuótiān rè de duō","Hôm nay nóng hơn hôm qua nhiều"],["S这个 K比 O那个 A贵 C十块","zhège bǐ nàge guì shí kuài","Cái này đắt hơn cái kia mười tệ"],["S我 K比 O他 A大 C三岁","wǒ bǐ tā dà sān suì","Tôi lớn hơn anh ấy ba tuổi"],["S地铁 K比 O公交车 A快 C多了","dìtiě bǐ gōngjiāochē kuài duō le","Tàu điện ngầm nhanh hơn xe buýt nhiều"],["S她 K比 O我 V来 M得 A早","tā bǐ wǒ lái de zǎo","Cô ấy đến sớm hơn tôi"],["S我 K比 O你 A多 V吃 M了 C一碗","wǒ bǐ nǐ duō chī le yì wǎn","Tôi ăn nhiều hơn bạn một bát"],["S这件 K比 O那件 A便宜 C一半","zhè jiàn bǐ nà jiàn piányi yíbàn","Cái này rẻ hơn cái kia một nửa"],["S他 K比 T以前 A胖 C多了","tā bǐ yǐqián pàng duō le","Anh ấy béo hơn trước nhiều"],["S我的房间 K比 O你的 A小 C一点儿","wǒ de fángjiān bǐ nǐ de xiǎo yìdiǎnr","Phòng tôi nhỏ hơn phòng bạn một chút"]]},

{t:"Ghép câu tồn tại, xuất hiện",g:"Nơi chốn đứng đầu câu: nơi + 有 / động từ + 着 + vật = ở đâu có / đang có gì. Nơi + 来了 / 走了 + người = ở đâu xuất hiện / mất đi ai.",gr:[{h:"nơi + động từ + 着 + vật",o:"P=nơi chốn;K=着 (trạng thái đang có)",it:[["P桌子上 V放 K着 L一杯 O茶","zhuōzi shang fàng zhe yì bēi chá","Trên bàn đặt một cốc trà"],["P墙上 V挂 K着 L一张 O画","qiáng shang guà zhe yì zhāng huà","Trên tường treo một bức tranh"],["P门口 V站 K着 L一个 O人","ménkǒu zhàn zhe yí ge rén","Ở cửa có một người đứng"],["P床上 V躺 K着 L一只 O猫","chuáng shang tǎng zhe yì zhī māo","Trên giường có một con mèo nằm"],["P黑板上 V写 K着 Q什么？","hēibǎn shang xiě zhe shénme?","Trên bảng viết gì thế?"],["P门上 V贴 K着 L一张 O纸","mén shang tiē zhe yì zhāng zhǐ","Trên cửa dán một tờ giấy"],["P楼下 V停 K着 A很多 O车","lóu xià tíng zhe hěn duō chē","Dưới nhà đỗ rất nhiều xe"],["P教室里 V坐 K着 A很多 O学生","jiàoshì li zuò zhe hěn duō xuésheng","Trong lớp có rất nhiều học sinh ngồi"],["P包里 V装 K着 Q什么？","bāo li zhuāng zhe shénme?","Trong túi đựng gì thế?"],["P窗户 V开 K着","chuānghu kāi zhe","Cửa sổ đang mở"]]},

{t:"Ghép câu bị động: 被, 叫, 让",g:"Vật / người chịu tác động + 被 (+ người gây ra) + động từ + kết quả. Khẩu ngữ dùng 叫 / 让 thay 被 (phải nêu người gây ra). Thường là việc không may.",gr:[{h:"被 + (người) + động từ + kết quả",o:"K=被 (bị, được)",it:[["S我的手机 K被 V偷 M了","wǒ de shǒujī bèi tōu le","Điện thoại của tôi bị trộm rồi"],["S他 K被 O老板 V骂 M了","tā bèi lǎobǎn mà le","Anh ấy bị sếp mắng"],["S我 K被 O狗 V咬 M了","wǒ bèi gǒu yǎo le","Tôi bị chó cắn"],["S自行车 K被 O朋友 V借 C走 M了","zìxíngchē bèi péngyou jiè zǒu le","Xe đạp bị bạn mượn đi rồi"],["S蛋糕 K被 O孩子 V吃 C光 M了","dàngāo bèi háizi chī guāng le","Bánh bị bọn trẻ ăn hết sạch"],["S我 K被 O他 V骗 M了","wǒ bèi tā piàn le","Tôi bị anh ấy lừa"],["S窗户 K被 O风 V吹 C开 M了","chuānghu bèi fēng chuī kāi le","Cửa sổ bị gió thổi bật ra"],["S他 K被 O公司 V开除 M了","tā bèi gōngsī kāichú le","Anh ấy bị công ty đuổi việc"],["S我 K被 O大家 V选 C上 M了","wǒ bèi dàjiā xuǎn shàng le","Tôi được mọi người bầu chọn"],["S秘密 K被 V发现 M了","mìmì bèi fāxiàn le","Bí mật bị phát hiện rồi"]]},

{t:"Ghép câu cầu khiến lịch sự",g:"请 + động từ = xin mời. Động từ + 一下 = làm chút (nhẹ nhàng). …吧 = đề nghị. 别 / 不要…了 = đừng… nữa. 麻烦你 + động từ = phiền bạn.",gr:[{h:"请 + động từ",o:"K=请 (xin, mời)",it:[["K请 V坐","qǐng zuò","Mời ngồi"],["K请 V喝 O茶","qǐng hē chá","Mời uống trà"],["K请 V等 L一下","qǐng děng yíxià","Xin đợi một chút"],["K请 V跟 O我 V来","qǐng gēn wǒ lái","Xin đi theo tôi"],["K请 V安静","qǐng ānjìng","Xin giữ yên lặng"],["K请 V问， S您 V找 Q谁？","qǐng wèn, nín zhǎo shéi?","Xin hỏi, ông tìm ai?"],["K请 V看 P这儿","qǐng kàn zhèr","Xin nhìn vào đây"],["K请 V慢 V用","qǐng màn yòng","Mời dùng thong thả"],["K请 V帮 O我 V拿 L一下","qǐng bāng wǒ ná yíxià","Xin cầm giúp tôi một chút"],["K请 V把 O门 V关 C上","qǐng bǎ mén guānshang","Xin đóng cửa lại"]]},

{t:"Ghép câu hỏi phản vấn và nhấn mạnh",g:"Hỏi không để hỏi mà để khẳng định: 不是…吗 = chẳng phải… sao. 难道…吗 = lẽ nào. 怎么能 / 哪儿有 = làm sao mà / làm gì có. Giọng trách, ngạc nhiên.",gr:[{h:"不是…吗？",o:"K=不是…吗 (chẳng phải… sao)",it:[["S你 K不是 V说 Z不 V来 K吗？","nǐ bú shì shuō bù lái ma?","Chẳng phải bạn nói không đến sao?"],["S他 K不是 V是 N你朋友 K吗？","tā bú shì shì nǐ péngyou ma?","Chẳng phải anh ấy là bạn của bạn sao?"],["S你 K不是 V去 M过 K吗？","nǐ bú shì qù guo ma?","Chẳng phải bạn đi rồi sao?"],["S我 K不是 V告诉 O你 M了 K吗？","wǒ bú shì gàosu nǐ le ma?","Chẳng phải tôi nói với bạn rồi sao?"],["S今天 K不是 V是 N星期天 K吗？","jīntiān bú shì shì xīngqītiān ma?","Chẳng phải hôm nay là chủ nhật sao?"],["S你 K不是 V喜欢 V吃 O辣 K吗？","nǐ bú shì xǐhuan chī là ma?","Chẳng phải bạn thích ăn cay sao?"],["S你 K不是 V有 O车 K吗？","nǐ bú shì yǒu chē ma?","Chẳng phải bạn có xe sao?"],["S我们 K不是 V说 C好 M了 K吗？","wǒmen bú shì shuō hǎo le ma?","Chẳng phải mình thống nhất rồi sao?"],["S这 K不是 N你的 K吗？","zhè bú shì nǐ de ma?","Cái này chẳng phải của bạn sao?"],["S你 K不是 H会 V说 O中文 K吗？","nǐ bú shì huì shuō Zhōngwén ma?","Chẳng phải bạn biết nói tiếng Trung sao?"]]},
{h:"难道…吗？",o:"K=难道…吗 (lẽ nào)",it:[["K难道 S你 Z不 V知道 K吗？","nándào nǐ bù zhīdào ma?","Lẽ nào bạn không biết?"],["K难道 S他 Z不 V来 M了 K吗？","nándào tā bù lái le ma?","Lẽ nào anh ấy không đến nữa?"],["K难道 S你 V忘 M了 K吗？","nándào nǐ wàng le ma?","Lẽ nào bạn quên rồi?"],["K难道 S我 V说 C错 M了 K吗？","nándào wǒ shuō cuò le ma?","Lẽ nào tôi nói sai?"],["K难道 S你 Z不 V相信 O我 K吗？","nándào nǐ bù xiāngxìn wǒ ma?","Lẽ nào bạn không tin tôi?"],["K难道 Z没有 O别的办法 K吗？","nándào méiyǒu bié de bànfǎ ma?","Lẽ nào không còn cách khác?"],["K难道 S这 V是 A真的 K吗？","nándào zhè shì zhēn de ma?","Lẽ nào đây là thật?"],["K难道 S你 Z不 A累 K吗？","nándào nǐ bú lèi ma?","Lẽ nào bạn không mệt?"],["K难道 S他 Z不 H想 V回家 K吗？","nándào tā bù xiǎng huí jiā ma?","Lẽ nào anh ấy không muốn về nhà?"],["K难道 S我 Z不 H能 V去 K吗？","nándào wǒ bù néng qù ma?","Lẽ nào tôi không được đi?"]]},
{h:"怎么能 / 哪儿有 / 谁知道",o:"K=từ hỏi phản vấn",it:[["S你 K怎么能 V这么 V说？","nǐ zěnme néng zhème shuō?","Sao bạn có thể nói thế?"],["S我 K怎么能 Z不 V去？","wǒ zěnme néng bú qù?","Sao tôi có thể không đi?"],["S你 K怎么能 V忘 M了 N呢？","nǐ zěnme néng wàng le ne?","Sao bạn có thể quên được?"],["S我 K怎么 H会 Z不 V知道？","wǒ zěnme huì bù zhīdào?","Sao tôi lại không biết được?"],["S我 K哪儿有 O时间？","wǒ nǎr yǒu shíjiān?","Tôi làm gì có thời gian?"],["S我 K哪儿有 O钱？","wǒ nǎr yǒu qián?","Tôi làm gì có tiền?"],["K哪儿有 D这么 A便宜的？","nǎr yǒu zhème piányi de?","Làm gì có cái rẻ thế?"],["K谁知道 N呢？","shéi zhīdào ne?","Ai mà biết được?"],["K谁 Z不 H想 V赚 O钱？","shéi bù xiǎng zhuàn qián?","Ai mà chẳng muốn kiếm tiền?"],["S这 K有什么 A难的？","zhè yǒu shénme nán de?","Cái này có gì khó đâu?"]]}],d:[]},

 const c=m[1];out.push([m[2],c+":"+(o[c]!==undefined?o[c]:c==="K"?m[2]:(LBL[c]||""))]);if(m[3])out.push([m[3],"X:"])});return out}
