<style>
:root{--bg:#f5f1e8;--bg2:#efe8da;--fg:#1f1c18;--card:#fffdf8;--mut:#786f62;--acc:#b3261e;--acc2:#8f1c16;--gold:#a8842f;--ink:#211d19;--ok:#2e7d55;--bad:#b3261e;--line:#e6dccb;
 --t1:#1f6fd1;--t2:#2e8b57;--t3:#8e44ad;--t4:#c0392b;--t5:#b9770e;--disp:"Playfair Display",Georgia,"Times New Roman",serif;--sh:0 1px 2px rgba(40,25,5,.05),0 18px 40px -28px rgba(60,40,10,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141211;--bg2:#1a1816;--fg:#efe9df;--card:#1f1c1a;--mut:#a59c8e;--acc:#e2675a;--acc2:#c9503f;--gold:#d3b468;--ink:#0d0c0b;--ok:#55c088;--bad:#e2675a;--line:#35302a;
 --t1:#6aa8ff;--t2:#4fbf80;--t3:#c28cf0;--t4:#ff7b6b;--t5:#f0b45a;--sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -28px rgba(0,0,0,.9);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141211;--bg2:#1a1816;--fg:#efe9df;--card:#1f1c1a;--mut:#a59c8e;--acc:#e2675a;--acc2:#c9503f;--gold:#d3b468;--ink:#0d0c0b;--ok:#55c088;--bad:#e2675a;--line:#35302a;
 --t1:#6aa8ff;--t2:#4fbf80;--t3:#c28cf0;--t4:#ff7b6b;--t5:#f0b45a;--sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -28px rgba(0,0,0,.9);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang SC","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h2,h3{margin:0}
/* Thanh trên cùng */
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#f4ecdc;border-bottom:1px solid var(--gold)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{border-radius:10px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.brand b{display:block;font:700 21px/1.15 var(--disp);letter-spacing:.2px}
.brand small{display:block;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.top nav{display:flex;gap:8px;flex-wrap:wrap}
.top nav button{background:transparent;color:#f4ecdc;border-color:rgba(255,255,255,.2);padding:8px 16px;font-size:14.5px}
.top nav button:hover{border-color:var(--gold);color:#fff;background:rgba(255,255,255,.06)}
/* Khung 2 cột */
.shell{max-width:1280px;margin:0 auto;padding:28px 32px 56px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:86px;max-height:calc(100vh - 104px);overflow:auto;display:grid;gap:18px;padding-right:4px;scrollbar-width:thin}
main{min-width:0;max-width:880px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--sh)}
.panel h2{font:700 13px/1 inherit;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
/* Ảnh chào */
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--bg2));box-shadow:var(--sh);min-height:128px}
.hero svg{display:block;width:100%;height:128px}
.hero-t{position:absolute;left:20px;top:18px}
.hero-t small{display:block;color:var(--mut);font-size:13.5px;letter-spacing:.4px}
.hero-t b{font:700 30px/1.5 var(--han,"PingFang SC",sans-serif);letter-spacing:1px}
/* Chỉ số hôm nay */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:700 22px/1.2 var(--disp);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:4px;transition:width .4s}
/* Lộ trình */
#lessonSel{display:none;width:100%}
#lessonList{max-height:max(260px,calc(100vh - 600px));overflow:auto;scrollbar-width:thin;margin:0 -6px;padding:0 6px}
.stage{border-top:1px solid var(--line)}
.stage:first-child{border-top:0}
.stage summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:11px 2px;font-weight:600;font-size:14.5px}
.stage summary::-webkit-details-marker{display:none}
.stage summary em{font-style:normal;font-size:18px;width:24px;text-align:center}
.stage summary span{flex:1}
.stage summary i{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.stage[open] summary{color:var(--acc)}
.li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;padding:8px 8px;font-size:14px;line-height:1.45;color:var(--fg)}
.li:hover{background:var(--bg)}
.li .n{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:2px}
.li .k{font-size:12px;color:var(--ok)}
.li.on{background:color-mix(in srgb,var(--acc) 10%,var(--card));color:var(--acc);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.li.on .n{color:var(--acc)}
.li rt{font-size:10px}
/* Đầu bài */
.lhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lhead small{display:block;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.lhead h2{font:700 32px/1.25 var(--disp);letter-spacing:.2px}
.lhead h2 rt{font:400 12px/1 -apple-system,"Segoe UI",sans-serif}
.chip{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--mut);white-space:nowrap}
/* Nút */
select,button,input[type=text]{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:10px 20px;cursor:pointer;max-width:100%;transition:border-color .15s,background .15s,transform .05s}
select{border-radius:12px;padding:10px 12px}
button:hover:not(:disabled){border-color:var(--acc)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:linear-gradient(180deg,var(--acc),var(--acc2));color:#fff;border-color:var(--acc2);font-weight:600;box-shadow:0 8px 18px -12px var(--acc)}
button.ok{border-color:var(--ok);color:var(--ok)}button.bad{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
/* Các bước */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:22px 0 14px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px 10px;text-align:center;cursor:pointer;color:var(--mut);font-size:12.5px;line-height:1.35;transition:border-color .15s}
.tab:hover{border-color:var(--acc)}
.tab i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);font-style:normal;font-weight:700;font-size:13px;color:var(--fg);margin-bottom:6px}
.tab b{display:block;font-size:14.5px;color:var(--fg)}
.tab.on{border-color:var(--acc);box-shadow:0 10px 22px -16px var(--acc)}
.tab.on i{background:var(--acc);border-color:var(--acc);color:#fff}.tab.on b{color:var(--acc)}
.tab.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.timer{text-align:center;color:var(--mut);margin:0 0 16px;font-size:14.5px}
.timer b{font:700 26px/1 var(--disp);color:var(--fg);font-variant-numeric:tabular-nums;margin:0 6px}
/* Thẻ nội dung */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 36px;text-align:center;margin-bottom:18px;box-shadow:var(--sh)}
.zh{font-size:50px;line-height:1.35;margin:10px 0 12px;letter-spacing:2px}
.zh,.han{font-family:var(--han,"PingFang SC","Noto Sans SC",sans-serif)}
.sg{display:inline-block;vertical-align:top;margin:0 6px 8px;border-bottom:3px solid currentColor;text-align:center}
.sg small{display:block;font:600 12px/1.3 -apple-system,"Segoe UI",sans-serif;letter-spacing:0;max-width:130px;margin:3px auto 4px}
.sS{color:var(--t1)}.sV{color:var(--t4)}.sO{color:var(--t2)}.sK{color:var(--t3)}.sT,.sP,.sC{color:var(--t5)}
.sg.sX{color:var(--fg);border-bottom-color:var(--line)}.sg.sX small{color:var(--mut)}
.fm{font-size:14.5px;margin:6px 0 14px;color:var(--mut)}.fm .sX{color:var(--mut)}
.py{font-size:23px;color:var(--acc);letter-spacing:.3px}
rt{font-size:max(.42em,11px);color:var(--acc);font-weight:400;font-family:inherit;letter-spacing:0;user-select:none}
.vi{font-size:20px;margin-top:8px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.hint{color:var(--mut);font-size:14.5px}
.card>.hint:first-child{margin-bottom:8px}
.note{background:color-mix(in srgb,var(--gold) 12%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));border-radius:14px;padding:14px 18px;text-align:left;font-size:15.5px;line-height:1.75;margin:14px 0}
/* Từ mới */
.voc{text-align:left;padding:26px 30px;columns:2;column-gap:40px}
.voc h3{font:700 13px/1 inherit;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);column-span:all;margin-bottom:12px}
.vr{display:grid;grid-template-columns:minmax(76px,auto) minmax(76px,auto) 1fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);break-inside:avoid}
.vr>*{min-width:0}
.vb{font-size:22px;padding:4px 14px;justify-self:start;border-radius:10px}
.vr .vp{font-size:16px;color:var(--acc)}.vr .vv{font-size:15px}
/* Hội thoại, trắc nghiệm */
.bub{max-width:80%;padding:12px 16px;border-radius:16px;margin:10px 0;background:var(--bg);border:1px solid var(--line);font-size:19px}
.bub.me{margin-left:auto;background:var(--acc);color:#fff;border-color:var(--acc)}
.bub.me .t1,.bub.me .t2,.bub.me .t3,.bub.me .t4{color:#fff}
.bub small{display:block;opacity:.88;font-size:14.5px;margin-top:2px}
.opt{display:block;width:100%;text-align:left;margin:10px 0;font-size:19px;border-radius:14px;padding:14px 20px}
.good{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}
footer{text-align:center;margin-top:36px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
footer a{color:var(--acc)}
/* Hộp thoại */
#ov{position:fixed;inset:0;background:rgba(15,10,5,.6);backdrop-filter:blur(3px);z-index:20;overflow:auto;padding:16px}
#ovBody{max-width:720px;margin:28px auto;text-align:left;padding:30px 34px}
#ovBody h3{font:700 22px/1.3 var(--disp);margin-bottom:12px}
#ovBody label{display:block;margin:12px 0}#ovBody select{width:100%}
#ovBody table{border-collapse:collapse;width:100%;font-size:14.5px;margin:10px 0}#ovBody td,#ovBody th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
#ovBody th{background:var(--bg)}
#ovBody p,#ovBody li{font-size:15.5px;line-height:1.75}
[hidden]{display:none!important}
/* Màn hình vừa và nhỏ */
@media (max-width:1040px){
 .shell{grid-template-columns:1fr;gap:20px;padding:18px 16px 40px}
 .side{position:static;max-height:none;overflow:visible;padding:0}
 #lessonSel{display:block}#lessonList{display:none}
 main{max-width:none}
 .top-in{padding:10px 16px}
}
@media (max-width:640px){
 .card{padding:26px 16px}.zh{font-size:38px;letter-spacing:0}.py{font-size:20px}
 .lhead h2{font-size:24px}.voc{columns:1;padding:18px 16px}
 .tabs{gap:5px}.tab{font-size:0;padding:8px 2px}.tab b{font-size:11.5px}.tab i{width:24px;height:24px;font-size:12px}
 .bub{max-width:92%;font-size:17px}#ovBody{padding:20px 16px}.brand small{display:none}
}
</style>

d:[["A","你好，你要什么？","nǐ hǎo, nǐ yào shénme?","Xin chào, bạn cần gì?"],["B","这个多少钱？","zhège duōshao qián?","Cái này bao nhiêu tiền?"],
["A","一百块。","yì bǎi kuài.","Một trăm tệ."],["B","太贵了。能便宜一点吗？","tài guì le. néng piányi yìdiǎn ma?","Đắt quá. Rẻ hơn chút được không?"],
["A","八十块，可以吗？","bāshí kuài, kěyǐ ma?","Tám mươi tệ, được không?"],["B","好，我要这个。","hǎo, wǒ yào zhège.","Được, tôi lấy cái này."]]},
{t:"Ăn uống",g:"想 + động từ = muốn làm gì: 我想点菜. 不 phủ định động từ thường: 我不吃辣. Lượng từ: 一杯水 (cốc nước), 一个 (cái, chung). 来 = cho / mang đến (gọi món).",p:[
["请给我菜单","qǐng gěi wǒ càidān","Xin cho tôi thực đơn"],["我想点菜","wǒ xiǎng diǎn cài","Tôi muốn gọi món"],["有什么推荐的吗？","yǒu shénme tuījiàn de ma?","Có món nào gợi ý không?"],
["我不吃辣","wǒ bù chī là","Tôi không ăn cay"],["来一杯水","lái yì bēi shuǐ","Cho một ly nước"],["很好吃","hěn hǎochī","Rất ngon"],["买单","mǎidān","Tính tiền"],["打包","dǎbāo","Gói mang về"]],
d:[["A","欢迎光临！这是菜单。","huānyíng guānglín! zhè shì càidān.","Chào mừng! Đây là thực đơn."],["B","有什么推荐的吗？","yǒu shénme tuījiàn de ma?","Có món nào gợi ý không?"],
["A","我们的鸡肉很好吃，但是有点辣。","wǒmen de jīròu hěn hǎochī, dànshì yǒudiǎn là.","Món gà rất ngon nhưng hơi cay."],["B","我不吃辣。来一杯水，谢谢。","wǒ bù chī là. lái yì bēi shuǐ, xièxie.","Tôi không ăn cay. Cho ly nước, cảm ơn."],
["A","好的。","hǎo de.","Vâng."],["B","很好吃！买单。","hěn hǎochī! mǎidān.","Rất ngon! Tính tiền."]]},
{t:"Hỏi đường",g:"在 = ở: 厕所在哪儿？ 怎么 + động từ = làm thế nào: 怎么走. 离 A 很近/远 = cách A gần/xa. 往 + hướng + động từ = đi về hướng…",p:[
["请问，厕所在哪儿？","qǐngwèn, cèsuǒ zài nǎr?","Xin hỏi, nhà vệ sinh ở đâu?"],["地铁站怎么走？","dìtiězhàn zěnme zǒu?","Ga tàu điện đi thế nào?"],["往前走","wǎng qián zǒu","Đi thẳng về phía trước"],
["左转","zuǒ zhuǎn","Rẽ trái"],["右转","yòu zhuǎn","Rẽ phải"],["远吗？","yuǎn ma?","Xa không?"],["离这儿很近","lí zhèr hěn jìn","Cách đây rất gần"],["我迷路了","wǒ mílù le","Tôi bị lạc đường"]],
d:[["A","请问，地铁站怎么走？","qǐngwèn, dìtiězhàn zěnme zǒu?","Xin hỏi, ga tàu điện đi thế nào?"],["B","往前走，然后右转。","wǎng qián zǒu, ránhòu yòu zhuǎn.","Đi thẳng rồi rẽ phải."],
["A","远吗？","yuǎn ma?","Xa không?"],["B","不远，离这儿很近。","bù yuǎn, lí zhèr hěn jìn.","Không xa, rất gần đây."],["A","谢谢你！","xièxie nǐ!","Cảm ơn bạn!"]]},
{t:"Thời gian & hẹn gặp",g:"Từ chỉ thời gian đứng TRƯỚC động từ: 明天见, 周末你做什么. 几 hỏi số nhỏ: 几点 (mấy giờ), 星期几 (thứ mấy). 吗 hỏi có/không; 什么 / 几 / 哪儿 hỏi thông tin (không thêm 吗).",p:[
["现在几点？","xiànzài jǐ diǎn?","Bây giờ mấy giờ?"],["今天星期几？","jīntiān xīngqī jǐ?","Hôm nay thứ mấy?"],["明天见","míngtiān jiàn","Mai gặp"],
["你有空吗？","nǐ yǒu kòng ma?","Bạn rảnh không?"],["我们几点见面？","wǒmen jǐ diǎn jiànmiàn?","Mấy giờ mình gặp nhau?"],["没问题","méi wèntí","Không vấn đề"],
["我晚到一会儿","wǒ wǎn dào yíhuìr","Tôi sẽ đến muộn một lát"],["周末你做什么？","zhōumò nǐ zuò shénme?","Cuối tuần bạn làm gì?"]],
d:[["A","周末你有空吗？","zhōumò nǐ yǒu kòng ma?","Cuối tuần bạn rảnh không?"],["B","有空。我们几点见面？","yǒu kòng. wǒmen jǐ diǎn jiànmiàn?","Rảnh. Mấy giờ mình gặp?"],
["A","下午三点，可以吗？","xiàwǔ sān diǎn, kěyǐ ma?","Ba giờ chiều, được không?"],["B","没问题。我可能晚到一会儿。","méi wèntí. wǒ kěnéng wǎn dào yíhuìr.","Không vấn đề. Có thể tôi đến muộn chút."],
["A","好的，明天见！","hǎo de, míngtiān jiàn!","Được, mai gặp!"]]},
{t:"Công việc & sở thích",g:"在 + nơi chốn + động từ: 我住在河内. 喜欢 + động từ/danh từ: 我喜欢看电影. 了 sau 多大 / số tuổi biểu thị trạng thái hiện tại: 你多大了？ 我三十岁.",p:[
["你做什么工作？","nǐ zuò shénme gōngzuò?","Bạn làm nghề gì?"],["我是老师","wǒ shì lǎoshī","Tôi là giáo viên"],["你喜欢什么？","nǐ xǐhuan shénme?","Bạn thích gì?"],
["我喜欢看电影","wǒ xǐhuan kàn diànyǐng","Tôi thích xem phim"],["你住在哪儿？","nǐ zhù zài nǎr?","Bạn sống ở đâu?"],["我住在河内","wǒ zhù zài Hénèi","Tôi sống ở Hà Nội"],
["你多大了？","nǐ duō dà le?","Bạn bao nhiêu tuổi?"],["我今年三十岁","wǒ jīnnián sānshí suì","Năm nay tôi 30 tuổi"]],
d:[["A","你做什么工作？","nǐ zuò shénme gōngzuò?","Bạn làm nghề gì?"],["B","我是老师。你呢？","wǒ shì lǎoshī. nǐ ne?","Tôi là giáo viên. Còn bạn?"],
["A","我也是。你住在哪儿？","wǒ yě shì. nǐ zhù zài nǎr?","Tôi cũng vậy. Bạn sống ở đâu?"],["B","我住在河内。你喜欢什么？","wǒ zhù zài Hénèi. nǐ xǐhuan shénme?","Tôi ở Hà Nội. Bạn thích gì?"],
["A","我喜欢看电影。","wǒ xǐhuan kàn diànyǐng.","Tôi thích xem phim."]]},
{t:"Sức khỏe",g:"了 cuối câu = trạng thái mới/đã xảy ra: 我发烧了. 怎么了 = bị làm sao vậy? 多 + động từ = hãy … nhiều: 多喝热水. 好好 + động từ = làm cho tử tế: 好好休息.",p:[
["你怎么了？","nǐ zěnme le?","Bạn sao vậy?"],["我不舒服","wǒ bù shūfu","Tôi thấy không khỏe"],["我头疼","wǒ tóu téng","Tôi đau đầu"],
["我发烧了","wǒ fāshāo le","Tôi bị sốt"],["我想看医生","wǒ xiǎng kàn yīshēng","Tôi muốn gặp bác sĩ"],["药店在哪儿？","yàodiàn zài nǎr?","Hiệu thuốc ở đâu?"],
["多喝热水","duō hē rè shuǐ","Uống nhiều nước nóng"],["好好休息","hǎohāo xiūxi","Nghỉ ngơi cho tốt"]],
d:[["A","你怎么了？","nǐ zěnme le?","Bạn sao vậy?"],["B","我不舒服，我头疼。","wǒ bù shūfu, wǒ tóu téng.","Tôi không khỏe, đau đầu."],
["A","你发烧了吗？","nǐ fāshāo le ma?","Bạn có sốt không?"],["B","有一点。我想看医生。","yǒu yìdiǎn. wǒ xiǎng kàn yīshēng.","Hơi sốt. Tôi muốn gặp bác sĩ."],
["A","好好休息，多喝热水。","hǎohāo xiūxi, duō hē rè shuǐ.","Nghỉ ngơi, uống nhiều nước nóng."]]},
{t:"Taxi & khách sạn",g:"了 sau động từ = đã hoàn thành: 我订了房间. 请 + động từ + 一点 = xin … hơn một chút: 请开快一点. 有…吗 hỏi có hay không. 到了 = đến nơi rồi.",p:[
["我订了房间","wǒ dìng le fángjiān","Tôi đã đặt phòng"],["我想退房","wǒ xiǎng tuìfáng","Tôi muốn trả phòng"],["有无线网吗？","yǒu wúxiàn wǎng ma?","Có wifi không?"],
["密码是什么？","mìmǎ shì shénme?","Mật khẩu là gì?"],["去机场","qù jīchǎng","Đi sân bay"],["请开快一点","qǐng kāi kuài yìdiǎn","Xin chạy nhanh hơn chút"],
["在这儿停","zài zhèr tíng","Dừng ở đây"],["到了，谢谢","dào le, xièxie","Đến rồi, cảm ơn"]],
d:[["A","你好，我订了房间。","nǐ hǎo, wǒ dìng le fángjiān.","Xin chào, tôi đã đặt phòng."],["B","好的。请问你叫什么名字？","hǎo de. qǐngwèn nǐ jiào shénme míngzi?","Vâng. Xin hỏi bạn tên gì?"],
["A","我叫小明。有无线网吗？","wǒ jiào Xiǎo Míng. yǒu wúxiàn wǎng ma?","Tôi tên Tiểu Minh. Có wifi không?"],["B","有。密码在这儿。","yǒu. mìmǎ zài zhèr.","Có. Mật khẩu ở đây."],
["A","谢谢！","xièxie!","Cảm ơn!"]]},
{t:"Điện thoại & cảm xúc",g:"很 + tính từ: 我很忙. 有点 + tính từ = hơi (thường nghĩa tiêu cực): 我有点累. 对不起 (xin lỗi) trả lời bằng 没关系 (không sao).",p:[
["喂，你好","wéi, nǐ hǎo","A lô, xin chào"],["能加你微信吗？","néng jiā nǐ Wēixìn ma?","Mình kết bạn WeChat được không?"],["我给你打电话","wǒ gěi nǐ dǎ diànhuà","Tôi sẽ gọi cho bạn"],
["我现在很忙","wǒ xiànzài hěn máng","Bây giờ tôi rất bận"],["我很开心","wǒ hěn kāixīn","Tôi rất vui"],["我有点累","wǒ yǒudiǎn lèi","Tôi hơi mệt"],
["对不起","duìbuqǐ","Xin lỗi"],["没关系","méi guānxi","Không sao"]],
d:[["A","喂，你好！你现在忙吗？","wéi, nǐ hǎo! nǐ xiànzài máng ma?","A lô! Bây giờ bạn bận không?"],["B","我现在很忙，对不起。","wǒ xiànzài hěn máng, duìbuqǐ.","Bây giờ tôi rất bận, xin lỗi."],
["A","没关系。我给你打电话。","méi guānxi. wǒ gěi nǐ dǎ diànhuà.","Không sao. Tôi gọi lại bạn."],["B","好的。能加你微信吗？","hǎo de. néng jiā nǐ Wēixìn ma?","Được. Kết bạn WeChat nhé?"],
["A","可以！","kěyǐ!","Được!"]]},
{t:"Gia đình",g:"有 = có (sở hữu, số lượng): 我有一个姐姐. Phủ định của 有 là 没有 (KHÔNG nói 不有). 的 chỉ sở hữu: 我的家人. Lượng từ 口 đếm người trong gia đình: 几口人.",p:[
["这是我的家人","zhè shì wǒ de jiārén","Đây là gia đình tôi"],["你有兄弟姐妹吗？","nǐ yǒu xiōngdì jiěmèi ma?","Bạn có anh chị em không?"],["我有一个姐姐","wǒ yǒu yí ge jiějie","Tôi có một chị gái"],
["我爸爸在银行工作","wǒ bàba zài yínháng gōngzuò","Bố tôi làm ở ngân hàng"],["我妈妈做饭很好吃","wǒ māma zuò fàn hěn hǎochī","Mẹ tôi nấu ăn rất ngon"],["你结婚了吗？","nǐ jiéhūn le ma?","Bạn kết hôn chưa?"],
["我还没有孩子","wǒ hái méiyǒu háizi","Tôi chưa có con"],["你们家有几口人？","nǐmen jiā yǒu jǐ kǒu rén?","Nhà bạn có mấy người?"]],
d:[["A","你有兄弟姐妹吗？","nǐ yǒu xiōngdì jiěmèi ma?","Bạn có anh chị em không?"],["B","我有一个姐姐。你呢？","wǒ yǒu yí ge jiějie. nǐ ne?","Tôi có một chị gái. Còn bạn?"],
["A","我没有。你们家有几口人？","wǒ méiyǒu. nǐmen jiā yǒu jǐ kǒu rén?","Tôi không có. Nhà bạn có mấy người?"],["B","四口人。我爸爸在银行工作。","sì kǒu rén. wǒ bàba zài yínháng gōngzuò.","Bốn người. Bố tôi làm ở ngân hàng."]]},
{t:"Thời tiết",g:"在 + động từ = đang làm (tiếp diễn): 外面在下雨. 会 = sẽ (dự đoán): 明天会冷. 怎么样 = thế nào (hỏi tình trạng). 真 + tính từ = thật là…",p:[
["今天天气怎么样？","jīntiān tiānqì zěnmeyàng?","Hôm nay thời tiết thế nào?"],["今天很热","jīntiān hěn rè","Hôm nay rất nóng"],["外面在下雨","wàimiàn zài xià yǔ","Bên ngoài đang mưa"],
["明天会冷吗？","míngtiān huì lěng ma?","Mai có lạnh không?"],["我带伞了","wǒ dài sǎn le","Tôi mang ô rồi"],["天气真好","tiānqì zhēn hǎo","Thời tiết thật đẹp"],
["这里冬天很冷","zhèlǐ dōngtiān hěn lěng","Ở đây mùa đông rất lạnh"],["你喜欢什么季节？","nǐ xǐhuan shénme jìjié?","Bạn thích mùa nào?"]],
d:[["A","今天天气怎么样？","jīntiān tiānqì zěnmeyàng?","Hôm nay thời tiết thế nào?"],["B","外面在下雨。","wàimiàn zài xià yǔ.","Bên ngoài đang mưa."],
["A","明天会冷吗？","míngtiān huì lěng ma?","Mai có lạnh không?"],["B","会。你带伞了吗？","huì. nǐ dài sǎn le ma?","Có. Bạn mang ô chưa?"],["A","带了，谢谢！","dài le, xièxie!","Mang rồi, cảm ơn!"]]},
{t:"Đi lại & phương tiện",g:"坐 + phương tiện: 坐地铁. 要 + khoảng thời gian = mất bao lâu: 要五个小时. 一张票: lượng từ 张 cho vé/giấy. Bổ ngữ kết quả 错 = nhầm: 坐错车.",p:[
["我坐地铁上班","wǒ zuò dìtiě shàngbān","Tôi đi tàu điện đến chỗ làm"],["火车几点开？","huǒchē jǐ diǎn kāi?","Mấy giờ tàu chạy?"],["我要买一张票","wǒ yào mǎi yì zhāng piào","Tôi muốn mua một vé"],
["到北京要多长时间？","dào Běijīng yào duō cháng shíjiān?","Đến Bắc Kinh mất bao lâu?"],["在哪儿换车？","zài nǎr huàn chē?","Đổi tàu/xe ở đâu?"],["我坐错车了","wǒ zuò cuò chē le","Tôi đi nhầm xe rồi"],
["这是几号线？","zhè shì jǐ hào xiàn?","Đây là tuyến số mấy?"],["下一站是哪儿？","xià yí zhàn shì nǎr?","Ga tiếp theo là ga nào?"]],
d:[["A","我要买一张去北京的票。","wǒ yào mǎi yì zhāng qù Běijīng de piào.","Tôi muốn mua một vé đi Bắc Kinh."],["B","下午三点的火车可以吗？","xiàwǔ sān diǎn de huǒchē kěyǐ ma?","Tàu 3 giờ chiều được không?"],
["A","到北京要多长时间？","dào Běijīng yào duō cháng shíjiān?","Đến Bắc Kinh mất bao lâu?"],["B","大概五个小时。","dàgài wǔ ge xiǎoshí.","Khoảng năm tiếng."],["A","好，我要这张。","hǎo, wǒ yào zhè zhāng.","Được, tôi lấy vé này."]]},
{t:"Văn phòng",g:"要 + động từ = sẽ / phải: 我要开会. 什么时候 = khi nào (đứng trước động từ). 请 + động từ: 请发邮件. 了 sau 明白 = đã hiểu ra. 下周 / 明天 đứng trước động từ.",p:[
["我今天要开会","wǒ jīntiān yào kāihuì","Hôm nay tôi phải họp"],["你什么时候下班？","nǐ shénme shíhou xiàbān?","Khi nào bạn tan làm?"],["我在加班","wǒ zài jiābān","Tôi đang làm thêm giờ"],
["请发邮件给我","qǐng fā yóujiàn gěi wǒ","Xin gửi email cho tôi"],["我需要你的帮助","wǒ xūyào nǐ de bāngzhù","Tôi cần sự giúp đỡ của bạn"],["这个问题怎么解决？","zhège wèntí zěnme jiějué?","Vấn đề này giải quyết thế nào?"],
["我明白了","wǒ míngbai le","Tôi hiểu rồi"],["我们下周再讨论","wǒmen xià zhōu zài tǎolùn","Tuần sau mình bàn tiếp"]],
d:[["A","你什么时候下班？","nǐ shénme shíhou xiàbān?","Khi nào bạn tan làm?"],["B","我今天要开会，可能要加班。","wǒ jīntiān yào kāihuì, kěnéng yào jiābān.","Hôm nay tôi họp, có thể làm thêm."],
["A","我需要你的帮助。","wǒ xūyào nǐ de bāngzhù.","Tôi cần bạn giúp."],["B","没问题，请发邮件给我。","méi wèntí, qǐng fā yóujiàn gěi wǒ.","Không vấn đề, gửi email cho tôi."],["A","我明白了，谢谢。","wǒ míngbai le, xièxie.","Tôi hiểu rồi, cảm ơn."]]},
{t:"Thanh toán & mua hàng",g:"用 + công cụ + động từ = dùng … để …: 用微信支付. 有没有 = câu hỏi dạng khẳng định-phủ định (như 吗): 有没有小一点儿的？ 可以 = được phép; 能 = có khả năng/điều kiện. 试试 = thử (lặp động từ làm nhẹ).",p:[
["可以用微信支付吗？","kěyǐ yòng Wēixìn zhīfù ma?","Dùng WeChat Pay được không?"],["我扫码付款","wǒ sǎo mǎ fùkuǎn","Tôi quét mã thanh toán"],["有发票吗？","yǒu fāpiào ma?","Có hóa đơn không?"],
["我想退货","wǒ xiǎng tuìhuò","Tôi muốn trả hàng"],["什么时候能送到？","shénme shíhou néng sòng dào?","Khi nào giao đến?"],["有没有小一点儿的？","yǒu méiyǒu xiǎo yìdiǎnr de?","Có cái nhỏ hơn không?"],
["我可以试试吗？","wǒ kěyǐ shìshi ma?","Tôi thử được không?"],["打折吗？","dǎzhé ma?","Có giảm giá không?"]],
d:[["A","我想买这个。可以用微信支付吗？","wǒ xiǎng mǎi zhège. kěyǐ yòng Wēixìn zhīfù ma?","Tôi muốn mua cái này. Dùng WeChat Pay được không?"],["B","可以，请扫码。","kěyǐ, qǐng sǎo mǎ.","Được, xin quét mã."],
["A","有发票吗？","yǒu fāpiào ma?","Có hóa đơn không?"],["B","有。","yǒu.","Có."],["A","什么时候能送到？","shénme shíhou néng sòng dào?","Khi nào giao đến?"],["B","明天。","míngtiān.","Ngày mai."]]},
{t:"Quá khứ & dự định",g:"了 = đã xảy ra/hoàn thành: 我昨天去了超市. 过 = đã từng: 我去过中国. Phủ định quá khứ dùng 没(有) và BỎ 了: 我还没吃. 打算 + động từ = dự định. …吧 = đề nghị: 我们一起去吧.",p:[
["我昨天去了超市","wǒ zuótiān qù le chāoshì","Hôm qua tôi đã đi siêu thị"],["你吃饭了吗？","nǐ chī fàn le ma?","Bạn ăn cơm chưa?"],["我去过中国","wǒ qù guo Zhōngguó","Tôi đã từng đến Trung Quốc"],
["我还没吃","wǒ hái méi chī","Tôi vẫn chưa ăn"],["我打算明年去北京","wǒ dǎsuàn míngnián qù Běijīng","Năm sau tôi dự định đi Bắc Kinh"],["我们一起去吧","wǒmen yìqǐ qù ba","Mình cùng đi nhé"],
["你想去哪儿玩？","nǐ xiǎng qù nǎr wán?","Bạn muốn đi chơi đâu?"],["我对中国文化感兴趣","wǒ duì Zhōngguó wénhuà gǎn xìngqù","Tôi hứng thú với văn hóa Trung Quốc"]],
d:[["A","你吃饭了吗？","nǐ chī fàn le ma?","Bạn ăn cơm chưa?"],["B","还没吃。你呢？","hái méi chī. nǐ ne?","Chưa. Còn bạn?"],["A","我也没吃。我们一起去吧。","wǒ yě méi chī. wǒmen yìqǐ qù ba.","Tôi cũng chưa. Mình cùng đi nhé."],
["B","好啊！你去过这家店吗？","hǎo a! nǐ qù guo zhè jiā diàn ma?","Được! Bạn từng đến quán này chưa?"],["A","没去过，听说很好吃。","méi qù guo, tīngshuō hěn hǎochī.","Chưa, nghe nói rất ngon."]]},
{t:"Ý kiến & so sánh",g:"比 so sánh: A 比 B + tính từ: 这个比那个好. 最 + tính từ = nhất: 最喜欢. 觉得 = cảm thấy/nghĩ rằng. 得 nối động từ với mức độ: 你说得对. 不太 + tính từ = không … lắm.",p:[
["我觉得很不错","wǒ juéde hěn búcuò","Tôi thấy rất ổn"],["你同意吗？","nǐ tóngyì ma?","Bạn đồng ý không?"],["我不同意","wǒ bù tóngyì","Tôi không đồng ý"],
["这个比那个好","zhège bǐ nàge hǎo","Cái này tốt hơn cái kia"],["我最喜欢这个","wǒ zuì xǐhuan zhège","Tôi thích cái này nhất"],["你说得对","nǐ shuō de duì","Bạn nói đúng"],
["我不太确定","wǒ bú tài quèdìng","Tôi không chắc lắm"],["这样可以吗？","zhèyàng kěyǐ ma?","Như vậy được không?"]],
d:[["A","你觉得这个怎么样？","nǐ juéde zhège zěnmeyàng?","Bạn thấy cái này thế nào?"],["B","我觉得很不错。","wǒ juéde hěn búcuò.","Tôi thấy rất ổn."],
["A","这个比那个好吗？","zhège bǐ nàge hǎo ma?","Cái này tốt hơn cái kia à?"],["B","对，我最喜欢这个。","duì, wǒ zuì xǐhuan zhège.","Đúng, tôi thích cái này nhất."],["A","你说得对。","nǐ shuō de duì.","Bạn nói đúng."]]},
{t:"Nhờ vả & lịch sự",g:"可以 + động từ + 吗 = xin phép/nhờ. 一下 sau động từ làm yêu cầu nhẹ nhàng: 帮我一下. 稍 = một chút. Cặp lịch sự: 麻烦你了 → 不客气 / 没关系.",p:[
["可以帮我一下吗？","kěyǐ bāng wǒ yíxià ma?","Bạn giúp tôi một chút được không?"],["我可以坐这儿吗？","wǒ kěyǐ zuò zhèr ma?","Tôi ngồi đây được không?"],["能借我一支笔吗？","néng jiè wǒ yì zhī bǐ ma?","Cho tôi mượn cây bút được không?"],
["麻烦你了","máfan nǐ le","Làm phiền bạn rồi"],["不好意思，打扰一下","bù hǎoyìsi, dǎrǎo yíxià","Xin lỗi, cho tôi làm phiền một chút"],["请稍等","qǐng shāo děng","Xin chờ một chút"],
["谢谢你的帮助","xièxie nǐ de bāngzhù","Cảm ơn sự giúp đỡ của bạn"],["不客气","bú kèqi","Đừng khách sáo"]],
d:[["A","不好意思，打扰一下。","bù hǎoyìsi, dǎrǎo yíxià.","Xin lỗi, làm phiền một chút."],["B","没关系，什么事？","méi guānxi, shénme shì?","Không sao, có việc gì?"],
["A","可以帮我一下吗？","kěyǐ bāng wǒ yíxià ma?","Bạn giúp tôi chút được không?"],["B","当然可以。请稍等。","dāngrán kěyǐ. qǐng shāo děng.","Tất nhiên rồi. Xin chờ chút."],
["A","麻烦你了。","máfan nǐ le.","Làm phiền bạn rồi."],["B","不客气。","bú kèqi.","Đừng khách sáo."]]},
{t:"Nhà ở",g:"有 chỉ sự tồn tại: 房间里有空调 (trong phòng có điều hòa). 在 + nơi: 我家在二楼. 帮我 + động từ = giúp tôi làm…: 帮我修一下. 坏了 = hỏng rồi (了 = trạng thái mới).",p:[
["我家在二楼","wǒ jiā zài èr lóu","Nhà tôi ở tầng 2"],["房间里有空调吗？","fángjiān lǐ yǒu kōngtiáo ma?","Trong phòng có điều hòa không?"],["这里附近有超市吗？","zhèlǐ fùjìn yǒu chāoshì ma?","Gần đây có siêu thị không?"],
["我想租房子","wǒ xiǎng zū fángzi","Tôi muốn thuê nhà"],["房租多少钱？","fángzū duōshao qián?","Tiền thuê nhà bao nhiêu?"],["水龙头坏了","shuǐlóngtóu huài le","Vòi nước hỏng rồi"],
["请帮我修一下","qǐng bāng wǒ xiū yíxià","Xin giúp tôi sửa một chút"],["我搬家了","wǒ bānjiā le","Tôi chuyển nhà rồi"]],
d:[["A","我想租房子。","wǒ xiǎng zū fángzi.","Tôi muốn thuê nhà."],["B","这个房子在二楼，有空调。","zhège fángzi zài èr lóu, yǒu kōngtiáo.","Căn này ở tầng 2, có điều hòa."],
["A","房租多少钱？","fángzū duōshao qián?","Tiền thuê bao nhiêu?"],["B","每个月三千块。","měi ge yuè sānqiān kuài.","Mỗi tháng ba nghìn tệ."],
["A","这里附近有超市吗？","zhèlǐ fùjìn yǒu chāoshì ma?","Gần đây có siêu thị không?"],["B","有，很近。","yǒu, hěn jìn.","Có, rất gần."]]},
{t:"Kể chuyện & ôn tổng hợp",g:"得 + mức độ: 玩得很开心 (chơi rất vui), 睡得很晚 (ngủ rất muộn). 最近 = dạo gần đây. 了 báo hiệu việc đã xảy ra: 我去爬山了. Bài ôn: tự kể về cuối tuần của bạn bằng 5 câu, dùng 了, 得, 有点.",p:[
["周末我去爬山了","zhōumò wǒ qù pá shān le","Cuối tuần tôi đi leo núi"],["玩得很开心","wán de hěn kāixīn","Chơi rất vui"],["你有什么计划？","nǐ yǒu shénme jìhuà?","Bạn có kế hoạch gì?"],
["我昨天睡得很晚","wǒ zuótiān shuì de hěn wǎn","Hôm qua tôi ngủ rất muộn"],["我最近有点忙","wǒ zuìjìn yǒudiǎn máng","Dạo này tôi hơi bận"],["慢慢来","mànmàn lái","Từ từ thôi"],
["加油！","jiāyóu!","Cố lên!"],["我们保持联系","wǒmen bǎochí liánxì","Mình giữ liên lạc nhé"]],
d:[["A","周末你做什么了？","zhōumò nǐ zuò shénme le?","Cuối tuần bạn làm gì?"],["B","我去爬山了，玩得很开心。你呢？","wǒ qù pá shān le, wán de hěn kāixīn. nǐ ne?","Tôi đi leo núi, chơi rất vui. Còn bạn?"],
["A","我最近有点忙，睡得很晚。","wǒ zuìjìn yǒudiǎn máng, shuì de hěn wǎn.","Dạo này tôi hơi bận, ngủ rất muộn."],["B","慢慢来，加油！","mànmàn lái, jiāyóu!","Từ từ thôi, cố lên!"]]},
{t:"Xưởng: vào ca & chấm công",g:"上 + ca = làm ca: 上白班 (ca ngày), 上夜班 (ca đêm), 上班 (đi làm), 下班 (tan làm). 新来的 = mới đến. Chức danh: 组长 (tổ trưởng), 主管 (quản lý), 老板 (ông chủ), 工人 (công nhân).",p:[
["我是新来的工人","wǒ shì xīn lái de gōngrén","Tôi là công nhân mới"],["几点上班？","jǐ diǎn shàngbān?","Mấy giờ vào làm?"],["在哪儿打卡？","zài nǎr dǎkǎ?","Chấm công ở đâu?"],
["我上白班","wǒ shàng báibān","Tôi làm ca ngày"],["今天上夜班","jīntiān shàng yèbān","Hôm nay làm ca đêm"],["我的工位在哪儿？","wǒ de gōngwèi zài nǎr?","Vị trí làm việc của tôi ở đâu?"],
["组长在哪儿？","zǔzhǎng zài nǎr?","Tổ trưởng ở đâu?"],["我迟到了，对不起","wǒ chídào le, duìbuqǐ","Tôi đến muộn, xin lỗi"]],
d:[["A","你好，你是新来的工人吗？","nǐ hǎo, nǐ shì xīn lái de gōngrén ma?","Chào, bạn là công nhân mới à?"],["B","是的。请问在哪儿打卡？","shì de. qǐngwèn zài nǎr dǎkǎ?","Vâng. Xin hỏi chấm công ở đâu?"],
["A","在门口。你上白班还是夜班？","zài ménkǒu. nǐ shàng báibān háishi yèbān?","Ở cửa. Bạn làm ca ngày hay ca đêm?"],["B","我上白班。我的工位在哪儿？","wǒ shàng báibān. wǒ de gōngwèi zài nǎr?","Tôi làm ca ngày. Vị trí của tôi ở đâu?"],
["A","跟我来，组长在那儿。","gēn wǒ lái, zǔzhǎng zài nàr.","Đi theo tôi, tổ trưởng ở kia."]]},
{t:"Xưởng: an toàn lao động",g:"要 + động từ = phải: 要戴手套. 不能 + động từ = không được: 不能抽烟. 小心 / 注意 = cẩn thận / chú ý. 快 + động từ = mau …: 快关掉电源. Động từ 戴 dùng cho mũ, găng, kính, khẩu trang.",p:[
["请戴安全帽","qǐng dài ānquánmào","Xin đội mũ bảo hộ"],["要戴手套","yào dài shǒutào","Phải đeo găng tay"],["小心，危险！","xiǎoxīn, wēixiǎn!","Cẩn thận, nguy hiểm!"],
["这里不能抽烟","zhèlǐ bù néng chōuyān","Ở đây không được hút thuốc"],["注意安全","zhùyì ānquán","Chú ý an toàn"],["我受伤了","wǒ shòushāng le","Tôi bị thương rồi"],
["快关掉电源","kuài guāndiào diànyuán","Mau tắt nguồn điện"],["紧急出口在哪儿？","jǐnjí chūkǒu zài nǎr?","Lối thoát hiểm ở đâu?"]],
d:[["A","进车间要戴安全帽。","jìn chējiān yào dài ānquánmào.","Vào xưởng phải đội mũ bảo hộ."],["B","好的。要戴手套吗？","hǎo de. yào dài shǒutào ma?","Vâng. Có phải đeo găng tay không?"],
["A","要。这里不能抽烟。","yào. zhèlǐ bù néng chōuyān.","Phải. Ở đây không được hút thuốc."],["B","明白了。紧急出口在哪儿？","míngbai le. jǐnjí chūkǒu zài nǎr?","Hiểu rồi. Lối thoát hiểm ở đâu?"],
["A","在那边。注意安全！","zài nàbiān. zhùyì ānquán!","Ở đằng kia. Chú ý an toàn!"]]},
{t:"Xưởng: máy móc & sự cố",g:"Lượng từ 台 cho máy móc: 这台机器. 先 … 再 … = trước … rồi …: 先停机，再检查. Bổ ngữ kết quả: 修好 (sửa xong), 做完 (làm xong), 关掉 (tắt đi). 不够 = không đủ.",p:[
["机器坏了","jīqì huài le","Máy hỏng rồi"],["这台机器怎么用？","zhè tái jīqì zěnme yòng?","Máy này dùng thế nào?"],["请教我一下","qǐng jiāo wǒ yíxià","Xin dạy tôi một chút"],
["按这个按钮","àn zhège ànniǔ","Ấn nút này"],["先停机","xiān tíngjī","Dừng máy trước"],["请叫维修工","qǐng jiào wéixiūgōng","Xin gọi thợ sửa"],
["材料不够了","cáiliào bú gòu le","Nguyên liệu không đủ rồi"],["修好了","xiū hǎo le","Sửa xong rồi"]],
d:[["A","组长，机器坏了。","zǔzhǎng, jīqì huài le.","Tổ trưởng, máy hỏng rồi."],["B","先停机，按这个按钮。","xiān tíngjī, àn zhège ànniǔ.","Dừng máy trước, ấn nút này."],
["A","好的。要叫维修工吗？","hǎo de. yào jiào wéixiūgōng ma?","Vâng. Có cần gọi thợ sửa không?"],["B","要，我去叫。","yào, wǒ qù jiào.","Cần, tôi đi gọi."],
["A","材料也不够了。","cáiliào yě bú gòu le.","Nguyên liệu cũng không đủ rồi."],["B","知道了，我马上安排。","zhīdào le, wǒ mǎshàng ānpái.","Biết rồi, tôi sắp xếp ngay."]]},
{t:"Xưởng: sản lượng & chất lượng",g:"多少 hỏi số lượng lớn: 产量是多少？ 合格 / 不合格 = đạt / không đạt. Lượng từ 批 cho lô hàng: 这批货. Động từ + 快一点 = làm nhanh hơn. 做完了 = làm xong rồi.",p:[
["今天的产量是多少？","jīntiān de chǎnliàng shì duōshao?","Sản lượng hôm nay là bao nhiêu?"],["这个不合格","zhège bù hégé","Cái này không đạt"],["要返工","yào fǎngōng","Phải làm lại"],
["质量有问题","zhìliàng yǒu wèntí","Chất lượng có vấn đề"],["请检查一下","qǐng jiǎnchá yíxià","Xin kiểm tra một chút"],["这批货很急","zhè pī huò hěn jí","Lô hàng này rất gấp"],
["做快一点","zuò kuài yìdiǎn","Làm nhanh hơn chút"],["我做完了","wǒ zuò wán le","Tôi làm xong rồi"]],
d:[["A","今天的产量是多少？","jīntiān de chǎnliàng shì duōshao?","Sản lượng hôm nay bao nhiêu?"],["B","五百个。我做完了。","wǔ bǎi ge. wǒ zuò wán le.","Năm trăm cái. Tôi làm xong rồi."],
["A","我检查一下。这个不合格，要返工。","wǒ jiǎnchá yíxià. zhège bù hégé, yào fǎngōng.","Để tôi kiểm tra. Cái này không đạt, phải làm lại."],["B","好的，我马上做。","hǎo de, wǒ mǎshàng zuò.","Vâng, tôi làm ngay."],
["A","这批货很急，做快一点。","zhè pī huò hěn jí, zuò kuài yìdiǎn.","Lô này gấp lắm, làm nhanh chút."]]},
{t:"Xưởng: lương, tăng ca, nghỉ phép",g:"请假 là động từ ly hợp: 请一天假 (xin nghỉ một ngày), không nói 请假一天. 怎么算 = tính thế nào. 发工资 = phát lương. 加班 = tăng ca, 加班费 = tiền tăng ca.",p:[
["今天要加班吗？","jīntiān yào jiābān ma?","Hôm nay có phải tăng ca không?"],["加班费怎么算？","jiābānfèi zěnme suàn?","Tiền tăng ca tính thế nào?"],["什么时候发工资？","shénme shíhou fā gōngzī?","Khi nào phát lương?"],
["我想请假","wǒ xiǎng qǐngjià","Tôi muốn xin nghỉ"],["我想请一天假","wǒ xiǎng qǐng yì tiān jià","Tôi muốn xin nghỉ một ngày"],["几点休息？","jǐ diǎn xiūxi?","Mấy giờ nghỉ?"],

{t:"Khẩu ngữ: trợ từ ngữ khí",g:"Người bản xứ gần như câu nào cũng có trợ từ cuối câu. 吧 = đề nghị/đoán: 走吧. 呢 = đang diễn ra / hỏi lại: 干嘛呢. 啊 = nhấn mạnh thân mật: 好啊. 嘛 = hiển nhiên mà: 很简单嘛. 呗 = thì cứ vậy thôi. Từ đệm khi nghĩ: 那个…, 就是说…",p:[
["我们走吧","wǒmen zǒu ba","Mình đi thôi"],["你在干嘛呢？","nǐ zài gànmá ne?","Bạn đang làm gì đấy?"],["好啊！","hǎo a!","Được thôi!"],
["这很简单嘛","zhè hěn jiǎndān ma","Cái này đơn giản mà"],["不想去就不去呗","bù xiǎng qù jiù bú qù bei","Không muốn đi thì thôi khỏi đi"],["那个，我想问一下","nàge, wǒ xiǎng wèn yíxià","À ừm, tôi muốn hỏi chút"],
["就是说","jiùshì shuō","Tức là / ý là"],["对了，还有一件事","duì le, hái yǒu yí jiàn shì","À đúng rồi, còn một việc nữa"]],
d:[["A","你在干嘛呢？","nǐ zài gànmá ne?","Bạn đang làm gì đấy?"],["B","没干嘛。我们出去走走吧？","méi gànmá. wǒmen chūqù zǒuzou ba?","Không làm gì. Mình ra ngoài đi dạo nhé?"],
["A","好啊！对了，还有一件事。","hǎo a! duì le, hái yǒu yí jiàn shì.","Được thôi! À đúng rồi, còn một việc."],["B","什么事？你说嘛。","shénme shì? nǐ shuō ma.","Việc gì? Nói đi mà."],
["A","那个，我明天不想去了。","nàge, wǒ míngtiān bù xiǎng qù le.","À ừm, mai tôi không muốn đi nữa."],["B","不想去就不去呗。","bù xiǎng qù jiù bú qù bei.","Không muốn đi thì khỏi đi."]]},
{t:"Khẩu ngữ: phản ứng tự nhiên",g:"Hội thoại tự nhiên cần câu đáp ngắn để tỏ ra đang nghe. Ngạc nhiên: 真的吗 / 不会吧. Vỡ lẽ: 怪不得 / 原来是这样. Tán thành: 可不是嘛 / 那倒是. Dễ tính: 随便 / 无所谓 (chú ý 随便 nói cộc có thể nghe như thờ ơ).",p:[
["真的吗？","zhēn de ma?","Thật à?"],["不会吧！","bú huì ba!","Không thể nào!"],["怪不得","guàibude","Thảo nào"],
["原来是这样","yuánlái shì zhèyàng","Hóa ra là vậy"],["可不是嘛","kě bú shì ma","Chứ còn gì nữa"],["那倒是","nà dào shì","Cũng đúng"],
["随便","suíbiàn","Tùy, sao cũng được"],["无所谓","wúsuǒwèi","Không quan trọng"]],
d:[["A","你知道吗？小王要结婚了。","nǐ zhīdào ma? Xiǎo Wáng yào jiéhūn le.","Biết gì chưa? Tiểu Vương sắp cưới."],["B","真的吗？不会吧！","zhēn de ma? bú huì ba!","Thật à? Không thể nào!"],
["A","真的。他最近每天都很开心。","zhēn de. tā zuìjìn měi tiān dōu hěn kāixīn.","Thật. Dạo này ngày nào anh ấy cũng vui."],["B","怪不得！原来是这样。","guàibude! yuánlái shì zhèyàng.","Thảo nào! Hóa ra là vậy."],
["A","我们送什么礼物？","wǒmen sòng shénme lǐwù?","Mình tặng quà gì?"],["B","随便，你决定吧。","suíbiàn, nǐ juédìng ba.","Tùy, bạn quyết đi."]]},
{t:"Khẩu ngữ: từ cửa miệng",g:"Từ sách giáo khoa ít dạy nhưng dùng hằng ngày: 搞定 (xử lý xong), 靠谱 (đáng tin), 厉害 (giỏi, ghê), 划算 (hời), 还行 (tạm ổn), 差不多 (xấp xỉ). 别 + động từ = đừng: 别提了.",p:[
["没事","méi shì","Không sao"],["搞定了","gǎodìng le","Xử lý xong rồi"],["他很靠谱","tā hěn kàopǔ","Anh ấy rất đáng tin"],
["你太厉害了","nǐ tài lìhai le","Bạn giỏi quá"],["还行吧","hái xíng ba","Cũng tạm"],["差不多","chàbuduō","Xấp xỉ, gần như vậy"],
["这个很划算","zhège hěn huásuàn","Cái này rất hời"],["别提了","bié tí le","Đừng nhắc nữa"]],

["A","你太厉害了。是小李帮你的吗？","nǐ tài lìhai le. shì Xiǎo Lǐ bāng nǐ de ma?","Bạn giỏi quá. Tiểu Lý giúp bạn à?"],["B","对，他很靠谱。","duì, tā hěn kàopǔ.","Ừ, anh ấy rất đáng tin."],
["A","你的新工作呢？","nǐ de xīn gōngzuò ne?","Còn công việc mới của bạn?"],["B","还行吧，差不多。","hái xíng ba, chàbuduō.","Cũng tạm, vẫn vậy."]]},
{t:"Khẩu ngữ: tán gẫu với bạn",g:"Mở đầu: 好久不见 / 最近怎么样. Kết thúc lịch sự: 我先走了, 路上小心, 改天… (hôm khác…). 请 ở đây = mời (trả tiền): 我请你. 有空 + động từ = rảnh thì…",p:[
["好久不见","hǎojiǔ bú jiàn","Lâu rồi không gặp"],["最近怎么样？","zuìjìn zěnmeyàng?","Dạo này thế nào?"],["忙什么呢？","máng shénme ne?","Dạo này bận gì thế?"],
["还是老样子","háishi lǎo yàngzi","Vẫn như cũ"],["有空一起吃饭","yǒu kòng yìqǐ chī fàn","Rảnh thì đi ăn cùng nhé"],["改天我请你","gǎitiān wǒ qǐng nǐ","Hôm khác tôi mời bạn"],
["我先走了","wǒ xiān zǒu le","Tôi đi trước nhé"],["路上小心","lùshang xiǎoxīn","Đi đường cẩn thận"]],
d:[["A","好久不见！最近怎么样？","hǎojiǔ bú jiàn! zuìjìn zěnmeyàng?","Lâu rồi không gặp! Dạo này sao?"],["B","还是老样子。你忙什么呢？","háishi lǎo yàngzi. nǐ máng shénme ne?","Vẫn như cũ. Bạn bận gì thế?"],
["A","工作很忙。有空一起吃饭吧。","gōngzuò hěn máng. yǒu kòng yìqǐ chī fàn ba.","Công việc bận lắm. Rảnh đi ăn cùng nhé."],["B","好啊，改天我请你。","hǎo a, gǎitiān wǒ qǐng nǐ.","Được, hôm khác tôi mời."],
["A","我先走了。","wǒ xiān zǒu le.","Tôi đi trước nhé."],["B","路上小心！","lùshang xiǎoxīn!","Đi đường cẩn thận!"]]},
{t:"Khẩu ngữ: cảm xúc & than phiền",g:"Tính từ + 死了 = … chết đi được (nhấn mạnh, khẩu ngữ): 烦死了, 累死我了. 太…了 khen: 太棒了. 别 + động từ khuyên: 别担心. 点儿 sau động từ/tính từ = một chút: 想开点儿.",p:[
["烦死了","fán sǐ le","Bực chết đi được"],["累死我了","lèi sǐ wǒ le","Mệt chết mất"],["气死我了","qì sǐ wǒ le","Tức chết mất"],
["太棒了","tài bàng le","Tuyệt quá"],["吓我一跳","xià wǒ yí tiào","Làm tôi giật cả mình"],["我真无语","wǒ zhēn wúyǔ","Tôi cạn lời thật"],
["别担心","bié dānxīn","Đừng lo"],["想开点儿","xiǎng kāi diǎnr","Nghĩ thoáng lên chút"]],
d:[["A","累死我了，今天又加班。","lèi sǐ wǒ le, jīntiān yòu jiābān.","Mệt chết mất, hôm nay lại tăng ca."],["B","怎么又加班？","zěnme yòu jiābān?","Sao lại tăng ca nữa?"],
["A","老板说明天要交。气死我了。","lǎobǎn shuō míngtiān yào jiāo. qì sǐ wǒ le.","Sếp bảo mai phải nộp. Tức chết mất."],["B","想开点儿，周末就能休息了。","xiǎng kāi diǎnr, zhōumò jiù néng xiūxi le.","Nghĩ thoáng lên, cuối tuần là được nghỉ rồi."],
["A","那倒是。","nà dào shì.","Cũng đúng."]]},
{t:"Khẩu ngữ: mời & từ chối khéo",g:"Người Trung ít nói thẳng 不. Từ chối khéo: 下次吧 (lần sau), 我再想想 (để nghĩ thêm), 不太方便 (không tiện lắm), 恐怕不行 (e là không được). Câu hỏi A不A: 要不要 = có muốn không. 那就… = vậy thì…",p:[
["要不要一起去？","yào bu yào yìqǐ qù?","Có muốn đi cùng không?"],["下次吧","xià cì ba","Lần sau nhé"],["我再想想","wǒ zài xiǎngxiang","Để tôi nghĩ thêm"],
["今天不太方便","jīntiān bú tài fāngbiàn","Hôm nay không tiện lắm"],["恐怕不行","kǒngpà bù xíng","E là không được"],["不用了，谢谢","búyòng le, xièxie","Không cần đâu, cảm ơn"],
["你太客气了","nǐ tài kèqi le","Bạn khách sáo quá"],["那就这么定了","nà jiù zhème dìng le","Vậy quyết thế nhé"]],
d:[["A","晚上我们去唱歌，要不要一起去？","wǎnshang wǒmen qù chàng gē, yào bu yào yìqǐ qù?","Tối bọn mình đi hát, đi cùng không?"],["B","今天不太方便，下次吧。","jīntiān bú tài fāngbiàn, xià cì ba.","Hôm nay không tiện lắm, lần sau nhé."],
["A","那周六呢？我请你吃饭。","nà zhōuliù ne? wǒ qǐng nǐ chī fàn.","Thế thứ bảy? Tôi mời bạn ăn."],["B","你太客气了。周六可以。","nǐ tài kèqi le. zhōuliù kěyǐ.","Bạn khách sáo quá. Thứ bảy được."],
["A","那就这么定了！","nà jiù zhème dìng le!","Vậy quyết thế nhé!"]]},
{t:"Khẩu ngữ: điện thoại & đời sống số",g:"Đời sống ở Trung Quốc xoay quanh điện thoại: 外卖 (đồ ăn giao tận nơi), 快递 (chuyển phát), 扫 (quét mã), 群 (nhóm chat), 位置 (vị trí). 没 + danh từ + 了 = hết … rồi: 没电了. A 还是 B = A hay B (câu hỏi lựa chọn).",p:[

["网不好","wǎng bù hǎo","Mạng kém"],["回头聊","huítóu liáo","Nói chuyện sau nhé"]],
d:[["A","我饿了，我们点外卖吧。","wǒ è le, wǒmen diǎn wàimài ba.","Tôi đói rồi, mình gọi đồ ăn đi."],["B","好。你点吧，我手机没电了。","hǎo. nǐ diǎn ba, wǒ shǒujī méi diàn le.","Được. Bạn gọi đi, máy tôi hết pin rồi."],
["A","这里网不好。你想吃什么？","zhèlǐ wǎng bù hǎo. nǐ xiǎng chī shénme?","Ở đây mạng kém. Bạn muốn ăn gì?"],["B","随便。对了，拉我进群吧。","suíbiàn. duì le, lā wǒ jìn qún ba.","Tùy. À, kéo tôi vào nhóm đi."],
["A","好，我扫你。","hǎo, wǒ sǎo nǐ.","Được, tôi quét bạn."]]},

["入乡随俗","rù xiāng suí sú","Nhập gia tùy tục"],["一路平安","yí lù píng'ān","Thượng lộ bình an"],["恭喜恭喜","gōngxǐ gōngxǐ","Chúc mừng chúc mừng"],
["辛苦了","xīnkǔ le","Vất vả rồi"],["不见不散","bú jiàn bú sàn","Không gặp không về"]],
d:[["A","你的中文怎么样了？","nǐ de Zhōngwén zěnmeyàng le?","Tiếng Trung của bạn sao rồi?"],["B","马马虎虎。我每天学一个小时。","mǎmǎhūhū. wǒ měi tiān xué yí ge xiǎoshí.","Tàm tạm. Mỗi ngày tôi học một tiếng."],
["A","辛苦了！周六我们一起练习吧。","xīnkǔ le! zhōuliù wǒmen yìqǐ liànxí ba.","Vất vả rồi! Thứ bảy mình cùng luyện nhé."],["B","好，一言为定。","hǎo, yì yán wéi dìng.","Được, chốt nhé."],

{t:"Ghép từ: động từ + tân ngữ, 好 / 难 + động từ",g:"Nhiều 'động từ' tiếng Trung thật ra là động từ + tân ngữ: 吃饭 = ăn + cơm. 好 + động từ = dễ / ngon / hay; 难 + động từ = khó / dở. Ghép được hàng trăm từ từ vài chục chữ.",gr:[

{t:"Ghép câu hỏi: 吗, từ để hỏi, A 不 A",g:"3 cách đặt câu hỏi. (1) Câu kể + 吗. (2) Từ để hỏi (什么, 谁, 哪儿, 怎么…) đặt đúng vị trí của câu trả lời, KHÔNG đảo lên đầu, không thêm 吗. (3) Động từ/tính từ + 不 + lặp lại: 去不去. Riêng 有 dùng 有没有.",gr:[
{h:"Câu kể + 吗",f:["你{}吗？","nǐ {} ma?","Bạn {} không?"],it:[["忙","máng","bận"],["累","lèi","mệt"],["饿","è","đói"],["渴","kě","khát"],["冷","lěng","lạnh"],["高兴","gāoxìng","vui"],["喜欢中国菜","xǐhuan Zhōngguó cài","thích món Trung"],["认识他","rènshi tā","quen anh ấy"],["有时间","yǒu shíjiān","có thời gian"],["明白","míngbai","hiểu"]]},
{h:"Từ để hỏi đứng ở chỗ của câu trả lời",it:[["这是什么？","zhè shì shénme?","Đây là cái gì?"],["他是谁？","tā shì shéi?","Anh ấy là ai?"],["你去哪儿？","nǐ qù nǎr?","Bạn đi đâu?"],["你什么时候来？","nǐ shénme shíhou lái?","Khi nào bạn đến?"],["你为什么不去？","nǐ wèishénme bú qù?","Vì sao bạn không đi?"],["这个怎么卖？","zhège zěnme mài?","Cái này bán thế nào?"],["你要哪个？","nǐ yào nǎge?","Bạn muốn cái nào?"],["你有几个孩子？","nǐ yǒu jǐ ge háizi?","Bạn có mấy đứa con?"],["一共多少钱？","yígòng duōshao qián?","Tổng cộng bao nhiêu tiền?"],["你怎么去公司？","nǐ zěnme qù gōngsī?","Bạn đến công ty bằng gì?"]]},

{t:"Ghép câu phủ định: 不, 没, 别",g:"不 = không (thói quen, ý muốn, tính chất, tương lai). 没(有) = chưa / đã không / không có (việc đã qua, sở hữu). 别 = đừng (cấm, khuyên). Sai phổ biến: nói 我不有钱 (đúng là 我没有钱) và 我不吃了早饭 (đúng là 我没吃早饭).",gr:[
{h:"不 = không",it:[["我不喝酒","wǒ bù hē jiǔ","Tôi không uống rượu"],["我不知道","wǒ bù zhīdào","Tôi không biết"],["他不在家","tā bú zài jiā","Anh ấy không ở nhà"],["我不喜欢","wǒ bù xǐhuan","Tôi không thích"],["今天不上班","jīntiān bú shàngbān","Hôm nay không đi làm"],["我不饿","wǒ bú è","Tôi không đói"],["这个不贵","zhège bú guì","Cái này không đắt"],["我不认识他","wǒ bú rènshi tā","Tôi không quen anh ấy"],["明天我不来","míngtiān wǒ bù lái","Mai tôi không đến"],["我不太懂","wǒ bú tài dǒng","Tôi không hiểu lắm"]]},

{h:"别 + động từ = đừng…",f:["别{}","bié {}","Đừng {}"],it:[["走","zǒu","đi"],["说话","shuōhuà","nói chuyện"],["着急","zháojí","sốt ruột"],["生气","shēngqì","giận"],["忘了","wàng le","quên"],["迟到","chídào","đến muộn"],["客气","kèqi","khách sáo"],["开玩笑","kāi wánxiào","đùa"],["动","dòng","động đậy"],["哭","kū","khóc"]]}]},
{t:"Ghép câu ghép: 因为, 虽然, 如果",g:"Nối hai vế bằng cặp liên từ. 因为 A，所以 B = vì A nên B. 虽然 A，但是 B = tuy A nhưng B. 如果 A，就 B = nếu A thì B (就 đứng SAU chủ ngữ vế hai: 我就去). Khẩu ngữ hay lược 因为 hoặc 所以, nhưng giữ 但是 và 就.",gr:[
{h:"因为…所以… = vì…nên…",it:[["因为下雨，所以我不去","yīnwèi xià yǔ, suǒyǐ wǒ bú qù","Vì mưa nên tôi không đi"],["因为太贵，所以我没买","yīnwèi tài guì, suǒyǐ wǒ méi mǎi","Vì đắt quá nên tôi không mua"],["因为我病了，所以请假","yīnwèi wǒ bìng le, suǒyǐ qǐngjià","Vì tôi ốm nên xin nghỉ"],["因为堵车，所以迟到了","yīnwèi dǔchē, suǒyǐ chídào le","Vì tắc đường nên đến muộn"],["因为很累，所以想睡觉","yīnwèi hěn lèi, suǒyǐ xiǎng shuìjiào","Vì rất mệt nên muốn ngủ"],["因为喜欢，所以学中文","yīnwèi xǐhuan, suǒyǐ xué Zhōngwén","Vì thích nên học tiếng Trung"],["因为没钱，所以不能去","yīnwèi méi qián, suǒyǐ bù néng qù","Vì không có tiền nên không đi được"],["因为天气好，所以去公园","yīnwèi tiānqì hǎo, suǒyǐ qù gōngyuán","Vì trời đẹp nên đi công viên"],["因为机器坏了，所以停工","yīnwèi jīqì huài le, suǒyǐ tínggōng","Vì máy hỏng nên ngừng làm"],["因为要加班，所以晚回家","yīnwèi yào jiābān, suǒyǐ wǎn huí jiā","Vì phải tăng ca nên về muộn"]]},
{h:"虽然…但是… = tuy…nhưng…",it:[["虽然很贵，但是很好","suīrán hěn guì, dànshì hěn hǎo","Tuy đắt nhưng rất tốt"],["虽然很累，但是很开心","suīrán hěn lèi, dànshì hěn kāixīn","Tuy mệt nhưng rất vui"],["虽然下雨，但是我要去","suīrán xià yǔ, dànshì wǒ yào qù","Tuy mưa nhưng tôi vẫn phải đi"],["虽然很难，但是我想学","suīrán hěn nán, dànshì wǒ xiǎng xué","Tuy khó nhưng tôi muốn học"],["虽然他很忙，但是他来了","suīrán tā hěn máng, dànshì tā lái le","Tuy anh ấy bận nhưng anh ấy đã đến"],["虽然不远，但是没有车","suīrán bù yuǎn, dànshì méiyǒu chē","Tuy không xa nhưng không có xe"],["虽然工资不高，但是工作不累","suīrán gōngzī bù gāo, dànshì gōngzuò bú lèi","Tuy lương không cao nhưng việc không mệt"],["虽然我不饿，但是想吃","suīrán wǒ bú è, dànshì xiǎng chī","Tuy tôi không đói nhưng muốn ăn"],["虽然很小，但是很干净","suīrán hěn xiǎo, dànshì hěn gānjìng","Tuy nhỏ nhưng rất sạch"],["虽然学了一年，但是说得不好","suīrán xué le yì nián, dànshì shuō de bù hǎo","Tuy học một năm rồi nhưng nói chưa tốt"]]},
{h:"如果…就… = nếu…thì…",it:[["如果下雨，我就不去","rúguǒ xià yǔ, wǒ jiù bú qù","Nếu mưa thì tôi không đi"],["如果有空，就来我家","rúguǒ yǒu kòng, jiù lái wǒ jiā","Nếu rảnh thì đến nhà tôi"],["如果便宜，我就买","rúguǒ piányi, wǒ jiù mǎi","Nếu rẻ thì tôi mua"],["如果你去，我就去","rúguǒ nǐ qù, wǒ jiù qù","Nếu bạn đi thì tôi đi"],["如果不懂，就问我","rúguǒ bù dǒng, jiù wèn wǒ","Nếu không hiểu thì hỏi tôi"],["如果累了，就休息","rúguǒ lèi le, jiù xiūxi","Nếu mệt thì nghỉ"],["如果迟到，就打电话","rúguǒ chídào, jiù dǎ diànhuà","Nếu đến muộn thì gọi điện"],["如果有问题，就找组长","rúguǒ yǒu wèntí, jiù zhǎo zǔzhǎng","Nếu có vấn đề thì tìm tổ trưởng"],["如果明天不忙，我们就见面","rúguǒ míngtiān bù máng, wǒmen jiù jiànmiàn","Nếu mai không bận thì mình gặp nhau"],["如果你喜欢，就送给你","rúguǒ nǐ xǐhuan, jiù sòng gěi nǐ","Nếu bạn thích thì tặng bạn"]]}]},
{t:"Ghép bổ ngữ: kết quả, hướng, mức độ",g:"Tiếng Trung ghép thêm một chữ SAU động từ để nói kết quả: 吃 (ăn) + 完 (xong) = 吃完. Hướng: 来 (về phía người nói), 去 (ra xa người nói). Mức độ: động từ + 得 + tính từ: 说得很好 (nói rất tốt).",gr:[
{h:"Động từ + kết quả (完, 好, 到, 懂, 错, 会, 住, 见)",it:[["我吃完了","wǒ chī wán le","Tôi ăn xong rồi"],["我写好了","wǒ xiě hǎo le","Tôi viết xong xuôi rồi"],["我找到了","wǒ zhǎo dào le","Tôi tìm thấy rồi"],["我听懂了","wǒ tīng dǒng le","Tôi nghe hiểu rồi"],["我看错了","wǒ kàn cuò le","Tôi nhìn nhầm rồi"],["我买到了","wǒ mǎi dào le","Tôi mua được rồi"],["我学会了","wǒ xué huì le","Tôi học được rồi"],["我记住了","wǒ jì zhù le","Tôi nhớ rồi"],["我看见他了","wǒ kànjiàn tā le","Tôi nhìn thấy anh ấy rồi"],["我说错了","wǒ shuō cuò le","Tôi nói sai rồi"]]},

{t:"Ghép câu: 把, 被, 比",g:"把: chủ ngữ + 把 + vật + động từ + kết quả (đưa vật lên trước động từ, nhấn việc xử lý nó). 被: vật + 被 + (ai) + động từ = bị / được. 比: A 比 B + tính từ (KHÔNG thêm 很: 我比他高). Phủ định so sánh: A 没有 B + tính từ.",gr:[

{h:"被 = bị / được",it:[["我的手机被偷了","wǒ de shǒujī bèi tōu le","Điện thoại của tôi bị trộm rồi"],["他被老板批评了","tā bèi lǎobǎn pīpíng le","Anh ấy bị sếp phê bình"],["蛋糕被吃完了","dàngāo bèi chī wán le","Bánh bị ăn hết rồi"],["我被雨淋了","wǒ bèi yǔ lín le","Tôi bị dính mưa"],["门被风吹开了","mén bèi fēng chuī kāi le","Cửa bị gió thổi mở"],["我被吵醒了","wǒ bèi chǎo xǐng le","Tôi bị đánh thức"],["他被公司录用了","tā bèi gōngsī lùyòng le","Anh ấy được công ty nhận"],["杯子被打破了","bēizi bèi dǎ pò le","Cái cốc bị đánh vỡ"],["我被骗了","wǒ bèi piàn le","Tôi bị lừa rồi"],["票被卖完了","piào bèi mài wán le","Vé bị bán hết rồi"]]},

{t:"Ghép thể: 正在, 快要…了, 着",g:"正在 + động từ = đang làm (hành động). 快要 + động từ + 了 = sắp…rồi. Động từ + 着 = trạng thái đang duy trì (cửa đang mở, đang mặc, đang cầm). Phân biệt: 他正在穿衣服 (đang mặc vào) và 他穿着红衣服 (đang mặc sẵn trên người).",gr:[
{h:"正在 + động từ = đang…",f:["我正在{}","wǒ zhèngzài {}","Tôi đang {}"],it:[["吃饭","chī fàn","ăn cơm"],["开会","kāihuì","họp"],["工作","gōngzuò","làm việc"],["学习","xuéxí","học"],["打电话","dǎ diànhuà","gọi điện"],["洗澡","xǐzǎo","tắm"],["做饭","zuò fàn","nấu cơm"],["等车","děng chē","đợi xe"],["看手机","kàn shǒujī","xem điện thoại"],["找钥匙","zhǎo yàoshi","tìm chìa khóa"]]},
{h:"快要…了 = sắp…rồi",it:[["快要下雨了","kuàiyào xià yǔ le","Sắp mưa rồi"],["快要下班了","kuàiyào xiàbān le","Sắp tan làm rồi"],["火车快要开了","huǒchē kuàiyào kāi le","Tàu sắp chạy rồi"],["我快要到了","wǒ kuàiyào dào le","Tôi sắp đến rồi"],["饭快要好了","fàn kuàiyào hǎo le","Cơm sắp xong rồi"],["手机快要没电了","shǒujī kuàiyào méi diàn le","Điện thoại sắp hết pin rồi"],["他快要结婚了","tā kuàiyào jiéhūn le","Anh ấy sắp cưới rồi"],["春节快要到了","Chūnjié kuàiyào dào le","Sắp đến Tết rồi"],["我快要迟到了","wǒ kuàiyào chídào le","Tôi sắp muộn rồi"],["电影快要开始了","diànyǐng kuàiyào kāishǐ le","Phim sắp bắt đầu rồi"]]},
{h:"Động từ + 着 = đang ở trạng thái",it:[["门开着","mén kāi zhe","Cửa đang mở"],["灯亮着","dēng liàng zhe","Đèn đang sáng"],["他站着","tā zhàn zhe","Anh ấy đang đứng"],["她笑着说","tā xiào zhe shuō","Cô ấy cười nói"],["我带着伞","wǒ dài zhe sǎn","Tôi mang theo ô"],["桌子上放着一本书","zhuōzi shang fàng zhe yì běn shū","Trên bàn đặt một quyển sách"],["他穿着红衣服","tā chuān zhe hóng yīfu","Anh ấy mặc áo đỏ"],["你拿着","nǐ ná zhe","Bạn cầm lấy"],["外面下着雨","wàimiàn xià zhe yǔ","Bên ngoài đang mưa"],["大家都等着你","dàjiā dōu děng zhe nǐ","Mọi người đang đợi bạn"]]}]},
{t:"Ghép khả năng: 得 / 不 và thời lượng",g:"Động từ + 得 + kết quả = làm được; động từ + 不 + kết quả = làm không được (do khả năng, điều kiện). Khác 不能 (không được phép). Thời lượng đứng SAU động từ: 我学了两年 (không nói 我两年学了).",gr:[
{h:"Động từ + 得 + kết quả = …được",it:[["我听得懂","wǒ tīng de dǒng","Tôi nghe hiểu được"],["我看得见","wǒ kàn de jiàn","Tôi nhìn thấy được"],["我吃得完","wǒ chī de wán","Tôi ăn hết được"],["我买得起","wǒ mǎi de qǐ","Tôi mua nổi"],["我做得到","wǒ zuò de dào","Tôi làm được"],["我找得到","wǒ zhǎo de dào","Tôi tìm được"],["我记得住","wǒ jì de zhù","Tôi nhớ được"],["来得及","lái de jí","Còn kịp"],["我睡得着","wǒ shuì de zháo","Tôi ngủ được"],["你听得清楚吗？","nǐ tīng de qīngchu ma?","Bạn nghe rõ không?"]]},
{h:"Động từ + 不 + kết quả = không…được",it:[["我听不懂","wǒ tīng bu dǒng","Tôi nghe không hiểu"],["我看不见","wǒ kàn bu jiàn","Tôi không nhìn thấy"],["我吃不完","wǒ chī bu wán","Tôi ăn không hết"],["我买不起","wǒ mǎi bu qǐ","Tôi mua không nổi"],["我做不到","wǒ zuò bu dào","Tôi không làm được"],["我找不到","wǒ zhǎo bu dào","Tôi tìm không thấy"],["我记不住","wǒ jì bu zhù","Tôi không nhớ nổi"],["来不及了","lái bu jí le","Không kịp nữa rồi"],["我睡不着","wǒ shuì bu zháo","Tôi không ngủ được"],["我受不了","wǒ shòu bu liǎo","Tôi chịu không nổi"]]},
{h:"Động từ + 了 + thời lượng",it:[["我等了半个小时","wǒ děng le bàn ge xiǎoshí","Tôi đợi nửa tiếng rồi"],["我学了两年","wǒ xué le liǎng nián","Tôi học hai năm rồi"],["他睡了十个小时","tā shuì le shí ge xiǎoshí","Anh ấy ngủ mười tiếng"],["我们走了很久","wǒmen zǒu le hěn jiǔ","Chúng tôi đi rất lâu"],["我在这儿住了三年","wǒ zài zhèr zhù le sān nián","Tôi sống ở đây ba năm rồi"],["我休息了一天","wǒ xiūxi le yì tiān","Tôi nghỉ một ngày"],["雨下了一个晚上","yǔ xià le yí ge wǎnshang","Mưa suốt một đêm"],["我想了很长时间","wǒ xiǎng le hěn cháng shíjiān","Tôi nghĩ rất lâu"],["他病了一个星期","tā bìng le yí ge xīngqī","Anh ấy ốm một tuần"],["我工作了五年","wǒ gōngzuò le wǔ nián","Tôi đi làm năm năm rồi"]]}]},
{t:"Ghép liên từ nâng cao: 一边, 不但, 越",g:"一边 A 一边 B = vừa A vừa B (hai hành động cùng lúc). 不但 A，而且 B = không những A mà còn B. 越来越 + tính từ = ngày càng… 越 A 越 B = càng A càng B.",gr:[
{h:"一边…一边… = vừa…vừa…",it:[["我一边吃饭一边看电视","wǒ yìbiān chī fàn yìbiān kàn diànshì","Tôi vừa ăn cơm vừa xem tivi"],["他一边走一边打电话","tā yìbiān zǒu yìbiān dǎ diànhuà","Anh ấy vừa đi vừa gọi điện"],["我一边工作一边学习","wǒ yìbiān gōngzuò yìbiān xuéxí","Tôi vừa làm vừa học"],["她一边做饭一边唱歌","tā yìbiān zuò fàn yìbiān chàng gē","Cô ấy vừa nấu cơm vừa hát"],["我们一边喝茶一边聊天","wǒmen yìbiān hē chá yìbiān liáotiān","Chúng tôi vừa uống trà vừa trò chuyện"],["他一边听一边写","tā yìbiān tīng yìbiān xiě","Anh ấy vừa nghe vừa viết"],["我一边开车一边听音乐","wǒ yìbiān kāichē yìbiān tīng yīnyuè","Tôi vừa lái xe vừa nghe nhạc"],["孩子一边哭一边说","háizi yìbiān kū yìbiān shuō","Đứa bé vừa khóc vừa nói"],["我一边等车一边看手机","wǒ yìbiān děng chē yìbiān kàn shǒujī","Tôi vừa đợi xe vừa xem điện thoại"],["他一边上班一边照顾孩子","tā yìbiān shàngbān yìbiān zhàogù háizi","Anh ấy vừa đi làm vừa chăm con"]]},
{h:"不但…而且… = không những…mà còn…",it:[["他不但会说中文，而且会说英语","tā búdàn huì shuō Zhōngwén, érqiě huì shuō Yīngyǔ","Anh ấy không những biết tiếng Trung mà còn biết tiếng Anh"],["这个不但便宜，而且好用","zhège búdàn piányi, érqiě hǎoyòng","Cái này không những rẻ mà còn dễ dùng"],["她不但漂亮，而且聪明","tā búdàn piàoliang, érqiě cōngming","Cô ấy không những đẹp mà còn thông minh"],["今天不但冷，而且下雨","jīntiān búdàn lěng, érqiě xià yǔ","Hôm nay không những lạnh mà còn mưa"],["这家店不但好吃，而且不贵","zhè jiā diàn búdàn hǎochī, érqiě bú guì","Quán này không những ngon mà còn không đắt"],["他不但迟到，而且没带东西","tā búdàn chídào, érqiě méi dài dōngxi","Anh ấy không những đến muộn mà còn không mang đồ"],["我不但累，而且饿","wǒ búdàn lèi, érqiě è","Tôi không những mệt mà còn đói"],["这里不但干净，而且安静","zhèlǐ búdàn gānjìng, érqiě ānjìng","Ở đây không những sạch mà còn yên tĩnh"],["他不但工作好，而且人也好","tā búdàn gōngzuò hǎo, érqiě rén yě hǎo","Anh ấy không những làm việc tốt mà con người cũng tốt"],["学中文不但有用，而且有意思","xué Zhōngwén búdàn yǒuyòng, érqiě yǒu yìsi","Học tiếng Trung không những có ích mà còn thú vị"]]},
{h:"越来越… / 越…越…",it:[["天气越来越冷","tiānqì yuèláiyuè lěng","Trời ngày càng lạnh"],["东西越来越贵","dōngxi yuèláiyuè guì","Đồ ngày càng đắt"],["你的中文越来越好","nǐ de Zhōngwén yuèláiyuè hǎo","Tiếng Trung của bạn ngày càng tốt"],["我越来越忙","wǒ yuèláiyuè máng","Tôi ngày càng bận"],["他越来越胖","tā yuèláiyuè pàng","Anh ấy ngày càng béo"],["雨越下越大","yǔ yuè xià yuè dà","Mưa càng lúc càng to"],["我越学越喜欢","wǒ yuè xué yuè xǐhuan","Tôi càng học càng thích"],["越快越好","yuè kuài yuè hǎo","Càng nhanh càng tốt"],["越多越好","yuè duō yuè hǎo","Càng nhiều càng tốt"],["他越说越生气","tā yuè shuō yuè shēngqì","Anh ấy càng nói càng giận"]]}]},
{t:"Ghép nhấn mạnh: 是…的, 连…都, 一点儿也不",g:"是…的 nhấn vào thời gian, nơi chốn, cách thức của việc ĐÃ xảy ra: 我是昨天来的 (tôi đến HÔM QUA). 连…都 = ngay cả…cũng. 一点儿也不 / 一…也没 = hoàn toàn không, một … cũng không.",gr:[
{h:"是…的 = nhấn khi nào, ở đâu, bằng cách nào",it:[["我是昨天来的","wǒ shì zuótiān lái de","Tôi đến hôm qua"],["我是坐飞机来的","wǒ shì zuò fēijī lái de","Tôi đến bằng máy bay"],["我是在越南出生的","wǒ shì zài Yuènán chūshēng de","Tôi sinh ra ở Việt Nam"],["你是怎么来的？","nǐ shì zěnme lái de?","Bạn đến bằng cách nào?"],["你是什么时候到的？","nǐ shì shénme shíhou dào de?","Bạn đến lúc nào?"],["这是在哪儿买的？","zhè shì zài nǎr mǎi de?","Cái này mua ở đâu?"],["我是跟朋友一起去的","wǒ shì gēn péngyou yìqǐ qù de","Tôi đi cùng bạn"],["他是去年毕业的","tā shì qùnián bìyè de","Anh ấy tốt nghiệp năm ngoái"],["这是谁做的？","zhè shì shéi zuò de?","Cái này ai làm?"],["我是在网上学的","wǒ shì zài wǎngshàng xué de","Tôi học trên mạng"]]},
{h:"连…都… = ngay cả…cũng…",it:[["连孩子都知道","lián háizi dōu zhīdào","Ngay cả trẻ con cũng biết"],["我连早饭都没吃","wǒ lián zǎofàn dōu méi chī","Tôi ngay cả bữa sáng cũng chưa ăn"],["他连名字都不会写","tā lián míngzi dōu bú huì xiě","Anh ấy ngay cả tên cũng không biết viết"],["连周末都要加班","lián zhōumò dōu yào jiābān","Ngay cả cuối tuần cũng phải tăng ca"],["我连一块钱都没有","wǒ lián yí kuài qián dōu méiyǒu","Tôi một tệ cũng không có"],["连老师都不知道","lián lǎoshī dōu bù zhīdào","Ngay cả giáo viên cũng không biết"],["他连饭都不想吃","tā lián fàn dōu bù xiǎng chī","Anh ấy ngay cả cơm cũng không muốn ăn"],["我连他的电话都没有","wǒ lián tā de diànhuà dōu méiyǒu","Tôi ngay cả số điện thoại của anh ấy cũng không có"],["连我都听不懂","lián wǒ dōu tīng bu dǒng","Ngay cả tôi cũng nghe không hiểu"],["她连水都没喝","tā lián shuǐ dōu méi hē","Cô ấy ngay cả nước cũng chưa uống"]]},
{h:"一点儿也不 / 一…也没 = hoàn toàn không",it:[["我一点儿也不累","wǒ yìdiǎnr yě bú lèi","Tôi không mệt chút nào"],["这个一点儿也不贵","zhège yìdiǎnr yě bú guì","Cái này không đắt chút nào"],["我一点儿也不饿","wǒ yìdiǎnr yě bú è","Tôi không đói chút nào"],["他一点儿也不高兴","tā yìdiǎnr yě bù gāoxìng","Anh ấy không vui chút nào"],["我一点儿也不知道","wǒ yìdiǎnr yě bù zhīdào","Tôi hoàn toàn không biết"],["这儿一点儿也不冷","zhèr yìdiǎnr yě bù lěng","Ở đây không lạnh chút nào"],["我一点儿也没变","wǒ yìdiǎnr yě méi biàn","Tôi không thay đổi chút nào"],["我一句也听不懂","wǒ yí jù yě tīng bu dǒng","Một câu tôi cũng nghe không hiểu"],["他一次也没来过","tā yí cì yě méi lái guo","Anh ấy chưa đến lần nào"],["我一分钱也没带","wǒ yì fēn qián yě méi dài","Tôi không mang một xu nào"]]}]},
